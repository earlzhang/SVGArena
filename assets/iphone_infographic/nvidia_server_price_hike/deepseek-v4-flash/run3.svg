<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC', 'Songti SC', 'Heiti SC', sans-serif" lang="zh-CN">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F5F6F8"/>

  <!-- 头部 -->
  <text x="38" y="48" font-size="11" fill="#8E8E93" font-weight="500">财联社 · 2026年8月23日</text>
  <text x="366" y="48" text-anchor="end" font-size="11" fill="#76B900" font-weight="700">NVIDIA</text>

  <rect x="24" y="60" width="4" height="30" rx="2" fill="#76B900"/>
  <text x="38" y="84" font-size="22" font-weight="700" fill="#1D1D1F">英伟达服务器传出涨价消息</text>
  <text x="38" y="114" font-size="17" font-weight="700" fill="#D93025">涨幅“很多情况下超过15%”</text>
  <text x="38" y="140" font-size="13" fill="#6E6E73">内存成本飙升，搭载AI芯片的服务器明年初起普涨</text>

  <!-- 卡片1：核心信息 -->
  <rect x="24" y="158" width="342" height="124" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <rect x="32" y="174" width="72" height="20" rx="10" fill="#FDECEB"/>
  <text x="41" y="188" font-size="11" font-weight="600" fill="#D93025">核心信息</text>

  <text x="40" y="245" font-size="50" font-weight="800" fill="#D93025">&gt;15%</text>

  <text x="146" y="222" font-size="15" font-weight="600" fill="#1D1D1F">多款AI服务器将涨价</text>
  <text x="146" y="246" font-size="12" fill="#555555">搭载 Vera Rubin / Grace Blackwell</text>
  <text x="146" y="268" font-size="12" fill="#555555">明年初出货 · 涨幅看芯片内存</text>

  <!-- 卡片2：市场先例 -->
  <rect x="24" y="290" width="342" height="110" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <rect x="32" y="306" width="72" height="20" rx="10" fill="#FEF1E5"/>
  <text x="41" y="320" font-size="11" font-weight="600" fill="#C85A00">市场先例</text>

  <text x="32" y="350" font-size="14" font-weight="600" fill="#1D1D1F">RTX 5080 显卡一个月跳涨</text>

  <text x="32" y="380" font-size="26" font-weight="700" fill="#8E8E93">¥8,000</text>
  <line x1="122" y1="374" x2="200" y2="374" stroke="#D93025" stroke-width="3"/>
  <polygon points="200,366 218,374 200,382" fill="#D93025"/>
  <text x="150" y="366" font-size="12" font-weight="700" fill="#D93025">+50%</text>
  <text x="222" y="380" font-size="26" font-weight="700" fill="#D93025">¥12,000</text>

  <!-- 卡片3：整机价格 -->
  <rect x="24" y="408" width="342" height="112" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <rect x="32" y="424" width="72" height="20" rx="10" fill="#E8F1FB"/>
  <text x="41" y="438" font-size="11" font-weight="600" fill="#0066CC">整机价格</text>

  <text x="32" y="468" font-size="13.5" font-weight="600" fill="#1D1D1F">GB200 NVL72 · Blackwell</text>
  <text x="362" y="468" text-anchor="end" font-size="14" font-weight="700" fill="#0066CC">280万–340万美元</text>

  <text x="32" y="494" font-size="13.5" font-weight="600" fill="#1D1D1F">VR200 NVL72 · Vera Rubin</text>
  <text x="362" y="494" text-anchor="end" font-size="14" font-weight="700" fill="#0066CC">500万–700万美元</text>

  <text x="32" y="512" font-size="10" fill="#8E8E93">NVL72整机柜参考价，配置不同存在波动</text>

  <!-- 卡片4：财报时间 -->
  <rect x="24" y="528" width="342" height="134" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <rect x="32" y="544" width="72" height="20" rx="10" fill="#F0EAF8"/>
  <text x="41" y="558" font-size="11" font-weight="600" fill="#7B4FC0">财报时间</text>

  <text x="32" y="588" font-size="14" font-weight="600" fill="#1D1D1F">下周三美股盘后发布最新财报</text>
  <text x="32" y="612" font-size="12" fill="#555555">上季：营收 816亿美元 · 毛利率75%（上年同期60.5%）</text>
  <text x="32" y="634" font-size="12" fill="#555555">本季指引：毛利率 74.9% - 75%</text>
  <text x="32" y="656" font-size="13" font-weight="600" fill="#D93025">关注：存储涨价会侵蚀算力龙头利润率？</text>

  <!-- 卡片5：产业链影响 -->
  <rect x="24" y="672" width="342" height="118" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <rect x="32" y="688" width="72" height="20" rx="10" fill="#E9F5DD"/>
  <text x="41" y="702" font-size="11" font-weight="600" fill="#5B8C00">产业链影响</text>

  <text x="32" y="730" font-size="13" fill="#3A3A3C">苹果、高通已因芯片短缺提价</text>
  <text x="32" y="754" font-size="13" fill="#3A3A3C">亚马逊、微软、谷歌、Meta加速自研芯片</text>
  <text x="32" y="778" font-size="13" fill="#3A3A3C">挑战者需锁定三星 / SK海力士 / 美光供应</text>

  <!-- 页脚 -->
  <text x="195" y="818" text-anchor="middle" font-size="11" fill="#9A9A9E">来源：财联社 · 编辑 史正丞</text>
</svg>