<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="PingFang SC, Hiragino Sans GB, STHeiti, sans-serif">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.05"/>
  </filter>
  <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>
</defs>

<rect width="390" height="844" fill="#F6F8FB"/>

<!-- Header -->
<rect x="24" y="22" width="86" height="24" rx="12" fill="#E0E7FF"/>
<text x="67" y="38" font-size="12" font-weight="600" fill="#4338CA" text-anchor="middle">财联社 要闻</text>

<g transform="translate(316,22)" stroke="#76B900" fill="none" stroke-width="2" opacity="0.9">
  <rect x="0.5" y="0.5" width="49" height="46" rx="8" fill="#76B900" fill-opacity="0.12"/>
  <rect x="10" y="8" width="30" height="30" rx="4"/>
  <path d="M20 0v8M30 0v8M20 38v8M30 38v8M0 15h8M0 25h8M42 15h8M42 25h8"/>
</g>

<text x="24" y="74" font-size="23" font-weight="700" fill="#111827">英伟达服务器传出涨价消息</text>
<text x="24" y="104" font-size="16" font-weight="600" fill="#DC2626">▲ 涨幅"很多情况下超过15%"</text>

<!-- 摘要 -->
<rect x="24" y="122" width="342" height="60" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="40" y="147" font-size="13" fill="#374151">内存成本飙升，最大客户已被告知：</text>
<text x="40" y="168" font-size="13" fill="#374151">Vera Rubin等服务器明年初普遍提价</text>

<!-- 关键卡片 -->
<rect x="24" y="194" width="165" height="90" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="40" y="220" font-size="12" fill="#6B7280">涨价幅度</text>
<text x="40" y="256" font-size="28" font-weight="700" fill="#DC2626">&gt;15%</text>
<text x="40" y="276" font-size="11" fill="#6B7280">很多情况下</text>

<rect x="201" y="194" width="165" height="90" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="217" y="220" font-size="12" fill="#6B7280">适用时间</text>
<text x="217" y="256" font-size="26" font-weight="700" fill="#2563EB">明年初</text>
<text x="216" y="278" font-size="9.5" fill="#6B7280">Vera Rubin/Grace Blackwell 等</text>

<rect x="24" y="292" width="165" height="90" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="40" y="318" font-size="12" fill="#6B7280">英伟达财报</text>
<text x="40" y="354" font-size="26" font-weight="700" fill="#D97706">下周三</text>
<text x="40" y="374" font-size="11" fill="#6B7280">美股盘后发布</text>

<rect x="201" y="292" width="165" height="90" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="217" y="318" font-size="12" fill="#6B7280">消费显卡 RTX 5080</text>
<text x="217" y="350" font-size="24" font-weight="700" fill="#DC2626">¥8k→¥12k</text>
<text x="217" y="374" font-size="10.5" fill="#6B7280">1个月从8千元涨到1.2万元</text>

<!-- AI服务器价格对比 -->
<rect x="24" y="400" width="4" height="18" rx="2" fill="url(#gTitle)"/>
<text x="36" y="415" font-size="17" font-weight="700" fill="#111827">AI服务器价格对比</text>
<text x="36" y="434" font-size="10" fill="#9CA3AF">按今年早前报价</text>
<text x="366" y="434" text-anchor="end" font-size="10" fill="#9CA3AF">单位：万美元/台</text>

<text x="24" y="462" font-size="12" font-weight="600" fill="#1E293B">NVL72 GB200</text>
<text x="140" y="462" font-size="11" fill="#9CA3AF">Blackwell架构</text>
<rect x="24" y="470" width="166" height="22" rx="6" fill="#2563EB"/>
<text x="107" y="485" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">280-340万美元</text>

<text x="24" y="508" font-size="12" font-weight="600" fill="#1E293B">NVL72 VR200</text>
<text x="140" y="508" font-size="11" fill="#9CA3AF">Vera Rubin架构</text>
<rect x="24" y="516" width="342" height="22" rx="6" fill="#7C3AED"/>
<text x="195" y="531" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">500-700万美元</text>

<rect x="24" y="556" width="342" height="28" rx="8" fill="#FEF2F2"/>
<text x="40" y="574" font-size="12" font-weight="600" fill="#B91C1C">15%涨幅 ≈ 单台额外成本 42万-105万美元</text>

<!-- 存储涨价关键问题 -->
<rect x="24" y="596" width="4" height="18" rx="2" fill="url(#gTitle)"/>
<text x="36" y="611" font-size="17" font-weight="700" fill="#111827">存储涨价关键问题</text>

<rect x="24" y="620" width="342" height="88" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="40" y="640" font-size="11" fill="#6B7280">英伟达最近季度财报（截至4月26日）</text>
<text x="40" y="672" font-size="20" font-weight="700" fill="#111827">营收 816亿美元</text>
<text x="226" y="672" font-size="20" font-weight="700" fill="#111827">毛利率 75%</text>
<text x="40" y="694" font-size="10" fill="#6B7280">上财年同期毛利率60.5% · Q2指引74.9%-75%</text>

<circle cx="32" cy="728" r="3" fill="#DC2626"/>
<text x="44" y="732" font-size="13" font-weight="600" fill="#DC2626">市场关注：存储涨价会否侵蚀英伟达利润率？</text>

<!-- 产业链连锁反应 -->
<rect x="24" y="748" width="4" height="18" rx="2" fill="url(#gTitle)"/>
<text x="36" y="763" font-size="17" font-weight="700" fill="#111827">产业链连锁反应</text>

<text x="24" y="792" font-size="12.5" fill="#374151">· 云服务商加速自研芯片：亚马逊 · 微软 · 谷歌 · Meta</text>
<text x="24" y="816" font-size="12.5" fill="#374151">· 挑战者关键在存储货源：三星 · SK海力士 · 美光</text>
<text x="24" y="838" font-size="10" fill="#9CA3AF">财联社8月23日 · 编辑 史正丞</text>
</svg>