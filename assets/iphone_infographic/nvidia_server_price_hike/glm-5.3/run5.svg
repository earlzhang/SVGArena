<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1D1D1F" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="#F6F7F9"/>

  <!-- 页眉 -->
  <circle cx="25" cy="27" r="3.5" fill="#76B900"/>
  <text x="35" y="31" font-size="11" fill="#86868B" letter-spacing="1.5">AI 算力观察</text>
  <text x="374" y="31" font-size="10" fill="#A8A8AD" text-anchor="end">财联社 · 8月23日</text>
  <text x="16" y="63" font-size="21" font-weight="600" fill="#1D1D1F">英伟达服务器传出涨价消息</text>
  <text x="16" y="90" font-size="21" font-weight="600" fill="#1D1D1F">涨幅「很多情况下超过 <tspan fill="#D9480F" font-weight="700">15%</tspan>」</text>

  <!-- 核心结论 -->
  <rect x="16" y="104" width="358" height="100" rx="16" fill="#FFFFFF" stroke="#ECECF0" filter="url(#cs)"/>
  <text x="36" y="157" font-size="42" font-weight="700" fill="#D9480F">15%<tspan font-size="22" dy="-16">+</tspan></text>
  <text x="36" y="184" font-size="10.5" fill="#86868B">很多情况下涨幅超过</text>
  <line x1="162" y1="126" x2="162" y2="182" stroke="#EEEEF2"/>
  <text x="178" y="134" font-size="13.5" font-weight="600" fill="#1D1D1F">明年初出货系统普遍提价</text>
  <rect x="178" y="144" width="78" height="21" rx="10.5" fill="#F1F7E8"/>
  <text x="217" y="158.5" font-size="10" fill="#4E7A00" text-anchor="middle" font-weight="500">Vera Rubin</text>
  <rect x="262" y="144" width="96" height="21" rx="10.5" fill="#F1F7E8"/>
  <text x="310" y="158.5" font-size="10" fill="#4E7A00" text-anchor="middle" font-weight="500">Grace Blackwell</text>
  <text x="178" y="188" font-size="10.5" fill="#98989D">内存成本飙升 · 代工厂已通知大客户</text>

  <!-- 价格阶梯 -->
  <rect x="16" y="216" width="358" height="152" rx="16" fill="#FFFFFF" stroke="#ECECF0" filter="url(#cs)"/>
  <text x="36" y="243" font-size="13.5" font-weight="600" fill="#1D1D1F">单台价格本已数百万美元</text>
  <text x="358" y="243" font-size="10" fill="#98989D" text-anchor="end">单位:美元</text>
  <text x="36" y="271" font-size="12" font-weight="500" fill="#1D1D1F">GB200 NVL72 机架</text>
  <text x="358" y="271" font-size="12.5" font-weight="700" fill="#D9480F" text-anchor="end">280–340万</text>
  <rect x="36" y="278" width="322" height="8" rx="4" fill="#F0F0F2"/>
  <rect x="36" y="278" width="156" height="8" rx="4" fill="#F4A883"/>
  <text x="36" y="313" font-size="12" font-weight="500" fill="#1D1D1F">VR200 NVL72 系统</text>
  <rect x="150" y="302" width="64" height="16" rx="8" fill="#FFF0E6"/>
  <text x="182" y="313.5" font-size="9.5" fill="#D9480F" text-anchor="middle">出货前询价</text>
  <text x="358" y="313" font-size="12.5" font-weight="700" fill="#D9480F" text-anchor="end">500–700万</text>
  <rect x="36" y="320" width="322" height="8" rx="4" fill="#F0F0F2"/>
  <rect x="36" y="320" width="322" height="8" rx="4" fill="#E8590C"/>
  <text x="36" y="349" font-size="10.5" fill="#98989D">· 15% 涨幅 ≈ 每台额外数十万、近百万美元开销</text>

  <!-- 消费端前奏 -->
  <rect x="16" y="380" width="358" height="92" rx="16" fill="#FFFFFF" stroke="#ECECF0" filter="url(#cs)"/>
  <text x="36" y="406" font-size="13.5" font-weight="600" fill="#1D1D1F">消费端前奏:显卡刚经历一轮暴涨</text>
  <rect x="36" y="418" width="84" height="30" rx="15" fill="#F0F0F2"/>
  <text x="78" y="437.5" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">¥8,000</text>
  <text x="150" y="429" font-size="11.5" font-weight="700" fill="#D9480F" text-anchor="middle">+50%</text>
  <path d="M130 437 H166" stroke="#E8590C" stroke-width="1.6"/>
  <path d="M163 432.5 L172 437 L163 441.5 Z" fill="#E8590C"/>
  <text x="150" y="453" font-size="9.5" fill="#98989D" text-anchor="middle">1 个月</text>
  <rect x="180" y="418" width="92" height="30" rx="15" fill="#FFE8D9"/>
  <text x="226" y="437.5" font-size="13" font-weight="700" fill="#D9480F" text-anchor="middle">¥12,000</text>
  <text x="288" y="431" font-size="11.5" font-weight="600" fill="#1D1D1F">RTX 5080</text>
  <text x="288" y="447" font-size="10" fill="#98989D">次旗舰显卡</text>

  <!-- 财报看点 -->
  <rect x="16" y="484" width="358" height="166" rx="16" fill="#FFFFFF" stroke="#ECECF0" filter="url(#cs)"/>
  <rect x="36" y="501" width="4" height="13" rx="2" fill="#76B900"/>
  <text x="48" y="512" font-size="13.5" font-weight="600" fill="#1D1D1F">下周三美股盘后 · 英伟达发布财报</text>
  <text x="36" y="533" font-size="11" fill="#6E6E73">市场关注:存储涨价是否会侵蚀算力龙头利润率</text>
  <line x1="36" y1="545" x2="358" y2="545" stroke="#F0F0F2"/>
  <text x="36" y="579" font-size="22" font-weight="700" fill="#1D1D1F">816<tspan font-size="11" font-weight="500" fill="#6E6E73"> 亿美元</tspan></text>
  <text x="36" y="599" font-size="10.5" fill="#98989D">上季营收</text>
  <line x1="136" y1="560" x2="136" y2="596" stroke="#F0F0F2"/>
  <text x="148" y="579" font-size="22" font-weight="700" fill="#1D1D1F">75<tspan font-size="13">%</tspan></text>
  <text x="148" y="599" font-size="10.5" fill="#98989D">当季毛利率</text>
  <line x1="244" y1="560" x2="244" y2="596" stroke="#F0F0F2"/>
  <text x="256" y="579" font-size="17" font-weight="700" fill="#1D1D1F">74.9–75<tspan font-size="11">%</tspan></text>
  <text x="256" y="599" font-size="10.5" fill="#98989D">本季毛利率指引</text>
  <line x1="36" y1="612" x2="358" y2="612" stroke="#F0F0F2"/>
  <text x="36" y="632" font-size="10.5" fill="#98989D">上年同期毛利率仅 60.5%,能否维持高位成财报焦点</text>

  <!-- 传导链 -->
  <rect x="16" y="662" width="358" height="88" rx="16" fill="#FFFFFF" stroke="#ECECF0" filter="url(#cs)"/>
  <text x="36" y="688" font-size="12.5" font-weight="600" fill="#1D1D1F">涨价传导链</text>
  <text x="358" y="688" font-size="10" fill="#98989D" text-anchor="end">算力性能高度依赖 DRAM 容量</text>
  <rect x="36" y="700" width="86" height="30" rx="15" fill="#F0F0F2"/>
  <text x="79" y="719.5" font-size="11" fill="#495057" text-anchor="middle">内存成本飙升</text>
  <path d="M128 715 H144" stroke="#C9C9CE" stroke-width="1.5"/>
  <path d="M141 710.8 L149.5 715 L141 719.2 Z" fill="#C9C9CE"/>
  <rect x="154" y="700" width="86" height="30" rx="15" fill="#FFE8D9"/>
  <text x="197" y="719.5" font-size="11" font-weight="600" fill="#D9480F" text-anchor="middle">服务器整机涨价</text>
  <path d="M246 715 H262" stroke="#C9C9CE" stroke-width="1.5"/>
  <path d="M259 710.8 L267.5 715 L259 719.2 Z" fill="#C9C9CE"/>
  <rect x="272" y="700" width="86" height="30" rx="15" fill="#F1F7E8"/>
  <text x="315" y="719.5" font-size="11" font-weight="600" fill="#4E7A00" text-anchor="middle">财报利润率?</text>

  <!-- 延伸信息 -->
  <circle cx="26" cy="768" r="3" fill="#76B900"/>
  <text x="37" y="772" font-size="11" fill="#495057">内存三巨头:<tspan font-weight="600" fill="#1D1D1F">三星·SK海力士·美光</tspan>,掌握 DRAM 供应话语权</text>
  <circle cx="26" cy="794" r="3" fill="#E8590C"/>
  <text x="37" y="798" font-size="11" fill="#495057">云厂商自研提速:<tspan font-weight="600" fill="#1D1D1F">亚马逊·微软·谷歌·Meta</tspan>,软件生态仍是护城河</text>

  <text x="195" y="826" font-size="9.5" fill="#A8A8AD" text-anchor="middle">来源:财联社(编辑 史正丞)· 2025年8月23日</text>
</svg>