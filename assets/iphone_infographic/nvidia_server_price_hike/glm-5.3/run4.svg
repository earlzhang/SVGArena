<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#1A1D24" flood-opacity="0.06"/>
    </filter>
  </defs>
  <style>
    text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','STHeiti',sans-serif;}
    .h1{font-size:19px;font-weight:700;fill:#171A21;letter-spacing:.2px;}
    .h2{font-size:13px;font-weight:700;fill:#171A21;}
    .lbl{font-size:10px;fill:#9AA0AA;}
    .body{font-size:11px;fill:#3E434B;}
    .note{font-size:10px;fill:#8A8F99;}
    .sub{font-size:9.5px;fill:#A8ADB6;}
  </style>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F5F6F8"/>
  <circle cx="372" cy="18" r="82" fill="#EAF3DC" opacity="0.55"/>
  <circle cx="8" cy="834" r="72" fill="#FBEDEC" opacity="0.5"/>

  <!-- 头部 -->
  <rect x="20" y="28" width="66" height="21" rx="10.5" fill="#E9F3DA"/>
  <text x="53" y="42.5" text-anchor="middle" font-size="10" font-weight="600" fill="#55800A">AI 硬件</text>
  <text x="370" y="42" text-anchor="end" font-size="10" fill="#9AA0AA">财联社 · 8月23日</text>
  <text x="20" y="78" class="h1">英伟达服务器传出涨价消息</text>
  <text x="20" y="103" class="h1">涨幅「很多情况下<tspan fill="#D93A3F">超过15%</tspan>」</text>
  <text x="20" y="124" font-size="11" fill="#8A8F99">内存芯片成本飙升，涨价的风吹到搭载英伟达AI芯片的服务器</text>

  <!-- 卡片A：核心涨幅 -->
  <rect x="20" y="138" width="350" height="102" rx="14" fill="#FFFFFF" filter="url(#cs)"/>
  <path d="M36 170 L41 162 L46 170 Z" fill="#D93A3F"/>
  <text x="52" y="170" class="lbl">很多情况下涨幅</text>
  <text x="34" y="206" fill="#D93A3F"><tspan font-size="22" font-weight="700">超</tspan><tspan font-size="38" font-weight="800"> 15%</tspan></text>
  <line x1="172" y1="156" x2="172" y2="224" stroke="#EDEEF1"/>
  <text x="188" y="168" class="lbl">适用机型</text>
  <text x="188" y="186" font-size="11" font-weight="600" fill="#3E434B">Vera Rubin · Grace Blackwell</text>
  <text x="188" y="206" class="body">明年初出货的系统起普遍提价</text>
  <text x="188" y="224" class="lbl">涨幅取决于芯片型号与内存配置</text>

  <!-- 卡片B：旗舰系统报价 -->
  <rect x="20" y="252" width="350" height="126" rx="14" fill="#FFFFFF" filter="url(#cs)"/>
  <text x="36" y="274" class="h2">旗舰AI服务器 · 单台报价</text>
  <text x="358" y="274" text-anchor="end" class="sub">单位：美元</text>
  <rect x="32" y="284" width="158" height="58" rx="10" fill="#F7F8FA"/>
  <text x="44" y="302" font-size="11" font-weight="600" fill="#4A4F57">NVL72 GB200</text>
  <text x="44" y="325" font-size="15" font-weight="800" fill="#171A21">$280–340万</text>
  <text x="44" y="338" class="sub">Blackwell · 现行报价</text>
  <rect x="200" y="284" width="158" height="58" rx="10" fill="#F7F8FA"/>
  <text x="212" y="302" font-size="11" font-weight="600" fill="#4A4F57">NVL72 VR200</text>
  <text x="212" y="325" font-size="15" font-weight="800" fill="#171A21">$500–700万</text>
  <text x="212" y="338" class="sub">Vera Rubin · 出货前询价</text>
  <text x="36" y="362" class="note">※ 15%涨幅 ≈ 每台额外数十万至近百万美元开销</text>

  <!-- 卡片C：传导路径 -->
  <rect x="20" y="390" width="350" height="92" rx="14" fill="#FFFFFF" filter="url(#cs)"/>
  <text x="36" y="412" class="h2">涨价传导路径</text>
  <rect x="32" y="424" width="96" height="30" rx="9" fill="#FBEDEC"/>
  <text x="80" y="443" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C0424A">内存成本飙升</text>
  <path d="M133 433.5 L142 439 L133 444.5" fill="none" stroke="#C3C8D2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="148" y="424" width="96" height="30" rx="9" fill="#FCF4E3"/>
  <text x="196" y="443" text-anchor="middle" font-size="10.5" font-weight="600" fill="#A2691A">服务器代工提价</text>
  <path d="M249 433.5 L258 439 L249 444.5" fill="none" stroke="#C3C8D2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="264" y="424" width="94" height="30" rx="9" fill="#EBF1F8"/>
  <text x="311" y="443" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3D6B9E">云厂商成本上升</text>
  <text x="36" y="472" class="note">为微软、谷歌、甲骨文代工的厂商已通知客户即将调价</text>

  <!-- 卡片D：财报焦点 -->
  <rect x="20" y="494" width="350" height="128" rx="14" fill="#FFFFFF" filter="url(#cs)"/>
  <text x="36" y="516"><tspan class="h2">英伟达财报焦点</tspan><tspan font-size="11" font-weight="400" fill="#9AA0AA"> · 下周三美股盘后发布</tspan></text>
  <text x="36" y="540" class="lbl">上季营收</text>
  <text x="36" y="566" font-size="19" font-weight="800" fill="#171A21">$816亿</text>
  <text x="36" y="582" class="sub">截至4月26日季度</text>
  <line x1="140" y1="534" x2="140" y2="584" stroke="#EDEEF1"/>
  <text x="154" y="540" class="lbl">毛利率</text>
  <text x="154" y="566" font-size="19" font-weight="800" fill="#55800A">75%</text>
  <text x="154" y="582" class="sub">去年同期 60.5%</text>
  <line x1="252" y1="534" x2="252" y2="584" stroke="#EDEEF1"/>
  <text x="266" y="540" class="lbl">Q2毛利率指引</text>
  <text x="266" y="566" font-size="15" font-weight="800" fill="#171A21">74.9–75%</text>
  <text x="266" y="582" class="sub">公司维持预期</text>
  <rect x="32" y="594" width="326" height="20" rx="10" fill="#FDEEEE"/>
  <text x="195" y="608" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C0392B">市场关注：存储涨价是否会侵蚀利润率</text>

  <!-- 卡片E：连锁反应 -->
  <rect x="20" y="634" width="350" height="152" rx="14" fill="#FFFFFF" filter="url(#cs)"/>
  <text x="36" y="656" class="h2">连锁反应 · 观察点</text>
  <circle cx="40" cy="677" r="3" fill="#D93A3F"/>
  <text x="50" y="681" class="body">苹果、高通等已因芯片短缺宣布涨价</text>
  <line x1="36" y1="694" x2="358" y2="694" stroke="#F1F2F5"/>
  <circle cx="40" cy="704" r="3" fill="#C77E1F"/>
  <text x="50" y="708" class="body">云巨头加速自研芯片：亚马逊、微软、谷歌、Meta</text>
  <line x1="36" y1="721" x2="358" y2="721" stroke="#F1F2F5"/>
  <circle cx="40" cy="731" r="3" fill="#55800A"/>
  <text x="50" y="735" class="body">内存三强话语权提升：三星、SK海力士、美光</text>
  <line x1="36" y1="748" x2="358" y2="748" stroke="#F1F2F5"/>
  <circle cx="40" cy="758" r="3" fill="#5B7FA6"/>
  <text x="50" y="762" class="body">英伟达软件生态仍是护城河，数据中心高度依赖</text>

  <!-- 页脚 -->
  <text x="195" y="816" text-anchor="middle" class="sub">数据来源：财联社（2025年8月23日）· 信息可视化仅供参考</text>
</svg>