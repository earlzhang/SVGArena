<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3A4A1F" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#F5F6EF"/>
  <circle cx="372" cy="14" r="70" fill="#76B900" opacity="0.05"/>
  <circle cx="8" cy="840" r="60" fill="#76B900" opacity="0.04"/>

  <!-- 头部 -->
  <rect x="16" y="34" width="96" height="22" rx="11" fill="#76B900" opacity="0.12"/>
  <text x="64" y="49" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4E7A00">AI 算力 · 供应链</text>
  <text x="374" y="49" text-anchor="end" font-size="10.5" fill="#9AA1AB">财联社 · 08.23</text>
  <text x="15" y="84" font-size="21" font-weight="700" fill="#1F2328">英伟达服务器传出涨价消息</text>
  <text x="15" y="108" font-size="21" font-weight="700" fill="#1F2328">涨幅「很多情况下超过 <tspan fill="#76B900">15%</tspan>」</text>

  <!-- 卡片1：核心消息 -->
  <rect x="16" y="122" width="358" height="158" rx="16" fill="#FFFFFF" stroke="#E7EADF" filter="url(#cs)"/>
  <text x="32" y="148" font-size="10.5" letter-spacing="2" fill="#9AA1AB">核心消息</text>
  <text x="30" y="194" font-size="42" font-weight="800" fill="#76B900">+15%</text>
  <path d="M146 193 L167 171" stroke="#76B900" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M155 168 L167 171 L164 183" stroke="#76B900" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="184" y="170" font-size="14.5" font-weight="700" fill="#1F2328">服务器普遍提价</text>
  <text x="184" y="190" font-size="11" fill="#6B7280">很多情况下涨幅超过 15%</text>
  <line x1="32" y1="208" x2="358" y2="208" stroke="#EEF0E7"/>
  <text x="32" y="231" font-size="11.5" fill="#4B5563">• 适用于明年年初出货的系统</text>
  <text x="32" y="250" font-size="11.5" fill="#4B5563">• 涵盖 Vera Rubin、Grace Blackwell 芯片组合</text>
  <text x="32" y="269" font-size="11.5" fill="#4B5563">• 主因：内存（DRAM）成本飙升</text>

  <!-- 卡片2：价格基数 -->
  <rect x="16" y="292" width="358" height="150" rx="16" fill="#FFFFFF" stroke="#E7EADF" filter="url(#cs)"/>
  <rect x="32" y="305" width="4" height="13" rx="2" fill="#76B900"/>
  <text x="44" y="316" font-size="13.5" font-weight="700" fill="#1F2328">高端 AI 服务器本就天价</text>
  <text x="32" y="340" font-size="11.5" fill="#4B5563">GB200 NVL72 机架</text>
  <text x="342" y="340" text-anchor="end" font-size="12.5" font-weight="700" fill="#1F2328">$280万–340万 /台</text>
  <rect x="32" y="347" width="310" height="7" rx="3.5" fill="#EDF0E5"/>
  <rect x="32" y="347" width="151" height="7" rx="3.5" fill="#A9CF4E"/>
  <text x="32" y="375" font-size="11.5" fill="#4B5563">VR200 NVL72 系统</text>
  <text x="342" y="375" text-anchor="end" font-size="12.5" font-weight="700" fill="#1F2328">$500万–700万 /台（询价）</text>
  <rect x="32" y="382" width="310" height="7" rx="3.5" fill="#EDF0E5"/>
  <rect x="32" y="382" width="310" height="7" rx="3.5" fill="#76B900"/>
  <circle cx="36" cy="404" r="3" fill="#D97706"/>
  <text x="46" y="408" font-size="11" fill="#A16207">涨 15% ≈ 单台额外支出大几十万至近百万美元</text>

  <!-- 卡片3：消费端 -->
  <rect x="16" y="454" width="358" height="88" rx="16" fill="#FFFFFF" stroke="#E7EADF" filter="url(#cs)"/>
  <rect x="32" y="467" width="4" height="13" rx="2" fill="#76B900"/>
  <text x="44" y="478" font-size="13.5" font-weight="700" fill="#1F2328">消费端已先行：RTX 5080 显卡</text>
  <text x="32" y="514" font-size="16" font-weight="700" fill="#9AA1AB" text-decoration="line-through">¥8,000</text>
  <text x="98" y="513" font-size="15" fill="#76B900">→</text>
  <text x="122" y="514" font-size="19" font-weight="800" fill="#1F2328">¥12,000</text>
  <text x="210" y="513" font-size="10.5" fill="#9AA1AB">（1 个月内）</text>
  <rect x="284" y="497" width="64" height="24" rx="12" fill="#76B900"/>
  <text x="316" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">+50%</text>
  <text x="32" y="533" font-size="10" fill="#9AA1AB">涨价之风，已从消费级显卡刮到数据中心服务器</text>

  <!-- 卡片4：财报看点 -->
  <rect x="16" y="554" width="358" height="170" rx="16" fill="#FFFFFF" stroke="#E7EADF" filter="url(#cs)"/>
  <rect x="32" y="567" width="4" height="13" rx="2" fill="#76B900"/>
  <text x="44" y="578" font-size="13.5" font-weight="700" fill="#1F2328">下周三财报：焦点在利润率</text>
  <text x="342" y="578" text-anchor="end" font-size="10.5" fill="#9AA1AB">美股盘后发布</text>
  <text x="32" y="606" font-size="10.5" fill="#9AA1AB">上季营收</text>
  <text x="32" y="632" font-size="19" font-weight="800" fill="#1F2328">$816亿</text>
  <text x="32" y="650" font-size="9.5" fill="#A8AEB6">截至4月26日季度</text>
  <line x1="132" y1="598" x2="132" y2="652" stroke="#ECEEE5"/>
  <text x="141" y="606" font-size="10.5" fill="#9AA1AB">最新毛利率</text>
  <text x="141" y="632" font-size="19" font-weight="800" fill="#1F2328">≈75%</text>
  <text x="141" y="650" font-size="9.5" fill="#A8AEB6">去年同期 60.5%</text>
  <line x1="243" y1="598" x2="243" y2="652" stroke="#ECEEE5"/>
  <text x="250" y="606" font-size="10.5" fill="#9AA1AB">本季毛利率指引</text>
  <text x="250" y="632" font-size="19" font-weight="800" fill="#1F2328">74.9–75%</text>
  <text x="250" y="650" font-size="9.5" fill="#A8AEB6">公司指引区间</text>
  <rect x="32" y="662" width="326" height="36" rx="10" fill="#F1F6E4"/>
  <circle cx="50" cy="680" r="9" fill="#76B900"/>
  <text x="50" y="684.5" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">!</text>
  <text x="66" y="684" font-size="11" font-weight="600" fill="#4E7A00">核心疑问：存储涨价是否会侵蚀 75% 毛利率？</text>
  <text x="32" y="714" font-size="10.5" fill="#6B7280">注：AI 芯片性能高度依赖 DRAM 容量，存储厂影响力空前</text>

  <!-- 卡片5：产业链 -->
  <rect x="16" y="736" width="358" height="96" rx="16" fill="#FFFFFF" stroke="#E7EADF" filter="url(#cs)"/>
  <rect x="32" y="749" width="4" height="13" rx="2" fill="#76B900"/>
  <text x="44" y="760" font-size="13.5" font-weight="700" fill="#1F2328">产业链连锁反应</text>
  <text x="32" y="782" font-size="10.8" fill="#4B5563">• 三星、SK海力士、美光等存储厂商话语权大增</text>
  <text x="32" y="800" font-size="10.8" fill="#4B5563">• 苹果、高通已因芯片短缺上调产品价格</text>
  <text x="32" y="818" font-size="10.8" fill="#4B5563">• 云巨头加速自研芯片，但英伟达软件护城河仍深</text>

  <!-- 页脚 -->
  <text x="195" y="840" text-anchor="middle" font-size="9" fill="#A8AEB6">来源：财联社 2025.08.23 · 信息可视化仅供参考</text>
</svg>