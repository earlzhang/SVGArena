<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <defs>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E9E00"/>
      <stop offset="1" stop-color="#A9D65B"/>
    </linearGradient>
    <linearGradient id="barMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC63F"/>
      <stop offset="1" stop-color="#5E9E00"/>
    </linearGradient>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#76B900" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heroClip"><rect x="16" y="112" width="358" height="120" rx="16"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3A4A20" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F7F8F2"/>
  <circle cx="352" cy="24" r="110" fill="url(#blob)"/>
  <rect width="390" height="4" fill="url(#topLine)"/>

  <!-- 头部 -->
  <rect x="16" y="22" width="112" height="24" rx="12" fill="#EFF4E4" stroke="#D5E5B8"/>
  <text x="72" y="38" font-size="11" fill="#4F7A1E" text-anchor="middle" font-weight="600">财联社 · 8月23日讯</text>
  <text x="374" y="38" font-size="11" fill="#9A9A8E" text-anchor="end">半导体 · AI服务器</text>
  <text x="16" y="74" font-size="21" font-weight="700" fill="#1F241B">英伟达服务器传出涨价消息</text>
  <text x="16" y="100" font-size="21" font-weight="700" fill="#1F241B">涨幅「很多情况下超过<tspan fill="#C43D22">15%</tspan>」</text>

  <!-- 核心事件卡 -->
  <rect x="16" y="112" width="358" height="120" rx="16" fill="#FFFFFF" stroke="#E7E7DE" filter="url(#soft)"/>
  <rect x="16" y="112" width="7" height="120" fill="#76B900" clip-path="url(#heroClip)"/>
  <rect x="34" y="128" width="56" height="20" rx="10" fill="#EFF4E4"/>
  <text x="62" y="142" font-size="10.5" fill="#4F7A1E" text-anchor="middle" font-weight="600">核心事件</text>
  <text x="34" y="170" font-size="11" fill="#6B6B60">很多情况下涨幅超过</text>
  <text x="34" y="212" font-size="46" font-weight="700" fill="#C43D22">+15%</text>
  <text x="158" y="148" font-size="12.5" font-weight="600" fill="#1F241B">内存（DRAM）成本飙升</text>
  <text x="158" y="168" font-size="12.5" fill="#55554D">微软、谷歌等大客户已获调价通知</text>
  <text x="158" y="188" font-size="12.5" fill="#55554D">涨价适用于明年年初出货的系统</text>
  <rect x="158" y="200" width="76" height="22" rx="11" fill="#F2F7E9" stroke="#D5E5B8"/>
  <text x="196" y="215" font-size="10.5" fill="#4F7A1E" text-anchor="middle" font-weight="600">Vera Rubin</text>
  <rect x="242" y="200" width="102" height="22" rx="11" fill="#F2F7E9" stroke="#D5E5B8"/>
  <text x="293" y="215" font-size="10.5" fill="#4F7A1E" text-anchor="middle" font-weight="600">Grace Blackwell</text>

  <!-- 整机价格 -->
  <rect x="16" y="248" width="4" height="16" rx="2" fill="#76B900"/>
  <text x="28" y="261" font-size="15" font-weight="700" fill="#1F241B">AI服务器整机价格本已高昂</text>
  <text x="374" y="261" font-size="10.5" fill="#9A9A8E" text-anchor="end">单位：万美元 / 台</text>

  <text x="16" y="284" font-size="12" fill="#55554D">NVL72 GB200 · Blackwell架构（年初报价）</text>
  <rect x="16" y="291" width="280" height="14" rx="7" fill="#EFEFE5"/>
  <rect x="16" y="291" width="136" height="14" rx="7" fill="#C6DD9E"/>
  <text x="160" y="302" font-size="11.5" font-weight="700" fill="#4F7A1E">280–340万</text>

  <text x="16" y="324" font-size="12" fill="#55554D">NVL72 VR200 · Vera Rubin（出货前询价）</text>
  <rect x="16" y="331" width="280" height="14" rx="7" fill="#EFEFE5"/>
  <rect x="16" y="331" width="280" height="14" rx="7" fill="url(#barMain)"/>
  <text x="304" y="342" font-size="11.5" font-weight="700" fill="#3E7B27">500–700万</text>

  <text x="16" y="362" font-size="10" fill="#8A8A80">※ 整机动辄数百万美元，15%的涨幅即额外增加大几十万至近百万美元</text>

  <!-- 消费端联动 -->
  <rect x="16" y="378" width="358" height="74" rx="14" fill="#FDF4F0" stroke="#F0DAD2"/>
  <rect x="32" y="390" width="78" height="18" rx="9" fill="#F7E2DA"/>
  <text x="71" y="403" font-size="10" fill="#B04A2E" text-anchor="middle" font-weight="600">消费端已先行</text>
  <text x="32" y="429" font-size="13.5" font-weight="700" fill="#33332B">RTX 5080 显卡</text>
  <text x="150" y="429" font-size="14" font-weight="700"><tspan fill="#8A7A72">¥8,000</tspan><tspan fill="#C9A79C"> → </tspan><tspan fill="#C43D22">¥12,000</tspan></text>
  <text x="374" y="429" font-size="19" font-weight="700" fill="#C43D22" text-anchor="end">+50%</text>
  <text x="32" y="446" font-size="10" fill="#A98D80">次旗舰显卡 · 短短1个月内</text>

  <!-- 财报前瞻 -->
  <rect x="16" y="466" width="4" height="16" rx="2" fill="#76B900"/>
  <text x="28" y="479" font-size="15" font-weight="700" fill="#1F241B">财报前瞻</text>
  <text x="374" y="479" font-size="10.5" fill="#9A9A8E" text-anchor="end">下周三美股盘后发布</text>

  <rect x="16" y="490" width="114" height="64" rx="12" fill="#FFFFFF" stroke="#E7E7DE" filter="url(#soft)"/>
  <text x="73" y="510" font-size="10" fill="#9A9A8E" text-anchor="middle">季度营收</text>
  <text x="73" y="534" font-size="19" font-weight="700" fill="#1F241B" text-anchor="middle">$816亿</text>
  <text x="73" y="548" font-size="9" fill="#B0B0A4" text-anchor="middle">截至4月26日</text>

  <rect x="138" y="490" width="114" height="64" rx="12" fill="#FFFFFF" stroke="#E7E7DE" filter="url(#soft)"/>
  <text x="195" y="510" font-size="10" fill="#9A9A8E" text-anchor="middle">毛利率</text>
  <text x="195" y="534" font-size="19" font-weight="700" fill="#1F241B" text-anchor="middle">约75%</text>
  <text x="195" y="548" font-size="9" fill="#B0B0A4" text-anchor="middle">去年同期 60.5%</text>

  <rect x="260" y="490" width="114" height="64" rx="12" fill="#FFFFFF" stroke="#E7E7DE" filter="url(#soft)"/>
  <text x="317" y="510" font-size="10" fill="#9A9A8E" text-anchor="middle">毛利率指引</text>
  <text x="317" y="532" font-size="16" font-weight="700" fill="#4F7A1E" text-anchor="middle">74.9%–75%</text>
  <text x="317" y="548" font-size="9" fill="#B0B0A4" text-anchor="middle">公司此前预期</text>

  <!-- 市场焦点 -->
  <rect x="16" y="566" width="358" height="126" rx="14" fill="#FFFFFF" stroke="#E7E7DE" filter="url(#soft)"/>
  <rect x="32" y="580" width="72" height="20" rx="10" fill="#FBF3DA"/>
  <text x="68" y="594" font-size="10.5" fill="#9A7A1E" text-anchor="middle" font-weight="600">市场焦点</text>
  <text x="32" y="620" font-size="13.5" font-weight="700" fill="#33332B">存储涨价潮，会否侵蚀英伟达利润率？</text>

  <rect x="32" y="632" width="100" height="28" rx="8" fill="#F4F6EC" stroke="#DDE4CC"/>
  <text x="82" y="650" font-size="11" fill="#4F5A3A" text-anchor="middle">算力需求狂热</text>
  <line x1="136" y1="646" x2="146" y2="646" stroke="#B8B8AC" stroke-width="1.5"/>
  <polygon points="146,641.5 152,646 146,650.5" fill="#B8B8AC"/>
  <rect x="156" y="632" width="100" height="28" rx="8" fill="#F4F6EC" stroke="#DDE4CC"/>
  <text x="206" y="650" font-size="11" fill="#4F5A3A" text-anchor="middle">DRAM价格飙升</text>
  <line x1="260" y1="646" x2="270" y2="646" stroke="#B8B8AC" stroke-width="1.5"/>
  <polygon points="270,641.5 276,646 270,650.5" fill="#B8B8AC"/>
  <rect x="280" y="632" width="78" height="28" rx="8" fill="#FBEDE7" stroke="#EFCFC2"/>
  <text x="319" y="650" font-size="11" fill="#B04A2E" text-anchor="middle">服务器涨价</text>

  <text x="32" y="678" font-size="10" fill="#8A8A80">内存三巨头（三星 / SK海力士 / 美光）获得前所未有的行业影响力</text>

  <!-- 连锁反应 -->
  <rect x="16" y="704" width="358" height="80" rx="14" fill="#F0F5FA" stroke="#DCE6EF"/>
  <rect x="32" y="716" width="64" height="20" rx="10" fill="#E1EBF4"/>
  <text x="64" y="730" font-size="10.5" fill="#3A6A9A" text-anchor="middle" font-weight="600">连锁反应</text>
  <text x="32" y="756" font-size="12.5" fill="#33332B">服务器涨价，为自研芯片注入新动力</text>
  <text x="358" y="756" font-size="10" fill="#8A9AAB" text-anchor="end">但英伟达软件护城河仍在</text>
  <text x="32" y="776" font-size="11" fill="#5A7A9A">亚马逊 · 微软 · 谷歌 · Meta 均在推进自研芯片</text>

  <!-- 页脚 -->
  <rect x="16" y="798" width="358" height="1" fill="#E4E4DA"/>
  <text x="16" y="818" font-size="9.5" fill="#B0B0A4">来源：财联社 2025年8月23日报道 · 信息可视化呈现，不构成投资建议</text>
</svg>