<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3EE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F5F6F8"/>

  <!-- 顶部 -->
  <rect x="20" y="18" width="88" height="22" rx="11" fill="#1A1E27"/>
  <text x="64" y="33" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">AI 算力观察</text>
  <text x="370" y="33" text-anchor="end" font-size="10.5" fill="#9AA0AA">财联社 · 2025.08.23</text>

  <!-- 标题 -->
  <text x="20" y="67" font-size="22" font-weight="700" fill="#1A1E27">英伟达服务器传出涨价消息</text>
  <text x="20" y="95" font-size="22" font-weight="700" fill="#1A1E27">涨幅「很多情况下<tspan fill="#E03131">超过 15%</tspan>」</text>

  <!-- 核心数据卡 -->
  <rect x="20" y="112" width="350" height="168" rx="16" fill="url(#hero)" stroke="#F3DFD6"/>
  <text x="38" y="182" font-size="54" font-weight="700" fill="#E03131">+15%</text>
  <text x="40" y="206" font-size="11" fill="#8A909B">很多情况下涨幅超过 15%</text>
  <text x="205" y="141" font-size="9.5" fill="#A6ABB5" letter-spacing="1">生效时间</text>
  <text x="205" y="158" font-size="12.5" font-weight="600" fill="#1A1E27">明年初出货系统</text>
  <text x="205" y="180" font-size="9.5" fill="#A6ABB5" letter-spacing="1">直接原因</text>
  <text x="205" y="197" font-size="12.5" font-weight="600" fill="#1A1E27">内存芯片成本飙升</text>
  <text x="205" y="219" font-size="9.5" fill="#A6ABB5" letter-spacing="1">已获通知</text>
  <text x="205" y="236" font-size="12.5" font-weight="600" fill="#1A1E27">微软 · 谷歌 · 甲骨文</text>
  <line x1="36" y1="246" x2="354" y2="246" stroke="#F2E3DA"/>
  <rect x="38" y="254" width="80" height="21" rx="10.5" fill="#FFFFFF" stroke="#EBD8CD"/>
  <text x="78" y="268" text-anchor="middle" font-size="10.5" fill="#3E4653">Vera Rubin</text>
  <rect x="126" y="254" width="102" height="21" rx="10.5" fill="#FFFFFF" stroke="#EBD8CD"/>
  <text x="177" y="268" text-anchor="middle" font-size="10.5" fill="#3E4653">Grace Blackwell</text>
  <text x="236" y="268" font-size="10.5" fill="#9AA0AA">等芯片服务器</text>

  <!-- 服务器价格 -->
  <rect x="20" y="292" width="4" height="15" rx="2" fill="#E03131"/>
  <text x="32" y="304" font-size="14" font-weight="700" fill="#1A1E27">高端 AI 服务器 · 单台价格参照</text>
  <rect x="20" y="316" width="350" height="114" rx="16" fill="#FFFFFF" stroke="#ECEEF2"/>
  <text x="38" y="340" font-size="11.5" font-weight="600" fill="#3A414D">GB200 NVL72 机架 · Blackwell</text>
  <text x="352" y="340" text-anchor="end" font-size="12" font-weight="700" fill="#1A1E27">280–340 万美元</text>
  <rect x="38" y="348" width="314" height="8" rx="4" fill="#F0F2F5"/>
  <rect x="38" y="348" width="126" height="8" rx="4" fill="#F2A25C"/>
  <rect x="164" y="348" width="27" height="8" fill="#F2A25C" opacity="0.38"/>
  <text x="38" y="378" font-size="11.5" font-weight="600" fill="#3A414D">VR200 NVL72 系统 · 出货前询价</text>
  <text x="352" y="378" text-anchor="end" font-size="12" font-weight="700" fill="#1A1E27">500–700 万美元</text>
  <rect x="38" y="386" width="314" height="8" rx="4" fill="#F0F2F5"/>
  <rect x="38" y="386" width="224" height="8" rx="4" fill="#E2623B"/>
  <rect x="262" y="386" width="90" height="8" fill="#E2623B" opacity="0.38"/>
  <text x="38" y="418" font-size="9.5" fill="#A6ABB5">※ 条形为报价区间；15% 涨幅 ≈ 每台额外数十万至近百万美元</text>

  <!-- 消费端 -->
  <rect x="20" y="442" width="4" height="15" rx="2" fill="#E03131"/>
  <text x="32" y="454" font-size="14" font-weight="700" fill="#1A1E27">消费端 · 先行信号</text>
  <rect x="20" y="466" width="350" height="72" rx="16" fill="#FFFFFF" stroke="#ECEEF2"/>
  <text x="38" y="492" font-size="13" font-weight="700" fill="#1A1E27">RTX 5080 显卡</text>
  <text x="38" y="511" font-size="9.5" fill="#A6ABB5">消费级次旗舰</text>
  <text x="160" y="492" font-size="14" font-weight="700" fill="#1A1E27">¥8,000 <tspan fill="#E03131">→</tspan> ¥12,000</text>
  <text x="160" y="511" font-size="9.5" fill="#A6ABB5">短短 1 个月</text>
  <text x="352" y="498" text-anchor="end" font-size="23" font-weight="700" fill="#E03131">+50%</text>
  <text x="352" y="514" text-anchor="end" font-size="9.5" fill="#A6ABB5">月涨幅</text>

  <!-- 财报 -->
  <rect x="20" y="550" width="4" height="15" rx="2" fill="#E03131"/>
  <text x="32" y="562" font-size="14" font-weight="700" fill="#1A1E27">英伟达财报 · 下周三美股盘后</text>
  <rect x="20" y="574" width="350" height="114" rx="16" fill="#FFFFFF" stroke="#ECEEF2"/>
  <line x1="138.5" y1="590" x2="138.5" y2="646" stroke="#EEF0F3"/>
  <line x1="251.5" y1="590" x2="251.5" y2="646" stroke="#EEF0F3"/>
  <text x="82" y="598" text-anchor="middle" font-size="9.5" fill="#A6ABB5" letter-spacing="1">季度营收</text>
  <text x="82" y="626" text-anchor="middle" font-size="23" font-weight="700" fill="#1A1E27">816<tspan font-size="11" font-weight="600" fill="#6B7280"> 亿美元</tspan></text>
  <text x="82" y="644" text-anchor="middle" font-size="9" fill="#A6ABB5">截至 4/26 季度</text>
  <text x="195" y="598" text-anchor="middle" font-size="9.5" fill="#A6ABB5" letter-spacing="1">毛利率</text>
  <text x="195" y="626" text-anchor="middle" font-size="23" font-weight="700" fill="#1A1E27">≈75%</text>
  <text x="195" y="644" text-anchor="middle" font-size="9" fill="#A6ABB5">去年同期 60.5%</text>
  <text x="308" y="598" text-anchor="middle" font-size="9.5" fill="#A6ABB5" letter-spacing="1">本季指引</text>
  <text x="308" y="624" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1A1E27">74.9%–75%</text>
  <text x="308" y="644" text-anchor="middle" font-size="9" fill="#A6ABB5">毛利率预期区间</text>
  <line x1="36" y1="654" x2="354" y2="654" stroke="#EEF0F3"/>
  <circle cx="47" cy="672" r="8.5" fill="#FDF0E5"/>
  <text x="47" y="676" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">!</text>
  <text x="62" y="676" font-size="12" font-weight="600" fill="#B4540A">市场焦点：存储涨价潮是否侵蚀算力龙头利润率</text>

  <!-- 连锁反应 -->
  <rect x="20" y="700" width="4" height="15" rx="2" fill="#E03131"/>
  <text x="32" y="712" font-size="14" font-weight="700" fill="#1A1E27">涨价背后的连锁反应</text>
  <rect x="20" y="724" width="350" height="84" rx="16" fill="#FFFFFF" stroke="#ECEEF2"/>
  <rect x="36" y="738" width="66" height="25" rx="12.5" fill="#F1F3F6"/>
  <text x="69" y="754" text-anchor="middle" font-size="11" font-weight="600" fill="#3E4653">内存涨价</text>
  <text x="112" y="755" text-anchor="middle" font-size="13" fill="#B0B6BF">→</text>
  <rect x="122" y="738" width="104" height="25" rx="12.5" fill="#FCEAE7"/>
  <text x="174" y="754" text-anchor="middle" font-size="11" font-weight="600" fill="#C02626">服务器涨价 15%+</text>
  <text x="235" y="755" text-anchor="middle" font-size="13" fill="#B0B6BF">→</text>
  <rect x="244" y="738" width="92" height="25" rx="12.5" fill="#E9F1FB"/>
  <text x="290" y="754" text-anchor="middle" font-size="11" font-weight="600" fill="#2F6BD8">自研芯片提速</text>
  <circle cx="41" cy="780" r="2" fill="#C4C9D2"/>
  <text x="50" y="783.5" font-size="10" fill="#6B7280">三星 / SK海力士 / 美光等存储厂话语权空前</text>
  <circle cx="41" cy="796" r="2" fill="#C4C9D2"/>
  <text x="50" y="799.5" font-size="10" fill="#6B7280">苹果、高通等已因芯片短缺相继提价</text>

  <text x="195" y="832" text-anchor="middle" font-size="9" fill="#B8BDC6">来源：财联社 · 2025.08.23</text>
</svg>