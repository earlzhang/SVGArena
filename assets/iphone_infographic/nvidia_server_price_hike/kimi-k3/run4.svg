<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','STHeiti',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4DB"/>
      <stop offset="1" stop-color="#F6F9F1"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A6D34A"/>
      <stop offset="1" stop-color="#76B900"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6B352"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F4F6F8"/>
  <rect width="390" height="4" fill="#76B900"/>

  <!-- 头部 -->
  <rect x="0" y="4" width="390" height="108" fill="url(#hdr)"/>
  <g opacity="0.75" stroke="#8CC63F" stroke-width="2" fill="none">
    <rect x="338" y="20" width="34" height="34" rx="6"/>
    <rect x="348" y="30" width="14" height="14" rx="2"/>
    <line x1="333" y1="27" x2="338" y2="27"/><line x1="333" y1="37" x2="338" y2="37"/><line x1="333" y1="47" x2="338" y2="47"/>
    <line x1="372" y1="27" x2="377" y2="27"/><line x1="372" y1="37" x2="377" y2="37"/><line x1="372" y1="47" x2="377" y2="47"/>
    <line x1="345" y1="15" x2="345" y2="20"/><line x1="355" y1="15" x2="355" y2="20"/><line x1="365" y1="15" x2="365" y2="20"/>
    <line x1="345" y1="54" x2="345" y2="59"/><line x1="355" y1="54" x2="355" y2="59"/><line x1="365" y1="54" x2="365" y2="59"/>
  </g>
  <rect x="16" y="16" width="128" height="20" rx="10" fill="#FFFFFF" stroke="#CBE3A8"/>
  <text x="80" y="30" font-size="10" font-weight="600" fill="#5C9400" text-anchor="middle">财联社 · 8月23日讯</text>
  <text x="16" y="64" font-size="21" font-weight="700" fill="#17222B">英伟达服务器传出涨价消息</text>
  <text x="16" y="90" font-size="16" font-weight="600" fill="#17222B">涨幅“很多情况下超过 <tspan fill="#E8590C" font-size="18" font-weight="800">15%</tspan>”</text>
  <text x="16" y="106" font-size="10.5" fill="#5B6B7A">适用于明年初出货的 Vera Rubin / Grace Blackwell 服务器</text>

  <!-- 三个关键信息 -->
  <rect x="16" y="122" width="114" height="64" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <text x="73" y="152" font-size="21" font-weight="800" fill="#E8590C" text-anchor="middle">&gt;15%</text>
  <text x="73" y="172" font-size="9.5" fill="#64707D" text-anchor="middle">多数情况涨幅下限</text>
  <rect x="138" y="122" width="114" height="64" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <text x="195" y="152" font-size="19" font-weight="800" fill="#17222B" text-anchor="middle">明年初</text>
  <text x="195" y="172" font-size="9.5" fill="#64707D" text-anchor="middle">出货系统起涨</text>
  <rect x="260" y="122" width="114" height="64" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <text x="317" y="152" font-size="19" font-weight="800" fill="#17222B" text-anchor="middle">下周三</text>
  <text x="317" y="172" font-size="9.5" fill="#64707D" text-anchor="middle">美股盘后发财报</text>

  <!-- 涨价逻辑 -->
  <rect x="16" y="197" width="8" height="8" rx="2" fill="#76B900"/>
  <text x="29" y="206" font-size="13" font-weight="700" fill="#17222B">涨从何来：内存成本飙升</text>
  <rect x="16" y="214" width="150" height="40" rx="8" fill="#FFF3E6" stroke="#F2CBA4"/>
  <text x="91" y="238" font-size="11.5" font-weight="600" fill="#B3540C" text-anchor="middle">DRAM 内存成本飙升</text>
  <line x1="172" y1="234" x2="192" y2="234" stroke="#94A3B3" stroke-width="2"/>
  <polygon points="192,229 200,234 192,239" fill="#94A3B3"/>
  <rect x="206" y="214" width="168" height="40" rx="8" fill="#EAF4DB" stroke="#CBE3A8"/>
  <text x="290" y="238" font-size="11.5" font-weight="600" fill="#5C9400" text-anchor="middle">AI 服务器普遍提价</text>
  <text x="16" y="268" font-size="10" fill="#64707D">AI 芯片性能高度依赖配套 DRAM 容量，算力疯抢推高内存价格</text>

  <!-- 价格对比 -->
  <rect x="16" y="281" width="8" height="8" rx="2" fill="#76B900"/>
  <text x="29" y="290" font-size="13" font-weight="700" fill="#17222B">机架级系统价格对比</text>
  <text x="16" y="306" font-size="11" font-weight="600" fill="#17222B">NVL72 GB200 <tspan fill="#8A97A5" font-weight="400">· Blackwell 平台报价</tspan></text>
  <rect x="16" y="312" width="174" height="16" rx="8" fill="url(#gGreen)"/>
  <text x="374" y="324" font-size="11" font-weight="700" fill="#5C9400" text-anchor="end">280–340 万美元</text>
  <text x="16" y="344" font-size="11" font-weight="600" fill="#17222B">NVL72 VR200 <tspan fill="#8A97A5" font-weight="400">· Vera Rubin 出货前询价</tspan></text>
  <rect x="16" y="350" width="358" height="16" rx="8" fill="url(#gOrange)"/>
  <text x="366" y="362" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="end">500–700 万美元</text>
  <text x="16" y="384" font-size="10" fill="#64707D">以 VR200 为例，15% 涨幅 ≈ 75–105 万美元额外开销</text>

  <!-- 消费端先例 -->
  <rect x="16" y="393" width="8" height="8" rx="2" fill="#76B900"/>
  <text x="29" y="402" font-size="13" font-weight="700" fill="#17222B">消费端先例：显卡一个月跳涨</text>
  <rect x="16" y="410" width="358" height="44" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <rect x="30" y="422" width="74" height="20" rx="10" fill="#343A40"/>
  <text x="67" y="436" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">RTX 5080</text>
  <text x="116" y="437" font-size="12" fill="#64707D">≈8000 元档</text>
  <line x1="192" y1="432" x2="212" y2="432" stroke="#E8590C" stroke-width="2"/>
  <polygon points="212,427 220,432 212,437" fill="#E8590C"/>
  <text x="228" y="437" font-size="13" font-weight="800" fill="#E8590C">1.2 万元</text>
  <rect x="296" y="421" width="56" height="22" rx="11" fill="#E8590C"/>
  <text x="324" y="436" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+50%</text>

  <!-- 财报焦点 -->
  <rect x="16" y="467" width="8" height="8" rx="2" fill="#76B900"/>
  <text x="29" y="476" font-size="13" font-weight="700" fill="#17222B">下周三财报：毛利率成焦点</text>
  <rect x="16" y="484" width="114" height="64" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <text x="73" y="510" font-size="15" font-weight="800" fill="#17222B" text-anchor="middle">816 亿美元</text>
  <text x="73" y="527" font-size="9.5" fill="#64707D" text-anchor="middle">上季营收</text>
  <text x="73" y="540" font-size="8.5" fill="#94A3B3" text-anchor="middle">截至 4 月 26 日</text>
  <rect x="138" y="484" width="114" height="64" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <text x="195" y="510" font-size="19" font-weight="800" fill="#5C9400" text-anchor="middle">75%</text>
  <text x="195" y="527" font-size="9.5" fill="#64707D" text-anchor="middle">季度毛利率</text>
  <text x="195" y="540" font-size="8.5" fill="#94A3B3" text-anchor="middle">上年同期 60.5%</text>
  <rect x="260" y="484" width="114" height="64" rx="10" fill="#FFFFFF" stroke="#E4E9EF"/>
  <text x="317" y="510" font-size="13.5" font-weight="800" fill="#17222B" text-anchor="middle">74.9–75%</text>
  <text x="317" y="527" font-size="9.5" fill="#64707D" text-anchor="middle">本季毛利率指引</text>
  <text x="317" y="540" font-size="8.5" fill="#94A3B3" text-anchor="middle">预期维持高位</text>
  <rect x="16" y="558" width="358" height="32" rx="8" fill="#FFF3E6" stroke="#F2CBA4"/>
  <text x="195" y="578" font-size="11.5" font-weight="600" fill="#B3540C" text-anchor="middle">市场焦点：存储狂潮会否侵蚀算力龙头的利润率？</text>

  <!-- 连锁反应 -->
  <rect x="16" y="603" width="8" height="8" rx="2" fill="#76B900"/>
  <text x="29" y="612" font-size="13" font-weight="700" fill="#17222B">产业链连锁反应</text>
  <circle cx="26" cy="622" r="10" fill="#EAF4DB"/>
  <text x="26" y="625.5" font-size="9.5" font-weight="700" fill="#5C9400" text-anchor="middle">存</text>
  <text x="44" y="626" font-size="12" font-weight="700" fill="#17222B">内存三巨头话语权大增</text>
  <text x="44" y="644" font-size="10" fill="#64707D">三星 · SK 海力士 · 美光｜挑战者能否供货皆系于此</text>
  <circle cx="26" cy="664" r="10" fill="#EAF4DB"/>
  <text x="26" y="667.5" font-size="9.5" font-weight="700" fill="#5C9400" text-anchor="middle">涨</text>
  <text x="44" y="668" font-size="12" font-weight="700" fill="#17222B">全行业掀起提价潮</text>
  <text x="44" y="686" font-size="10" fill="#64707D">苹果、高通等因芯片短缺上调产品价格</text>
  <circle cx="26" cy="706" r="10" fill="#EAF4DB"/>
  <text x="26" y="709.5" font-size="9.5" font-weight="700" fill="#5C9400" text-anchor="middle">研</text>
  <text x="44" y="710" font-size="12" font-weight="700" fill="#17222B">云厂商加速自研芯片</text>
  <text x="44" y="728" font-size="10" fill="#64707D">亚马逊 · 微软 · 谷歌 · Meta 推进内部芯片项目</text>
  <text x="44" y="744" font-size="10" fill="#64707D">但英伟达软件“护城河”下，大型数据中心仍高度依赖其芯片</text>

  <!-- 结论 -->
  <rect x="16" y="756" width="358" height="52" rx="10" fill="#17222B"/>
  <text x="195" y="778" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">能否破局的关键变量</text>
  <text x="195" y="797" font-size="10.5" fill="#C7D2DC" text-anchor="middle">挑战者能否获得三星、SK海力士、美光的充足芯片供应</text>
  <text x="195" y="828" font-size="9" fill="#94A3B3" text-anchor="middle">来源：财联社 8月23日讯（编辑 史正丞）· 媒体报道</text>
</svg>