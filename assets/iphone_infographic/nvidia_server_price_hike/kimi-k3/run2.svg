<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','STHeiti','Heiti SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F9FC"/>
      <stop offset="1" stop-color="#EAF1F7"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76B900"/>
      <stop offset="1" stop-color="#B7E36B"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#274052" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>
  <rect x="0" y="0" width="390" height="4" fill="url(#topbar)"/>

  <!-- 头部 -->
  <rect x="20" y="22" width="146" height="22" rx="11" fill="#DFF2C8"/>
  <text x="93" y="37" font-size="11" font-weight="600" fill="#4C7A00" text-anchor="middle">财联社 · 8月23日讯</text>

  <text x="20" y="74" font-size="22" font-weight="700" fill="#152A38">英伟达服务器传出涨价消息</text>
  <text x="20" y="104" font-size="22" font-weight="700" fill="#152A38">涨幅“很多情况下<tspan fill="#D63A2F">超过15%</tspan>”</text>

  <!-- 核心数据卡 -->
  <rect x="20" y="118" width="350" height="104" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="40" y="182" font-size="44" font-weight="800" fill="#D63A2F">15%<tspan font-size="26">+</tspan></text>
  <text x="40" y="204" font-size="10.5" fill="#7A8A99">部分情况下的涨幅</text>
  <line x1="152" y1="136" x2="152" y2="204" stroke="#E3EAF0" stroke-width="1"/>
  <text x="166" y="148" font-size="13" font-weight="700" fill="#152A38">明年年初出货系统普遍提价</text>
  <text x="166" y="168" font-size="11" fill="#5A6B7C">直接诱因：DRAM 内存芯片成本飙升</text>
  <rect x="166" y="180" width="76" height="20" rx="10" fill="#EDF6E0"/>
  <text x="204" y="193" font-size="10.5" font-weight="600" fill="#4C7A00" text-anchor="middle">Vera Rubin</text>
  <rect x="250" y="180" width="102" height="20" rx="10" fill="#EDF6E0"/>
  <text x="301" y="193" font-size="10.5" font-weight="600" fill="#4C7A00" text-anchor="middle">Grace Blackwell</text>

  <!-- 机型售价 -->
  <rect x="20" y="236" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="32" y="247" font-size="14" font-weight="700" fill="#152A38">涉及机型与售价</text>

  <rect x="20" y="256" width="169" height="84" rx="12" fill="#FFFFFF" filter="url(#card)"/>
  <text x="34" y="278" font-size="12.5" font-weight="700" fill="#152A38">NVL72 GB200</text>
  <text x="34" y="295" font-size="10.5" fill="#7A8A99">Blackwell 架构</text>
  <text x="34" y="323" font-size="17" font-weight="800" fill="#D63A2F">280-340万<tspan font-size="10" font-weight="400" fill="#7A8A99"> 美元/台</tspan></text>

  <rect x="201" y="256" width="169" height="84" rx="12" fill="#FFFFFF" filter="url(#card)"/>
  <text x="215" y="278" font-size="12.5" font-weight="700" fill="#152A38">NVL72 VR200</text>
  <text x="215" y="295" font-size="10.5" fill="#7A8A99">Vera Rubin · 出货前询价</text>
  <text x="215" y="323" font-size="17" font-weight="800" fill="#D63A2F">500-700万<tspan font-size="10" font-weight="400" fill="#7A8A99"> 美元/台</tspan></text>
  <rect x="318" y="264" width="40" height="16" rx="8" fill="#FDE8E4"/>
  <text x="338" y="275" font-size="9" font-weight="600" fill="#D63A2F" text-anchor="middle">新一代</text>

  <text x="20" y="357" font-size="10" fill="#8A99A8">▎数百万美元级系统，15% 涨幅 ≈ 数十万美元额外开销</text>

  <!-- 消费市场前兆 -->
  <rect x="20" y="370" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="32" y="381" font-size="14" font-weight="700" fill="#152A38">消费市场已先行：RTX 5080 一个月跳涨</text>

  <rect x="20" y="392" width="350" height="64" rx="12" fill="#FFFFFF" filter="url(#card)"/>
  <text x="36" y="414" font-size="12" font-weight="700" fill="#152A38">RTX 5080 次旗舰显卡</text>
  <text x="354" y="414" font-size="10.5" font-weight="600" fill="#D63A2F" text-anchor="end">短短1个月</text>
  <rect x="36" y="424" width="92" height="11" rx="5.5" fill="#C3D0DD"/>
  <text x="136" y="434" font-size="10.5" fill="#5A6B7C">¥8,000</text>
  <rect x="36" y="441" width="158" height="11" rx="5.5" fill="#E5484D"/>
  <text x="202" y="451" font-size="10.5" font-weight="700" fill="#D63A2F">¥12,000</text>
  <rect x="298" y="427" width="56" height="20" rx="10" fill="#FDE8E4"/>
  <text x="326" y="441" font-size="11" font-weight="700" fill="#D63A2F" text-anchor="middle">+50%</text>

  <!-- 财报聚焦 -->
  <rect x="20" y="470" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="32" y="481" font-size="14" font-weight="700" fill="#152A38">下周发财报 · 存储涨价会否侵蚀利润率</text>

  <rect x="20" y="492" width="350" height="108" rx="12" fill="#FFFFFF" filter="url(#card)"/>
  <text x="36" y="516" font-size="10.5" fill="#7A8A99">最新季度营收</text>
  <text x="36" y="540" font-size="21" font-weight="800" fill="#152A38">816亿美元</text>
  <text x="36" y="564" font-size="10.5" fill="#7A8A99">本季度毛利率指引</text>
  <text x="36" y="584" font-size="14" font-weight="700" fill="#4C7A00">74.9% - 75%</text>

  <line x1="212" y1="508" x2="212" y2="588" stroke="#E3EAF0" stroke-width="1"/>
  <text x="226" y="512" font-size="10" fill="#7A8A99">毛利率</text>
  <rect x="230" y="530" width="32" height="48" rx="4" fill="#C9D6E2"/>
  <text x="246" y="524" font-size="10.5" font-weight="700" fill="#5A6B7C" text-anchor="middle">60.5%</text>
  <text x="246" y="592" font-size="9.5" fill="#7A8A99" text-anchor="middle">上年同期</text>
  <rect x="296" y="518" width="32" height="60" rx="4" fill="#76B900"/>
  <text x="312" y="512" font-size="10.5" font-weight="700" fill="#4C7A00" text-anchor="middle">75%</text>
  <text x="312" y="592" font-size="9.5" fill="#7A8A99" text-anchor="middle">最新财季</text>
  <line x1="226" y1="578" x2="346" y2="578" stroke="#E3EAF0" stroke-width="1"/>

  <!-- 涨价链条与影响 -->
  <rect x="20" y="614" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="32" y="625" font-size="14" font-weight="700" fill="#152A38">涨价链条与行业影响</text>

  <rect x="20" y="636" width="350" height="156" rx="12" fill="#FFFFFF" filter="url(#card)"/>
  <line x1="38" y1="658" x2="38" y2="766" stroke="#E3EAF0" stroke-width="1.5"/>

  <circle cx="38" cy="656" r="3.5" fill="#E5484D"/>
  <text x="52" y="660" font-size="12.5" font-weight="700" fill="#152A38">根源</text>
  <text x="52" y="676" font-size="11" fill="#5A6B7C">AI芯片性能高度依赖配套DRAM，内存涨价推高整机成本</text>

  <circle cx="38" cy="692" r="3.5" fill="#F2994A"/>
  <text x="52" y="696" font-size="12.5" font-weight="700" fill="#152A38">扩散</text>
  <text x="52" y="712" font-size="11" fill="#5A6B7C">苹果、高通等科技巨头已因芯片短缺宣布提价</text>

  <circle cx="38" cy="728" r="3.5" fill="#4A90D9"/>
  <text x="52" y="732" font-size="12.5" font-weight="700" fill="#152A38">应对</text>
  <text x="52" y="748" font-size="11" fill="#5A6B7C">微软、谷歌、亚马逊、Meta 加速自研，短期仍依赖英伟达</text>

  <circle cx="38" cy="764" r="3.5" fill="#76B900"/>
  <text x="52" y="768" font-size="12.5" font-weight="700" fill="#152A38">关键</text>
  <text x="52" y="784" font-size="11" fill="#5A6B7C">挑战者能否突围，取决于三星、SK海力士、美光的供应</text>

  <!-- 页脚 -->
  <text x="195" y="818" font-size="9.5" fill="#9AA8B5" text-anchor="middle">来源：财联社8月23日讯（编辑 史正丞）｜信息仅供参考</text>
</svg>