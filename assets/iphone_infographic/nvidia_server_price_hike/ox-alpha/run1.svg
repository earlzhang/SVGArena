<svg xmlns="http://www.w3.org/2000/svg" width="390" height="790" viewBox="0 0 390 790" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2D8"/>
      <stop offset="1" stop-color="#F4F6F8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FAE7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#33404F" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="790" fill="#F4F6F8"/>
  <rect width="390" height="112" fill="url(#hdr)"/>

  <!-- 头部 -->
  <rect x="20" y="18" width="138" height="24" rx="12" fill="#FFFFFF" opacity="0.85" stroke="#DCE5CC"/>
  <text x="89" y="34" text-anchor="middle" font-size="10.5" fill="#5C6B47">财联社 · 8月23日讯</text>
  <text x="20" y="66" font-size="20" font-weight="800" fill="#17251A">英伟达服务器传出涨价消息</text>
  <text x="20" y="92" font-size="14.5" font-weight="600" fill="#4C8C00">涨幅“很多情况下超过 15%”</text>

  <!-- 卡1：核心结论 -->
  <rect x="16" y="104" width="358" height="96" rx="16" fill="url(#hero)" stroke="#E3ECD2" filter="url(#sh)"/>
  <text x="36" y="153" font-size="38" font-weight="800" fill="#4C8C00">&gt;15%</text>
  <text x="36" y="173" font-size="10" fill="#93A08A">多数情况下的涨幅</text>
  <line x1="140" y1="122" x2="140" y2="182" stroke="#E4EAD8" stroke-dasharray="3,3"/>
  <text x="152" y="136" font-size="14.5" font-weight="700" fill="#1F2937">AI 服务器将普遍提价</text>
  <circle cx="156" cy="155" r="2" fill="#76B900"/>
  <text x="164" y="159" font-size="11.5" fill="#5B6572">适用于明年年初出货的系统</text>
  <circle cx="156" cy="175" r="2" fill="#E08A3C"/>
  <text x="164" y="179" font-size="11.5" fill="#5B6572">诱因：<tspan fill="#C2571B" font-weight="600">DRAM 内存成本飙升</tspan></text>
  <g transform="translate(324,124)" opacity="0.55">
    <path d="M0,18 L11,8 L19,13 L32,1 M32,1 h-8 M32,1 v8" stroke="#76B900" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 卡2：受影响平台 -->
  <rect x="16" y="210" width="358" height="102" rx="16" fill="#FFFFFF" stroke="#E8EDF2" filter="url(#sh)"/>
  <rect x="32" y="221" width="3" height="13" rx="1.5" fill="#76B900"/>
  <text x="42" y="232" font-size="13" font-weight="700" fill="#1F2937">受影响的服务器平台</text>
  <circle cx="37" cy="252" r="3" fill="#76B900"/>
  <text x="48" y="256" font-size="12" fill="#3A4450">Vera Rubin 芯片组合</text>
  <text x="358" y="256" text-anchor="end" font-size="10" fill="#98A1AC">NVL72 VR200</text>
  <circle cx="37" cy="276" r="3" fill="#76B900"/>
  <text x="48" y="280" font-size="12" fill="#3A4450">Grace Blackwell 芯片组合</text>
  <text x="358" y="280" text-anchor="end" font-size="10" fill="#98A1AC">NVL72 GB200</text>
  <circle cx="37" cy="300" r="3" fill="#E08A3C"/>
  <text x="48" y="304" font-size="11.5" fill="#6B7280">代工厂已通知：微软 · 谷歌 · 甲骨文 等</text>

  <!-- 卡3：价格坐标系 -->
  <rect x="16" y="322" width="358" height="160" rx="16" fill="#FFFFFF" stroke="#E8EDF2" filter="url(#sh)"/>
  <rect x="32" y="333" width="3" height="13" rx="1.5" fill="#76B900"/>
  <text x="42" y="344" font-size="13" font-weight="700" fill="#1F2937">价格坐标系 · 单台报价</text>
  <text x="32" y="370" font-size="11.5" fill="#5B6572">Blackwell 架构 · GB200 NVL72</text>
  <text x="358" y="370" text-anchor="end" font-size="13" font-weight="700" fill="#1F2937">$280–340 万</text>
  <line x1="32" y1="381" x2="358" y2="381" stroke="#EEF1F5" stroke-dasharray="3,3"/>
  <text x="32" y="402" font-size="11.5" fill="#5B6572">Vera Rubin · VR200 NVL72（询价）</text>
  <text x="358" y="402" text-anchor="end" font-size="13" font-weight="700" fill="#C2571B">$500–700 万</text>
  <line x1="32" y1="413" x2="358" y2="413" stroke="#EEF1F5" stroke-dasharray="3,3"/>
  <text x="32" y="434" font-size="11.5" fill="#5B6572">消费级 RTX 5080 · 近一个月</text>
  <text x="358" y="434" text-anchor="end" font-size="13" font-weight="700" fill="#1F2937">¥8,000 → ¥12,000</text>
  <text x="32" y="462" font-size="10.5" fill="#98A1AC">※ 先进机架动辄数百万美元，15% 涨幅 ≈ 数十万美元额外支出</text>

  <!-- 卡4：财报前瞻 -->
  <rect x="16" y="492" width="358" height="146" rx="16" fill="#FFFFFF" stroke="#E8EDF2" filter="url(#sh)"/>
  <rect x="32" y="503" width="3" height="13" rx="1.5" fill="#76B900"/>
  <text x="42" y="514" font-size="13" font-weight="700" fill="#1F2937">财报前瞻 · 下周三美股盘后</text>
  <text x="32" y="536" font-size="12.5" font-weight="600" fill="#C2571B">焦点：存储涨价会否侵蚀利润率？</text>
  <text x="32" y="561" font-size="10.5" fill="#8A94A3">上年同期</text>
  <rect x="100" y="551" width="137" height="11" rx="5.5" fill="#DCE1E8"/>
  <text x="245" y="561" font-size="10.5" font-weight="700" fill="#98A1AC">60.5%</text>
  <text x="32" y="583" font-size="10.5" fill="#8A94A3">最近一季</text>
  <rect x="100" y="573" width="170" height="11" rx="5.5" fill="#76B900"/>
  <text x="278" y="583" font-size="11" font-weight="700" fill="#4C8C00">≈75%</text>
  <text x="32" y="605" font-size="10.5" fill="#8A94A3">下季指引</text>
  <rect x="100" y="595" width="169" height="11" rx="5.5" fill="#B5D67F"/>
  <text x="277" y="605" font-size="10.5" font-weight="700" fill="#7BA33A">74.9–75%</text>
  <text x="32" y="628" font-size="10.5" fill="#98A1AC">上季营收 816 亿美元，毛利率较上年同期显著抬升</text>

  <!-- 卡5：连锁反应 -->
  <rect x="16" y="648" width="358" height="106" rx="16" fill="#FFFFFF" stroke="#E8EDF2" filter="url(#sh)"/>
  <rect x="32" y="659" width="3" height="13" rx="1.5" fill="#76B900"/>
  <text x="42" y="670" font-size="13" font-weight="700" fill="#1F2937">连锁反应</text>
  <text x="32" y="692" font-size="11.5" fill="#3A4450"><tspan fill="#4C8C00" font-weight="700">①</tspan> 苹果、高通等亦因芯片短缺上调产品价格</text>
  <text x="32" y="714" font-size="11.5" fill="#3A4450"><tspan fill="#4C8C00" font-weight="700">②</tspan> 亚马逊 · 微软 · 谷歌 · Meta 加码自研芯片</text>
  <text x="32" y="736" font-size="11.5" fill="#3A4450"><tspan fill="#4C8C00" font-weight="700">③</tspan> 挑战者胜负手：三星 / 海力士 / 美光的供货</text>

  <!-- 页脚 -->
  <text x="195" y="776" text-anchor="middle" font-size="9.5" fill="#A6ADB8">资料整理自财联社报道（编辑 史正丞）· 8月23日</text>
</svg>