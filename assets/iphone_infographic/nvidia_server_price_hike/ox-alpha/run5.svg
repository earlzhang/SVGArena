<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F2D6"/>
      <stop offset="1" stop-color="#F4F7F0"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7CD7E"/>
      <stop offset="1" stop-color="#93B24B"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F08A4B"/>
      <stop offset="1" stop-color="#E2571F"/>
    </linearGradient>
    <filter id="cs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3A4A22" flood-opacity="0.07"/>
    </filter>
    <clipPath id="clipA"><rect x="16" y="126" width="358" height="224" rx="18"/></clipPath>
  </defs>

  <rect width="390" height="844" fill="#F4F7F0"/>
  <rect width="390" height="122" fill="url(#topGrad)"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif">

    <!-- 页眉 -->
    <rect x="20" y="20" width="128" height="24" rx="12" fill="#76B900"/>
    <text x="84" y="36" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">财联社快讯 · 8月23日</text>
    <text x="20" y="78" font-size="22" font-weight="700" fill="#1B2417">英伟达服务器传出涨价消息</text>
    <text x="20" y="106" font-size="22" font-weight="700" fill="#1B2417">涨幅<tspan fill="#E2571F">“很多情况下超过15%”</tspan></text>

    <!-- 卡片A：核心事实 -->
    <rect x="16" y="126" width="358" height="224" rx="18" fill="#FFFFFF" filter="url(#cs)"/>
    <g clip-path="url(#clipA)">
      <circle cx="392" cy="136" r="64" fill="#E2571F" opacity="0.06"/>
      <circle cx="392" cy="136" r="40" fill="#E2571F" opacity="0.07"/>
    </g>
    <circle cx="38" cy="151" r="3" fill="#E2571F"/>
    <text x="48" y="156" font-size="11.5" font-weight="600" fill="#9AA28D" letter-spacing="2">核心事实</text>
    <text x="32" y="218" font-size="52" font-weight="800" fill="#E2571F" letter-spacing="-1">&gt;15%</text>
    <text x="176" y="188" font-size="14.5" font-weight="700" fill="#232B1E">AI服务器将普遍提价</text>
    <text x="176" y="209" font-size="12" fill="#7A8272">内存(DRAM)成本飙升推动</text>
    <text x="176" y="227" font-size="12" fill="#7A8272">多家“最大客户”已被通知</text>
    <line x1="34" y1="248" x2="356" y2="248" stroke="#EAEEE1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="34" y="280" font-size="12" fill="#9AA28D">涉及芯片</text>
    <rect x="98" y="264" width="92" height="26" rx="13" fill="#EFF6E1"/>
    <text x="144" y="281" font-size="12" font-weight="600" fill="#567D0B" text-anchor="middle">Vera Rubin</text>
    <rect x="198" y="264" width="122" height="26" rx="13" fill="#EFF6E1"/>
    <text x="259" y="281" font-size="12" font-weight="600" fill="#567D0B" text-anchor="middle">Grace Blackwell</text>
    <g stroke="#76B900" stroke-width="1.5" fill="none">
      <circle cx="41" cy="309" r="7"/>
      <path d="M41 305.5 V309 L43.5 311"/>
    </g>
    <text x="54" y="313" font-size="12.5" font-weight="600" fill="#4A5142">适用范围：明年年初出货的系统</text>
    <text x="34" y="335" font-size="12" fill="#9AA28D">具体涨幅取决于芯片型号与内存配置</text>

    <!-- 卡片B：整机报价 -->
    <rect x="16" y="362" width="358" height="124" rx="18" fill="#FFFFFF" filter="url(#cs)"/>
    <circle cx="38" cy="387" r="3" fill="#76B900"/>
    <text x="48" y="392" font-size="13" font-weight="700" fill="#232B1E">单台整机报价参考</text>
    <text x="356" y="392" font-size="10.5" fill="#A0A69B" text-anchor="end">美元 / 台</text>
    <text x="34" y="416" font-size="11" fill="#7A8272">GB200 NVL72 · Blackwell 架构</text>
    <rect x="34" y="422" width="210" height="10" rx="5" fill="#F1F4EA"/>
    <rect x="34" y="422" width="102" height="10" rx="5" fill="url(#greenBar)"/>
    <text x="252" y="431" font-size="11.5" font-weight="700" fill="#6E8B2E">$280–340万</text>
    <text x="34" y="454" font-size="11" fill="#7A8272">VR200 NVL72 · Vera Rubin（询价）</text>
    <rect x="34" y="460" width="210" height="10" rx="5" fill="#F1F4EA"/>
    <rect x="34" y="460" width="210" height="10" rx="5" fill="url(#orangeBar)"/>
    <text x="252" y="469" font-size="11.5" font-weight="700" fill="#E2571F">$500–700万</text>
    <text x="34" y="480" font-size="10.5" fill="#A0A69B">* AI服务器动辄数百万美元/台，15%涨幅即新增数十万美元开销</text>

    <!-- 卡片C：消费端 -->
    <rect x="16" y="498" width="358" height="76" rx="18" fill="#FFFFFF" filter="url(#cs)"/>
    <circle cx="38" cy="519" r="3" fill="#76B900"/>
    <text x="48" y="524" font-size="13" font-weight="700" fill="#232B1E">消费端同样疯涨：RTX 5080 显卡</text>
    <text x="356" y="524" font-size="10.5" fill="#A0A69B" text-anchor="end">近1个月</text>
    <rect x="34" y="536" width="78" height="26" rx="13" fill="#F3F5EE"/>
    <text x="73" y="553" font-size="12" font-weight="600" fill="#5A6152" text-anchor="middle">¥8,000</text>
    <line x1="120" y1="549" x2="144" y2="549" stroke="#C4CCB4" stroke-width="1.5"/>
    <polygon points="144,544 153,549 144,554" fill="#C4CCB4"/>
    <rect x="162" y="536" width="88" height="26" rx="13" fill="#FCE9DF"/>
    <text x="206" y="553" font-size="12" font-weight="700" fill="#D14E1D" text-anchor="middle">¥12,000</text>
    <text x="262" y="557" font-size="21" font-weight="800" fill="#E2571F">+50%</text>
    <text x="318" y="556" font-size="10.5" fill="#A0A69B">月内涨幅</text>

    <!-- 卡片D：财报关注 -->
    <rect x="16" y="586" width="358" height="122" rx="18" fill="#FFFFFF" filter="url(#cs)"/>
    <circle cx="38" cy="607" r="3" fill="#76B900"/>
    <text x="48" y="612" font-size="13" font-weight="700" fill="#232B1E">下周三美股盘后 · 发布财报</text>
    <text x="34" y="638" font-size="11" fill="#7A8272">上年同期毛利率</text>
    <rect x="34" y="644" width="190" height="9" rx="4.5" fill="#F1F4EA"/>
    <rect x="34" y="644" width="115" height="9" rx="4.5" fill="#C7CEBD"/>
    <text x="232" y="652" font-size="11" font-weight="600" fill="#8A917F">60.5%</text>
    <text x="34" y="674" font-size="11" fill="#7A8272">最新季度毛利率</text>
    <rect x="34" y="680" width="190" height="9" rx="4.5" fill="#F1F4EA"/>
    <rect x="34" y="680" width="143" height="9" rx="4.5" fill="#76B900"/>
    <text x="232" y="688" font-size="11.5" font-weight="700" fill="#567D0B">~75%</text>
    <circle cx="40" cy="700" r="3" fill="#E2571F"/>
    <text x="50" y="704" font-size="11.5" font-weight="700" fill="#D14E1D">焦点：存储涨价是否侵蚀利润率？</text>

    <!-- 卡片E：连锁反应 -->
    <rect x="16" y="720" width="358" height="88" rx="18" fill="#FFFFFF" filter="url(#cs)"/>
    <circle cx="38" cy="745" r="3" fill="#76B900"/>
    <text x="48" y="750" font-size="13" font-weight="700" fill="#232B1E">连锁反应</text>
    <circle cx="41" cy="769" r="2.5" fill="#93B24B"/>
    <text x="52" y="773" font-size="11.5" fill="#4A5142">云巨头自研芯片提速：亚马逊 · 微软 · 谷歌 · Meta</text>
    <circle cx="41" cy="790" r="2.5" fill="#93B24B"/>
    <text x="52" y="794" font-size="11.5" fill="#4A5142">挑战者破局关键：三星 / SK海力士 / 美光的供应份额</text>

    <!-- 页脚 -->
    <text x="195" y="832" font-size="10" fill="#A6AC9F" text-anchor="middle">资料来源：财联社 · 编辑 史正丞 · 2025.08.23</text>
  </g>
</svg>