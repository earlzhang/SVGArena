<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF4FB"/>
      <stop offset="1" stop-color="#F9FBFE"/>
    </linearGradient>
    <linearGradient id="topStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76B900"/>
      <stop offset="0.5" stop-color="#4CAF7D"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F08A5D"/>
      <stop offset="1" stop-color="#E4573D"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#76B900" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E3A5F" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="390" height="844" fill="url(#bgGrad)"/>
  <circle cx="365" cy="45" r="95" fill="url(#glowGreen)"/>
  <circle cx="15" cy="130" r="85" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="390" height="3" fill="url(#topStrip)" opacity="0.9"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">

    <!-- 顶部信息 -->
    <rect x="16" y="16" width="112" height="24" rx="12" fill="#FFFFFF" stroke="#D8E2EF"/>
    <text x="72" y="32" text-anchor="middle" font-size="11" fill="#5A6B85">财联社 · 8月23日讯</text>
    <g transform="translate(330,16)">
      <rect x="0" y="0" width="44" height="24" rx="12" fill="#FDECE7" stroke="#F6CFC5"/>
      <path d="M9 15 L15 9 L19 12 L26 5" fill="none" stroke="#E4573D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 5 L26 5 L26 10" fill="none" stroke="#E4573D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 标题 -->
    <text x="16" y="72" font-size="20" font-weight="700" fill="#16283E">英伟达服务器传出涨价消息</text>
    <text x="16" y="97" font-size="14" fill="#3D4F66">涨幅<tspan font-weight="700" fill="#E4573D">「很多情况下超过15%」</tspan></text>

    <!-- 卡片1：核心数字 -->
    <rect x="16" y="114" width="358" height="84" rx="16" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
    <text x="30" y="139" font-size="10.5" fill="#94A3B8" letter-spacing="1">预期最高涨幅</text>
    <text x="30" y="177" font-size="40" font-weight="800" fill="#E4573D">+15%</text>
    <rect x="31" y="184" width="76" height="4" rx="2" fill="#FADCD2"/>
    <line x1="150" y1="132" x2="150" y2="181" stroke="#E8EEF6"/>
    <text x="164" y="145" font-size="11.5" fill="#475569">搭载新一代芯片的 AI 服务器</text>
    <text x="164" y="164" font-size="11.5" fill="#475569">将于明年初起普遍提价</text>
    <rect x="164" y="173" width="122" height="19" rx="9.5" fill="#FFF4EC" stroke="#F6D9C8"/>
    <text x="225" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2492F">主因：DRAM 成本飙升</text>

    <!-- 卡片2：售价对比 -->
    <rect x="16" y="212" width="358" height="232" rx="16" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
    <rect x="32" y="228" width="4" height="15" rx="2" fill="#76B900"/>
    <text x="44" y="240" font-size="14" font-weight="700" fill="#1E293B">单台售价对比</text>
    <text x="342" y="240" text-anchor="end" font-size="10.5" fill="#94A3B8">单位：万美元</text>

    <text x="32" y="270" font-size="11.5" font-weight="600" fill="#334155">VR200 NVL72 · Vera Rubin</text>
    <text x="342" y="270" text-anchor="end" font-size="12.5" font-weight="700" fill="#E4573D">$500–700万</text>
    <rect x="32" y="278" width="310" height="13" rx="6.5" fill="#EEF3FA"/>
    <rect x="253" y="278" width="89" height="13" rx="6.5" fill="url(#barHot)"/>

    <text x="32" y="316" font-size="11.5" font-weight="600" fill="#334155">GB200 NVL72 · Blackwell 架构</text>
    <text x="342" y="316" text-anchor="end" font-size="12.5" font-weight="700" fill="#E4573D">$280–340万</text>
    <rect x="32" y="324" width="310" height="13" rx="6.5" fill="#EEF3FA"/>
    <rect x="156" y="324" width="27" height="13" rx="6.5" fill="url(#barHot)"/>

    <text x="32" y="353" font-size="10.5" fill="#94A3B8">* 单台动辄数百万美元，15% 涨幅即新增近百万美元成本</text>
    <line x1="32" y1="368" x2="342" y2="368" stroke="#E4EAF2" stroke-dasharray="4 3"/>

    <circle cx="43" cy="389" r="10" fill="#FFF3E0" stroke="#F6DDB0"/>
    <path transform="translate(38.5,380)" d="M6 0 L0 11 H3.8 L2 19 L9.5 7.5 H5.5 L8.5 0 Z" fill="#F0A03C"/>
    <text x="60" y="387" font-size="12" font-weight="600" fill="#1E293B">消费级显卡同步暴涨：RTX 5080</text>
    <text x="60" y="407" font-size="13"><tspan fill="#64748B">¥8,000</tspan><tspan fill="#B0BDD0">  →  </tspan><tspan font-weight="700" fill="#1E293B">¥12,000</tspan><tspan fill="#64748B">　一个月 </tspan><tspan font-weight="800" fill="#E4573D">+50%</tspan></text>

    <!-- 卡片3：毛利率 -->
    <rect x="16" y="458" width="358" height="126" rx="16" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
    <rect x="32" y="473" width="4" height="15" rx="2" fill="#3B82F6"/>
    <text x="44" y="485" font-size="13.5" font-weight="700" fill="#1E293B">财报前瞻 · 存储涨价会否侵蚀利润率？</text>

    <text x="32" y="513" font-size="11" fill="#5B6B80">上财年同期</text>
    <rect x="112" y="505" width="180" height="9" rx="4.5" fill="#EEF3FA"/>
    <rect x="112" y="505" width="136" height="9" rx="4.5" fill="#C7D2E0"/>
    <text x="342" y="513" text-anchor="end" font-size="12" font-weight="700" fill="#7A8AA0">60.5%</text>

    <text x="32" y="537" font-size="11" fill="#5B6B80">最新季度</text>
    <rect x="112" y="529" width="180" height="9" rx="4.5" fill="#EEF3FA"/>
    <rect x="112" y="529" width="169" height="9" rx="4.5" fill="#76B900"/>
    <text x="342" y="537" text-anchor="end" font-size="12" font-weight="700" fill="#4E8F1F">≈75%</text>

    <text x="32" y="561" font-size="11" fill="#5B6B80">下季指引</text>
    <rect x="112" y="553" width="180" height="9" rx="4.5" fill="#EEF3FA"/>
    <rect x="112" y="553" width="168" height="9" rx="4.5" fill="#8CC63F"/>
    <text x="342" y="561" text-anchor="end" font-size="12" font-weight="700" fill="#5E9E22">74.9–75%</text>

    <text x="32" y="577" font-size="10" fill="#9AA9BC">下周三美股盘后披露财报 · 市场聚焦存储涨价影响</text>

    <!-- 卡片4：核心要点 -->
    <rect x="16" y="598" width="358" height="176" rx="16" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
    <rect x="32" y="613" width="4" height="15" rx="2" fill="#E4573D"/>
    <text x="44" y="625" font-size="14" font-weight="700" fill="#1E293B">核心要点</text>

    <circle cx="38" cy="648" r="3" fill="#E4573D"/>
    <text x="50" y="652" font-size="11.5" fill="#3D4F66">明年初出货的 Vera Rubin / Grace Blackwell 系统<tspan x="50" dy="15">将普遍提价，涨幅取决于芯片与内存配置</tspan></text>

    <circle cx="38" cy="679" r="3" fill="#76B900"/>
    <text x="50" y="683" font-size="11.5" fill="#3D4F66">微软、谷歌、甲骨文等大客户已收到涨价通知</text>

    <circle cx="38" cy="710" r="3" fill="#3B82F6"/>
    <text x="50" y="714" font-size="11.5" fill="#3D4F66">DRAM 决定 AI 芯片实际性能，供给紧张令<tspan x="50" dy="15">三星、SK海力士、美光等话语权大增</tspan></text>

    <circle cx="38" cy="741" r="3" fill="#F5A623"/>
    <text x="50" y="745" font-size="11.5" fill="#3D4F66">高昂整机价格或助推云巨头自研芯片提速，<tspan x="50" dy="15">但英伟达软件护城河短期内仍难以撼动</tspan></text>

    <!-- 页脚 -->
    <line x1="16" y1="788" x2="374" y2="788" stroke="#E4EAF2"/>
    <text x="16" y="804" font-size="10.5" fill="#8CA0B8">来源：财联社 · 编辑 史正丞</text>
    <text x="374" y="804" text-anchor="end" font-size="10" fill="#AAB8C8">价格为媒体援引知情人士报道口径</text>
  </g>
</svg>