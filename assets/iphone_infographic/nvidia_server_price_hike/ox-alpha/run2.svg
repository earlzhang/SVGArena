<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F1FA"/><stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB4DC"/><stop offset="1" stop-color="#6E97C4"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E58A72"/><stop offset="1" stop-color="#D95F49"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2A41" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D64545"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F4F7FB"/>
  <circle cx="374" cy="22" r="64" fill="#76B900" opacity="0.06"/>
  <circle cx="8" cy="832" r="54" fill="#3B82C4" opacity="0.05"/>

  <!-- 头部 -->
  <rect width="390" height="112" fill="url(#hdr)"/>
  <g>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#14273B"/>
    <text x="33" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#76B900">N</text>
    <rect x="11.5" y="23.5" width="4.5" height="3" rx="1" fill="#14273B"/>
    <rect x="11.5" y="32.5" width="4.5" height="3" rx="1" fill="#14273B"/>
    <rect x="11.5" y="41.5" width="4.5" height="3" rx="1" fill="#14273B"/>
    <rect x="50.5" y="23.5" width="4.5" height="3" rx="1" fill="#14273B"/>
    <rect x="50.5" y="32.5" width="4.5" height="3" rx="1" fill="#14273B"/>
    <rect x="50.5" y="41.5" width="4.5" height="3" rx="1" fill="#14273B"/>
    <rect x="23.5" y="11.5" width="3" height="4.5" rx="1" fill="#14273B"/>
    <rect x="32.5" y="11.5" width="3" height="4.5" rx="1" fill="#14273B"/>
    <rect x="41.5" y="11.5" width="3" height="4.5" rx="1" fill="#14273B"/>
    <rect x="23.5" y="50.5" width="3" height="4.5" rx="1" fill="#14273B"/>
    <rect x="32.5" y="50.5" width="3" height="4.5" rx="1" fill="#14273B"/>
    <rect x="41.5" y="50.5" width="3" height="4.5" rx="1" fill="#14273B"/>
  </g>
  <text x="58" y="28" font-size="10" fill="#5A6B7F">财联社电报 · 2025年8月23日</text>
  <rect x="322" y="14" width="52" height="20" rx="10" fill="#FFFFFF" stroke="#D8E2EC"/>
  <text x="348" y="27.5" text-anchor="middle" font-size="9" fill="#5A6B7F">半导体</text>

  <text x="16" y="64" font-size="20" font-weight="800" fill="#14273B">英伟达服务器传出涨价消息</text>
  <text x="16" y="90" font-size="16" font-weight="700" fill="#14273B">涨幅<tspan fill="#D64545">“很多情况下超过15%”</tspan></text>
  <line x1="16" y1="104" x2="374" y2="104" stroke="#DCE5EF"/>

  <!-- 卡片1：核心要点 -->
  <rect x="16" y="116" width="358" height="154" rx="14" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
  <circle cx="32" cy="140" r="4" fill="#76B900"/>
  <text x="42" y="144" font-size="13" font-weight="700" fill="#14273B">核心要点</text>
  <text x="24" y="166" font-size="10" fill="#93A1B1">部分涨幅</text>
  <text x="24" y="204" font-size="40" font-weight="800" fill="#D64545">15%+</text>
  <text x="128" y="176" font-size="13" font-weight="700" fill="#14273B">AI服务器将普遍提价</text>
  <text x="128" y="195" font-size="11" fill="#5A6B7F">主因：DRAM内存成本飙升</text>
  <text x="128" y="212" font-size="11" fill="#5A6B7F">适用于明年初出货的系统</text>
  <line x1="24" y1="222" x2="366" y2="222" stroke="#E4EBF4" stroke-dasharray="4 3"/>
  <rect x="24" y="232" width="82" height="22" rx="11" fill="#EFF4F8"/>
  <text x="65" y="247" text-anchor="middle" font-size="10" fill="#3B6EA5">Vera Rubin</text>
  <rect x="114" y="232" width="110" height="22" rx="11" fill="#EFF4F8"/>
  <text x="169" y="247" text-anchor="middle" font-size="10" fill="#3B6EA5">Grace Blackwell</text>
  <rect x="232" y="232" width="96" height="22" rx="11" fill="#FDF0EE"/>
  <text x="280" y="247" text-anchor="middle" font-size="10" fill="#C25545">最大客户已获通知</text>

  <!-- 卡片2：机架报价 -->
  <rect x="16" y="280" width="358" height="170" rx="14" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
  <rect x="24" y="294" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="34" y="306" font-size="13" font-weight="700" fill="#14273B">机架级系统报价对比</text>
  <text x="366" y="305" text-anchor="end" font-size="9" fill="#8A98A8">单位：美元 / 台</text>

  <text x="24" y="332" font-size="11" font-weight="700" fill="#14273B">GB200 · Blackwell架构</text>
  <text x="366" y="332" text-anchor="end" font-size="11" font-weight="700" fill="#4A7DBF">280–340万</text>
  <rect x="24" y="338" width="342" height="12" rx="6" fill="#EDF2F8"/>
  <rect x="24" y="338" width="166" height="12" rx="6" fill="url(#barBlue)"/>

  <text x="24" y="370" font-size="11" font-weight="700" fill="#14273B">VR200 · Vera Rubin架构</text>
  <text x="366" y="370" text-anchor="end" font-size="11" font-weight="700" fill="#D64545">500–700万（询价）</text>
  <rect x="24" y="376" width="342" height="12" rx="6" fill="#EDF2F8"/>
  <rect x="24" y="376" width="342" height="12" rx="6" fill="url(#barRed)"/>
  <text x="366" y="360" text-anchor="end" font-size="9" fill="#D64545">▲ 报价中枢上移</text>

  <text x="24" y="408" font-size="10" fill="#5A6B7F">※ 单台动辄数百万美元，涨15%＝额外几十万至上百万美元</text>
  <text x="24" y="424" font-size="10" fill="#5A6B7F">代工企业已通知微软、谷歌、甲骨文等云巨头客户</text>

  <!-- 卡片3：显卡先例 -->
  <rect x="16" y="460" width="358" height="92" rx="14" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
  <rect x="24" y="474" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="34" y="486" font-size="13" font-weight="700" fill="#14273B">消费端先例：游戏显卡已暴涨</text>
  <text x="24" y="514" font-size="12" font-weight="700" fill="#14273B">RTX 5080（次旗舰）</text>
  <text x="24" y="536" font-size="14" fill="#9AA8B6">¥8,000</text>
  <line x1="24" y1="531" x2="76" y2="531" stroke="#9AA8B6" stroke-width="1.5"/>
  <text x="122" y="520" text-anchor="middle" font-size="9" fill="#D64545">1个月</text>
  <line x1="94" y1="529" x2="150" y2="529" stroke="#D64545" stroke-width="2" marker-end="url(#arr)"/>
  <text x="162" y="536" font-size="18" font-weight="800" fill="#14273B">¥12,000</text>
  <rect x="292" y="514" width="64" height="24" rx="12" fill="#FDECEC" stroke="#F0C4C4"/>
  <text x="324" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#D64545">+50%</text>

  <!-- 卡片4：财报前瞻 -->
  <rect x="16" y="562" width="358" height="124" rx="14" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
  <rect x="24" y="576" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="34" y="588" font-size="13" font-weight="700" fill="#14273B">下周财报焦点：利润率保卫战</text>

  <path d="M 32,650 A 32 32 0 0 1 96,650" fill="none" stroke="#E7EEF6" stroke-width="9" stroke-linecap="round"/>
  <path d="M 32,650 A 32 32 0 0 1 86.6,627.4" fill="none" stroke="#76B900" stroke-width="9" stroke-linecap="round"/>
  <text x="64" y="648" text-anchor="middle" font-size="16" font-weight="800" fill="#14273B">75%</text>
  <text x="64" y="664" text-anchor="middle" font-size="9" fill="#8A98A8">当前毛利率</text>

  <circle cx="126" cy="608.5" r="2.5" fill="#76B900"/>
  <text x="136" y="612" font-size="11" fill="#14273B">定档下周三，美股盘后发布财报</text>
  <circle cx="126" cy="630.5" r="2.5" fill="#3B82C4"/>
  <text x="136" y="634" font-size="11" fill="#14273B">上季营收816亿美元，毛利率约75%</text>
  <circle cx="126" cy="654.5" r="2.5" fill="#D64545"/>
  <text x="136" y="658" font-size="11" font-weight="700" fill="#D64545">疑问：存储涨价会否侵蚀利润率？</text>

  <!-- 卡片5：连锁反应 -->
  <rect x="16" y="696" width="358" height="118" rx="14" fill="#FFFFFF" stroke="#E4EBF4" filter="url(#soft)"/>
  <rect x="24" y="710" width="4" height="14" rx="2" fill="#76B900"/>
  <text x="34" y="722" font-size="13" font-weight="700" fill="#14273B">连锁反应</text>

  <rect x="24" y="732" width="110" height="74" rx="10" fill="#F7FAFD" stroke="#E4EBF4"/>
  <rect x="73" y="738" width="12" height="12" rx="3" fill="#3B82C4"/>
  <text x="79" y="764" text-anchor="middle" font-size="11" font-weight="700" fill="#14273B">云巨头自研提速</text>
  <text x="79" y="780" text-anchor="middle" font-size="9.5" fill="#5A6B7F">亚马逊 · 微软 · 谷歌</text>
  <text x="79" y="794" text-anchor="middle" font-size="9.5" fill="#5A6B7F">Meta 布局自研芯片</text>

  <rect x="141" y="732" width="110" height="74" rx="10" fill="#F7FAFD" stroke="#E4EBF4"/>
  <rect x="190" y="738" width="12" height="12" rx="3" fill="#E8A13D"/>
  <text x="196" y="764" text-anchor="middle" font-size="11" font-weight="700" fill="#14273B">内存厂话语权升</text>
  <text x="196" y="780" text-anchor="middle" font-size="9.5" fill="#5A6B7F">三星 · SK海力士</text>
  <text x="196" y="794" text-anchor="middle" font-size="9.5" fill="#5A6B7F">美光：供货成关键</text>

  <rect x="258" y="732" width="110" height="74" rx="10" fill="#F7FAFD" stroke="#E4EBF4"/>
  <rect x="307" y="738" width="12" height="12" rx="3" fill="#D64545"/>
  <text x="313" y="764" text-anchor="middle" font-size="11" font-weight="700" fill="#14273B">更多终端跟涨</text>
  <text x="313" y="780" text-anchor="middle" font-size="9.5" fill="#5A6B7F">苹果 · 高通等表示</text>
  <text x="313" y="794" text-anchor="middle" font-size="9.5" fill="#5A6B7F">因缺芯上调产品价格</text>

  <!-- 页脚 -->
  <line x1="16" y1="822" x2="374" y2="822" stroke="#E4EBF4"/>
  <text x="195" y="836" text-anchor="middle" font-size="9" fill="#93A1B1">财联社 · 8月23日讯 · 编辑 史正丞</text>
</svg>