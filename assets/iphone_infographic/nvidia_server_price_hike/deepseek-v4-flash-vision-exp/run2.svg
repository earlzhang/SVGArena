<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-weight: 700; fill: #E11D48; }
      .meta { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 11px; fill: #94A3B8; font-weight: 400; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 14px; font-weight: 700; fill: #1E293B; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 12px; fill: #475569; font-weight: 400; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 12px; fill: #1E293B; font-weight: 700; }
      .highlight { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 14px; font-weight: 700; fill: #E11D48; }
      .highlight-blue { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 12px; font-weight: 700; fill: #0EA5E9; }
      .highlight-green { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Heiti SC", "STHeiti", sans-serif; font-size: 14px; font-weight: 700; fill: #10B981; }
      .shadow { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.04)); }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#CBD5E0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F4F7FB" />

  <!-- 顶部装饰线 -->
  <rect x="0" y="0" width="390" height="4" fill="#E11D48" />
  <rect x="0" y="4" width="390" height="2" fill="#F4F7FB" />

  <!-- 标题区域 -->
  <text x="20" y="36" class="meta">财联社 8月23日讯（编辑 史正丞）</text>
  
  <text x="20" y="72" class="title" font-size="24">英伟达服务器</text>
  <text x="20" y="102" class="title" font-size="24">传出涨价消息</text>
  <text x="20" y="136" class="subtitle" font-size="18">涨幅「很多情况下超过15%」</text>

  <!-- 摘要标签 -->
  <rect x="20" y="154" width="86" height="22" rx="11" fill="#E11D48" />
  <text x="63" y="169" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Heiti SC', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">核心摘要</text>

  <!-- 卡片 0：核心摘要 -->
  <g class="shadow" filter="url(#shadow)">
    <rect x="16" y="186" width="358" height="110" rx="12" fill="#FFFFFF" />
    <rect x="16" y="186" width="4" height="110" rx="2" fill="#E11D48" />
    <text x="32" y="210" class="card-title">📌 核心消息</text>
    <text x="32" y="232" class="text">搭载英伟达 <tspan fill="#1E293B" font-weight="700">Vera Rubin</tspan>、<tspan fill="#1E293B" font-weight="700">Grace Blackwell</tspan> 等芯片的</text>
    <text x="32" y="252" class="text">服务器，明年初起将普遍提价。</text>
    <text x="32" y="278" class="text-bold">涨幅<span class="highlight">很多情况下超过15%</span></text>
  </g>

  <!-- 卡片 1：涨价详情 -->
  <g class="shadow" filter="url(#shadow)">
    <rect x="16" y="312" width="358" height="110" rx="12" fill="#FFFFFF" />
    <rect x="16" y="312" width="4" height="110" rx="2" fill="#0EA5E9" />
    <text x="32" y="336" class="card-title">🧩 涨价详情</text>
    <text x="32" y="358" class="text">多家「英伟达最大客户」已被告知涨价</text>
    <text x="32" y="378" class="text">微软、谷歌、甲骨文等代工厂均已通知</text>
    <text x="32" y="398" class="text">具体涨幅取决于芯片型号和内存配置</text>
  </g>

  <!-- 卡片 2：背后原因 -->
  <g class="shadow" filter="url(#shadow)">
    <rect x="16" y="438" width="358" height="110" rx="12" fill="#FFFFFF" />
    <rect x="16" y="438" width="4" height="110" rx="2" fill="#F59E0B" />
    <text x="32" y="462" class="card-title">⚙️ 背后原因</text>
    <text x="32" y="484" class="text-bold">内存芯片（DRAM）成本飙升是主因</text>
    <text x="32" y="504" class="text">算力战争让原本的大宗商品属性改变</text>
    <text x="32" y="524" class="text">内存制造商获得前所未有的行业影响力</text>
  </g>

  <!-- 卡片 3：市场关注 / 财务影响 -->
  <g class="shadow" filter="url(#shadow)">
    <rect x="16" y="564" width="358" height="120" rx="12" fill="#FFFFFF" />
    <rect x="16" y="564" width="4" height="120" rx="2" fill="#8B5CF6" />
    <text x="32" y="588" class="card-title">💰 市场关注与财务影响</text>
    <text x="32" y="610" class="text">算力巨头英伟达 <tspan fill="#1E293B" font-weight="700">下周三</tspan> 发布最新财报</text>
    <text x="32" y="630" class="text">市场密切关注存储涨价是否会</text>
    <text x="32" y="650" class="text">侵蚀芯片龙头的利润率</text>
    <rect x="32" y="660" width="110" height="24" rx="6" fill="#F1F5F9" />
    <text x="87" y="676" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Heiti SC', sans-serif" font-size="11" font-weight="700" fill="#8B5CF6">当前毛利率 75%</text>
  </g>

  <!-- 卡片 4：市场对比与行业动态 -->
  <g class="shadow" filter="url(#shadow)">
    <rect x="16" y="700" width="358" height="120" rx="12" fill="#FFFFFF" />
    <rect x="16" y="700" width="4" height="120" rx="2" fill="#10B981" />
    <text x="32" y="724" class="card-title">📊 市场对比与行业影响</text>
    <text x="32" y="746" class="text">消费级显卡同样暴涨：<tspan fill="#1E293B" font-weight="700">RTX 5080</tspan></text>
    <text x="32" y="766" class="text">1个月从 ¥8,000 跳到 <tspan class="highlight-green">¥12,000</tspan></text>
    <text x="32" y="786" class="text">高价服务器推动云厂商自研芯片</text>
    <text x="32" y="806" class="text">但英伟达软件体系是「护城河」</text>
  </g>

  <!-- 底部来源 -->
  <text x="195" y="836" text-anchor="middle" class="meta">数据来源：财联社 | 视觉呈现：AI</text>
</svg>