<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F4F8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <style>
      .title { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-weight: 600; fill: #1E293B; }
      .subtitle { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-weight: 500; fill: #475569; }
      .body { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-weight: 400; fill: #64748B; }
      .bold { font-weight: 600; }
      .accent { fill: #3B82F6; }
      .warn { fill: #EF4444; }
      .green { fill: #10B981; }
      .amber { fill: #F59E0B; }
      .card { fill: #FFFFFF; filter: url(#shadow); rx: 16; }
      .section-title { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-weight: 600; font-size: 15px; fill: #0F172A; }
      .note { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 11px; fill: #F59E0B; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bgGrad)" />

  <!-- Header -->
  <g id="header">
    <rect x="0" y="0" width="4" height="90" fill="#76B900" />
    <rect x="0" y="0" width="390" height="90" fill="#FFFFFF" />
    <rect x="4" y="0" width="386" height="90" fill="#FFFFFF" />
    <text x="20" y="30" class="subtitle" style="font-size: 12px">财联社 8月23日讯（编辑 史正丞）</text>
    <text x="20" y="55" class="title" style="font-size: 20px">英伟达服务器传出涨价消息</text>
    <text x="20" y="80" class="title" style="font-size: 18px; fill: #EF4444">涨幅"很多情况下超过15%"</text>
    <rect x="0" y="90" width="390" height="1" fill="#E2E8F0" />
  </g>

  <!-- Card 1: Core News -->
  <g id="card1">
    <rect x="20" y="110" width="350" height="105" class="card" />
    <!-- Icon -->
    <rect x="25" y="120" width="20" height="20" rx="5" fill="#EF4444" />
    <path d="M35 135 L35 126 M31 131 L35 125 L39 131" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Title -->
    <text x="55" y="135" class="section-title" style="font-size: 14px">多家"英伟达最大客户"已被告知</text>
    <!-- Body -->
    <text x="20" y="160" class="body" style="font-size: 13px">明年初起，搭载 Vera Rubin 或 Grace Blackwell</text>
    <text x="20" y="180" class="body" style="font-size: 13px">芯片组合的服务器将普遍提价。</text>
    <!-- Highlight -->
    <rect x="20" y="195" width="350" height="22" rx="6" fill="#FEE2E2" />
    <text x="195" y="210" class="bold" style="font-size: 13px; fill: #EF4444; text-anchor: middle">很多情况下涨幅超过 15%</text>
  </g>

  <!-- Card 2: Core Reason -->
  <g id="card2">
    <rect x="20" y="230" width="350" height="120" class="card" />
    <!-- Icon -->
    <rect x="25" y="240" width="20" height="20" rx="4" fill="#3B82F6" />
    <path d="M30 248 L40 248" stroke="#FFFFFF" stroke-width="2" />
    <path d="M35 240 L35 245 M35 255 L35 260" stroke="#3B82F6" stroke-width="2" />
    <!-- Title -->
    <text x="55" y="255" class="section-title" style="font-size: 14px">核心原因：内存芯片成本飙升</text>
    <!-- Body -->
    <text x="20" y="280" class="body" style="font-size: 13px">AI 算力性能极度依赖 DRAM 容量，</text>
    <text x="20" y="300" class="body" style="font-size: 13px">存储厂商（三星、SK海力士、美光）话语权大增。</text>
    <text x="20" y="325" class="body" style="font-size: 12px">苹果、高通等大型科技公司也因芯片短缺被迫提价。</text>
  </g>

  <!-- Card 3: Impact / Price Chart -->
  <g id="card3">
    <rect x="20" y="365" width="350" height="215" class="card" />
    <!-- Icon -->
    <rect x="27" y="377" width="16" height="16" rx="4" fill="#F59E0B" />
    <rect x="31" y="385" width="3" height="5" fill="#FFFFFF" />
    <rect x="36" y="382" width="3" height="8" fill="#FFFFFF" />
    <!-- Title -->
    <text x="55" y="390" class="section-title" style="font-size: 14px">涨价波及面：消费级与企业级</text>

    <!-- Consumer Section -->
    <text x="20" y="415" class="bold" style="font-size: 13px; fill: #475569">消费级 · 次旗舰 RTX 5080</text>
    <text x="20" y="440" class="bold" style="font-size: 16px; fill: #EF4444">8,000元 <tspan style="font-size: 12px; fill: #64748B;">→</tspan> 1.2万元</text>
    <text x="20" y="460" class="body" style="font-size: 12px">1个月涨幅达 50%</text>

    <!-- Enterprise Section -->
    <text x="20" y="490" class="bold" style="font-size: 13px; fill: #475569">企业级 · 英伟达AI服务器</text>
    
    <!-- Row 1 -->
    <text x="20" y="510" class="body" style="font-size: 12px">GB200 NVL72 机架</text>
    <rect x="20" y="515" width="200" height="8" rx="4" fill="#E2E8F0" />
    <rect x="20" y="515" width="150" height="8" rx="4" fill="#3B82F6" />
    <text x="230" y="522" class="bold" style="font-size: 12px; fill: #0F172A">280万-340万美元</text>

    <!-- Row 2 -->
    <text x="20" y="545" class="body" style="font-size: 12px">VR200 系统 (询价)</text>
    <rect x="20" y="550" width="300" height="8" rx="4" fill="#E2E8F0" />
    <rect x="20" y="550" width="250" height="8" rx="4" fill="#EF4444" />
    <text x="330" y="557" class="bold" style="font-size: 12px; fill: #EF4444">500万-700万美元</text>

    <!-- Note -->
    <text x="20" y="570" class="note" style="font-size: 11px">⚠ 15%的涨幅意味着数十万至近百万美元的额外开销</text>
  </g>

  <!-- Card 4: Nvidia Financials -->
  <g id="card4">
    <rect x="20" y="595" width="350" height="150" class="card" />
    <!-- Icon -->
    <rect x="25" y="605" width="20" height="20" rx="5" fill="#10B981" />
    <text x="35" y="620" class="bold" style="font-size: 14px; fill: #FFFFFF; text-anchor: middle">$</text>
    <!-- Title -->
    <text x="55" y="620" class="section-title" style="font-size: 14px">市场关注：存储涨价是否会侵蚀利润率</text>

    <!-- Box Row 1 -->
    <rect x="25" y="640" width="145" height="45" rx="8" fill="#F8FAFC" />
    <text x="97.5" y="656" class="body" style="font-size: 11px; text-anchor: middle">财报发布</text>
    <text x="97.5" y="672" class="bold" style="font-size: 12px; text-anchor: middle; fill: #0F172A">下周三盘后</text>

    <rect x="180" y="640" width="145" height="45" rx="8" fill="#F8FAFC" />
    <text x="252.5" y="656" class="body" style="font-size: 11px; text-anchor: middle">Q1 营收</text>
    <text x="252.5" y="672" class="bold" style="font-size: 12px; text-anchor: middle; fill: #0F172A">816亿美元</text>

    <!-- Box Row 2 -->
    <rect x="25" y="695" width="145" height="45" rx="8" fill="#F8FAFC" />
    <text x="97.5" y="711" class="body" style="font-size: 11px; text-anchor: middle">Q1 毛利率</text>
    <text x="97.5" y="727" class="bold" style="font-size: 12px; text-anchor: middle; fill: #10B981">75%</text>

    <rect x="180" y="695" width="145" height="45" rx="8" fill="#F8FAFC" />
    <text x="252.5" y="711" class="body" style="font-size: 11px; text-anchor: middle">Q2 预期</text>
    <text x="252.5" y="727" class="bold" style="font-size: 12px; text-anchor: middle; fill: #0F172A">74.9%-75%</text>
  </g>

  <!-- Card 5: Industry Response -->
  <g id="card5">
    <rect x="20" y="760" width="350" height="84" class="card" />
    <!-- Icon -->
    <rect x="25" y="770" width="20" height="20" rx="5" fill="#64748B" />
    <path d="M30 782 L35 777 L40 782" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <path d="M35 782 L35 786" stroke="#FFFFFF" stroke-width="2" />
    <!-- Title -->
    <text x="55" y="785" class="section-title" style="font-size: 14px">行业长期反应：自研芯片"窗口期"？</text>
    <!-- Body -->
    <text x="20" y="810" class="body" style="font-size: 12px">亚马逊、微软、谷歌、Meta 加速自研芯片。</text>
    <text x="20" y="830" class="body" style="font-size: 12px">但英伟达软件"护城河"仍深，多数新数据中心仍高度依赖英伟达。</text>
  </g>

</svg>