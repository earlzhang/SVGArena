<svg viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Hiragino Sans GB, STHeiti, sans-serif">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
        </filter>
        <linearGradient id="topbar" x1="0" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#14B8A6"/>
            <stop offset="1" stop-color="#0D9488"/>
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="750" height="1334" fill="#F8FAFC"/>
    <circle cx="375" cy="180" r="260" fill="#F0FDFA" opacity="0.8"/>

    <!-- 顶部装饰 -->
    <rect x="0" y="0" width="750" height="6" fill="url(#topbar)"/>

    <!-- 标题区 -->
    <text x="375" y="85" text-anchor="middle" font-size="40" font-weight="bold" fill="#1E293B">英伟达服务器传出涨价消息</text>
    <rect x="50" y="120" width="650" height="70" rx="12" fill="#FEF3C7"/>
    <text x="375" y="170" text-anchor="middle" font-size="44" font-weight="bold" fill="#B45309">涨幅“很多情况下超过15%”</text>
    <text x="375" y="215" text-anchor="middle" font-size="22" fill="#64748B">财联社8月23日讯（编辑 史正丞）</text>

    <!-- 卡片1：涨价原因 -->
    <rect x="40" y="250" width="670" height="110" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="70" y="290" font-size="28" fill="#0D9488" font-weight="bold">📌 涨价原因</text>
    <text x="70" y="330" font-size="25" fill="#334155">内存芯片（DRAM）成本飙升，AI服务器价格跟涨</text>
    <text x="70" y="360" font-size="23" fill="#64748B">多家“英伟达最大客户”已收到涨价通知</text>

    <!-- 卡片2：涨价细节 -->
    <rect x="40" y="380" width="670" height="190" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="70" y="415" font-size="28" fill="#0D9488" font-weight="bold">📈 涨价细节</text>
    <rect x="70" y="440" width="160" height="90" rx="12" fill="#FEF2F2"/>
    <text x="150" y="510" text-anchor="middle" font-size="80" font-weight="bold" fill="#DC2626">&gt;15%</text>
    <text x="250" y="480" font-size="26" fill="#334155">很多情况下的涨幅</text>
    <text x="250" y="515" font-size="24" fill="#64748B">出货时间：明年初起</text>
    <text x="70" y="550" font-size="24" fill="#475569">涉及芯片：Vera Rubin / Grace Blackwell</text>

    <!-- 卡片3：市场关注 -->
    <rect x="40" y="590" width="670" height="150" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="70" y="625" font-size="28" fill="#0D9488" font-weight="bold">💰 市场关注</text>
    <text x="70" y="665" font-size="25" fill="#1E293B">英伟达将于下周发布财报，关注利润率影响</text>
    <text x="70" y="705" font-size="24" fill="#64748B">上一财年同期毛利率60.5%，当前约75%</text>

    <!-- 卡片4：售价参考 -->
    <rect x="40" y="760" width="670" height="150" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="70" y="795" font-size="28" fill="#0D9488" font-weight="bold">💵 售价参考（整机柜）</text>
    <text x="70" y="835" font-size="26" fill="#334155">GB200 NVL72：280万-340万美元/台</text>
    <text x="70" y="875" font-size="26" fill="#334155">VR200 NVL72：500万-700万美元/台</text>

    <!-- 卡片5：连锁反应 -->
    <rect x="40" y="930" width="670" height="200" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="70" y="965" font-size="28" fill="#0D9488" font-weight="bold">📊 连锁反应</text>
    <text x="70" y="1005" font-size="26" fill="#334155">消费级显卡 RTX 5080 一个月内</text>
    <rect x="70" y="1020" width="240" height="46" rx="8" fill="#FEF2F2"/>
    <text x="85" y="1048" font-size="24" font-weight="bold" fill="#DC2626">8000元 ➔ 1.2万元</text>
    <text x="70" y="1095" font-size="24" fill="#475569">云巨头加速自研芯片，英伟达软件生态壁垒仍高</text>

    <!-- 底部信息 -->
    <line x1="40" y1="1155" x2="710" y2="1155" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="375" y="1185" text-anchor="middle" font-size="22" fill="#94A3B8">数据来源：财联社 · 编辑 史正丞</text>
    <text x="375" y="1215" text-anchor="middle" font-size="20" fill="#94A3B8">内容仅供参考，不构成投资建议</text>
</svg>