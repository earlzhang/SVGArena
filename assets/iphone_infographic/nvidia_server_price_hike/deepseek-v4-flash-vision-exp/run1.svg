<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>
      .font {
        font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "STHeiti", "Apple LiGothic", sans-serif;
      }
      .card {
        fill: #FFFFFF;
        stroke: #EAE7E3;
        stroke-width: 1.5;
      }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect width="390" height="844" fill="#F5F3EF"/>
  
  <!-- 顶部装饰 -->
  <path d="M0,0 H390 V130 Q260,175 0,170 Z" fill="#E8F0FF" opacity="0.6"/>
  
  <!-- Header -->
  <rect x="24" y="38" width="130" height="22" rx="11" fill="#0071E3"/>
  <text x="89" y="53" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600" class="font">财联社 · 8月23日</text>
  
  <text x="24" y="97" font-size="29" fill="#1D1D1F" font-weight="700" class="font">英伟达服务器</text>
  <text x="24" y="132" font-size="29" fill="#1D1D1F" font-weight="700" class="font">传出涨价消息</text>
  <text x="24" y="158" font-size="17" fill="#FF9500" font-weight="600" class="font">涨幅"很多情况下超过15%"</text>
  
  <!-- 核心卡片 -->
  <rect x="20" y="170" width="350" height="140" rx="18" class="card"/>
  <rect x="40" y="188" width="64" height="24" rx="12" fill="#FF3B30"/>
  <text x="72" y="205" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" class="font">涨价</text>
  
  <text x="40" y="240" font-size="16" fill="#1D1D1F" font-weight="600" class="font">明年初起 服务器普遍提价</text>
  <text x="40" y="266" font-size="12" fill="#6E6E73" class="font">搭载Vera Rubin、Grace Blackwell等芯片</text>
  
  <text x="40" y="293" font-size="18" fill="#6E6E73" font-weight="600" class="font">超过</text>
  <text x="88" y="293" font-size="46" fill="#FF3B30" font-weight="700" class="font">15%</text>
  <text x="190" y="293" font-size="13" fill="#8E8E93" class="font">部分涨幅</text>
  
  <!-- 两列卡片 -->
  <rect x="20" y="325" width="170" height="110" rx="16" class="card"/>
  <rect x="36" y="341" width="44" height="18" rx="9" fill="#F0EEE9"/>
  <text x="58" y="355" font-size="10" fill="#6E6E73" text-anchor="middle" font-weight="600" class="font">原因</text>
  <text x="36" y="385" font-size="15" fill="#1D1D1F" font-weight="600" class="font">内存芯片成本飙升</text>
  <text x="36" y="410" font-size="12" fill="#8E8E93" class="font">DRAM供应链紧张</text>
  
  <rect x="200" y="325" width="170" height="110" rx="16" class="card"/>
  <rect x="216" y="341" width="44" height="18" rx="9" fill="#F0EEE9"/>
  <text x="238" y="355" font-size="10" fill="#6E6E73" text-anchor="middle" font-weight="600" class="font">客户</text>
  <text x="216" y="385" font-size="15" fill="#1D1D1F" font-weight="600" class="font">微软、谷歌和甲骨文</text>
  <text x="216" y="410" font-size="12" fill="#8E8E93" class="font">代工厂已通知涨价</text>
  
  <!-- 价格标题 -->
  <text x="24" y="450" font-size="13" fill="#6E6E73" font-weight="600" class="font">服务器价格参考</text>
  
  <!-- 价格对比卡片 -->
  <rect x="20" y="460" width="170" height="115" rx="16" class="card"/>
  <text x="36" y="487" font-size="13" fill="#6E6E73" class="font">GB200 NVL72</text>
  <text x="36" y="520" font-size="16" fill="#1D1D1F" font-weight="700" class="font">$280-340万</text>
  <text x="36" y="545" font-size="11" fill="#8E8E93" class="font">Blackwell架构机架</text>
  
  <rect x="200" y="460" width="170" height="115" rx="16" class="card"/>
  <text x="216" y="487" font-size="13" fill="#6E6E73" class="font">Vera Rubin</text>
  <text x="216" y="520" font-size="16" fill="#FF3B30" font-weight="700" class="font">$500-700万</text>
  <text x="216" y="545" font-size="11" fill="#8E8E93" class="font">NVL72 VR200</text>
  
  <!-- 消费市场条 -->
  <rect x="20" y="590" width="350" height="65" rx="16" class="card"/>
  <text x="40" y="612" font-size="12" fill="#8E8E93" class="font">消费市场先例 · RTX 5080</text>
  <text x="40" y="638" font-size="14" fill="#1D1D1F" font-weight="600" class="font">¥8,000→¥12,000</text>
  <text x="230" y="638" font-size="13" fill="#FF9500" font-weight="600" class="font">1个月涨50%</text>
  
  <!-- 财务关注 -->
  <rect x="20" y="672" width="350" height="125" rx="18" class="card"/>
  <rect x="40" y="692" width="88" height="22" rx="11" fill="#E8F0FF"/>
  <text x="84" y="708" font-size="12" fill="#0071E3" text-anchor="middle" font-weight="600" class="font">市场关注</text>
  <text x="40" y="742" font-size="17" fill="#1D1D1F" font-weight="600" class="font">存储涨价会否侵蚀</text>
  <text x="40" y="767" font-size="17" fill="#1D1D1F" font-weight="600" class="font">英伟达利润率？</text>
  <text x="40" y="790" font-size="12" fill="#8E8E93" class="font">毛利率75%左右 · 下周三发布财报</text>
  
  <!-- 底部 -->
  <line x1="24" y1="806" x2="366" y2="806" stroke="#EAE7E3" stroke-width="1"/>
  <text x="24" y="822" font-size="11" fill="#B0B0B5" class="font">数据来源：财联社</text>
  <text x="366" y="822" font-size="11" fill="#B0B0B5" text-anchor="end" class="font">8月23日讯</text>
</svg>