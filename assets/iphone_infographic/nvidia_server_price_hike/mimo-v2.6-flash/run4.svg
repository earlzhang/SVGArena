<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <style>text{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif}</style>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F0F7FF"/>
  <circle cx="370" cy="35" r="72" fill="#3B82F6" opacity="0.04"/>
  <circle cx="22" cy="818" r="55" fill="#3B82F6" opacity="0.03"/>

  <!-- ======== 头部 ======== -->
  <path d="M0 0H390V94Q390 106 378 106H12Q0 106 0 94Z" fill="url(#hdr)"/>
  <rect x="16" y="13" width="120" height="24" rx="12" fill="rgba(255,255,255,0.18)"/>
  <text x="76" y="29" text-anchor="middle" fill="#BFDBFE" font-size="11">财联社 8月23日 · 电子</text>
  <text x="195" y="64" text-anchor="middle" fill="white" font-size="24" font-weight="700">英伟达服务器涨价</text>
  <text x="195" y="91" text-anchor="middle" fill="#BFDBFE" font-size="13">涨幅"很多情况下超过15%"</text>

  <!-- ======== 核心数据卡 ======== -->
  <rect x="16" y="118" width="358" height="124" rx="14" fill="white" filter="url(#sh)" stroke="#E2E8F0" stroke-width="0.5"/>
  <rect x="16" y="118" width="5" height="124" rx="2.5" fill="#3B82F6"/>
  <text x="42" y="178" fill="#2563EB" font-size="48" font-weight="800">&gt;15%</text>
  <text x="44" y="204" fill="#64748B" font-size="13">涨价幅度</text>
  <text x="190" y="154" fill="#334155" font-size="13" font-weight="600">AI服务器普遍提价</text>
  <text x="190" y="175" fill="#94A3B8" font-size="11">搭载Vera Rubin、Grace Blackwell</text>
  <text x="190" y="193" fill="#94A3B8" font-size="11">等芯片的服务器明年初起调价</text>
  <circle cx="352" cy="148" r="16" fill="#DBEAFE"/>
  <path d="M352 139v18M345 146l7-7 7 7" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ======== 核心要点卡 ======== -->
  <rect x="16" y="254" width="358" height="154" rx="14" fill="white" filter="url(#sh)" stroke="#E2E8F0" stroke-width="0.5"/>
  <circle cx="36" cy="280" r="4" fill="#3B82F6"/>
  <text x="48" y="285" fill="#1E293B" font-size="14" font-weight="700">核心要点</text>
  <line x1="36" y1="294" x2="354" y2="294" stroke="#F1F5F9" stroke-width="1"/>

  <!-- 要点1 -->
  <circle cx="45" cy="318" r="11" fill="#DBEAFE"/>
  <text x="45" y="322" text-anchor="middle" fill="#2563EB" font-size="10" font-weight="700">1</text>
  <text x="65" y="316" fill="#475569" font-size="11" font-weight="600">时间</text>
  <text x="65" y="333" fill="#1E293B" font-size="13">明年年初出货的系统将统一提价</text>

  <!-- 要点2 -->
  <circle cx="45" cy="354" r="11" fill="#DCFCE7"/>
  <text x="45" y="358" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">2</text>
  <text x="65" y="352" fill="#475569" font-size="11" font-weight="600">原因</text>
  <text x="65" y="369" fill="#1E293B" font-size="13">内存芯片(DRAM)成本大幅飙升</text>

  <!-- 要点3 -->
  <circle cx="45" cy="390" r="11" fill="#FEF3C7"/>
  <text x="45" y="394" text-anchor="middle" fill="#D97706" font-size="10" font-weight="700">3</text>
  <text x="65" y="388" fill="#475569" font-size="11" font-weight="600">关注</text>
  <text x="65" y="404" fill="#1E293B" font-size="13">下周三财报，毛利率能否守住75%</text>

  <!-- ======== 价格一览卡 ======== -->
  <rect x="16" y="420" width="358" height="176" rx="14" fill="white" filter="url(#sh)" stroke="#E2E8F0" stroke-width="0.5"/>
  <circle cx="36" cy="446" r="4" fill="#3B82F6"/>
  <text x="48" y="451" fill="#1E293B" font-size="14" font-weight="700">价格一览</text>
  <line x1="36" y1="460" x2="354" y2="460" stroke="#F1F5F9" stroke-width="1"/>

  <!-- VR200 -->
  <rect x="36" y="472" width="318" height="34" rx="8" fill="#FEF2F2"/>
  <text x="50" y="494" fill="#1E293B" font-size="12" font-weight="500">Vera Rubin VR200 系统</text>
  <text x="340" y="494" text-anchor="end" fill="#DC2626" font-size="13" font-weight="700">$500-700万/台</text>

  <!-- GB200 -->
  <rect x="36" y="512" width="318" height="34" rx="8" fill="#FFF7ED"/>
  <text x="50" y="534" fill="#1E293B" font-size="12" font-weight="500">Blackwell GB200 机架</text>
  <text x="340" y="534" text-anchor="end" fill="#EA580C" font-size="13" font-weight="700">$280-340万/台</text>

  <!-- RTX 5080 -->
  <rect x="36" y="552" width="318" height="34" rx="8" fill="#EFF6FF"/>
  <text x="50" y="574" fill="#1E293B" font-size="12" font-weight="500">RTX 5080 显卡</text>
  <text x="340" y="574" text-anchor="end" fill="#2563EB" font-size="13" font-weight="700">¥8,000 → ¥12,000</text>

  <!-- ======== 市场与行业影响卡 ======== -->
  <rect x="16" y="608" width="358" height="182" rx="14" fill="white" filter="url(#sh)" stroke="#E2E8F0" stroke-width="0.5"/>
  <circle cx="36" cy="634" r="4" fill="#3B82F6"/>
  <text x="48" y="639" fill="#1E293B" font-size="14" font-weight="700">市场与行业影响</text>
  <line x1="36" y1="648" x2="354" y2="648" stroke="#F1F5F9" stroke-width="1"/>

  <!-- 75%毛利率 -->
  <rect x="36" y="660" width="92" height="52" rx="10" fill="#ECFDF5"/>
  <text x="82" y="690" text-anchor="middle" fill="#059669" font-size="24" font-weight="800">75%</text>
  <text x="82" y="706" text-anchor="middle" fill="#6B7280" font-size="10">当前毛利率</text>

  <!-- 财报信息 -->
  <text x="146" y="680" fill="#334155" font-size="12" font-weight="600">下周三美股盘后发布财报</text>
  <text x="146" y="700" fill="#94A3B8" font-size="11">上期60.5%，本季预期74.9-75%</text>

  <!-- 行业影响1 -->
  <circle cx="42" cy="736" r="3.5" fill="#DC2626"/>
  <text x="54" y="740" fill="#475569" font-size="11.5">苹果、高通等因芯片短缺被迫提价</text>

  <!-- 行业影响2 -->
  <circle cx="42" cy="760" r="3.5" fill="#D97706"/>
  <text x="54" y="764" fill="#475569" font-size="11.5">DRAM容量决定AI芯片性能，内存价格大涨</text>

  <!-- 行业影响3 -->
  <circle cx="42" cy="782" r="3.5" fill="#2563EB"/>
  <text x="54" y="786" fill="#475569" font-size="11.5">大客户自研芯片，但英伟达软件护城河仍深</text>

  <!-- ======== 底部 ======== -->
  <line x1="40" y1="806" x2="350" y2="806" stroke="#E2E8F0" stroke-width="1"/>
  <text x="195" y="824" text-anchor="middle" fill="#94A3B8" font-size="10">财联社 8月23日讯（编辑 史正丞）· 北京时间周日凌晨</text>
  <text x="195" y="840" text-anchor="middle" fill="#CBD5E1" font-size="9">英伟达芯片是AI训练关键零部件 · 算力争抢推高DRAM价格</text>
</svg>