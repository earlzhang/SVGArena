<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="1" stdDeviation="5" flood-color="#A8BCD0" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gBl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/><stop offset="100%" stop-color="#74BBF0"/>
    </linearGradient>
    <linearGradient id="gOr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6A23C"/><stop offset="100%" stop-color="#FFD180"/>
    </linearGradient>
    <linearGradient id="gHd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEAF7"/><stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <linearGradient id="gAc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/><stop offset="100%" stop-color="#5BC0BE"/>
    </linearGradient>
    <linearGradient id="gGr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67C23A"/><stop offset="100%" stop-color="#A8E6A0"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="390" height="844" fill="#F0F4F8"/>

  <!-- Header gradient -->
  <rect width="390" height="142" fill="url(#gHd)"/>

  <!-- Source badge -->
  <rect x="20" y="16" width="124" height="24" rx="12" fill="#4A90D9" opacity="0.13"/>
  <text x="82" y="33" font-size="11" fill="#4A90D9" text-anchor="middle" font-weight="500">财联社 · 8月23日讯</text>
  <text x="370" y="33" font-size="10" fill="#A0A8B0" text-anchor="end">编辑 史正丞</text>

  <!-- Title -->
  <text x="24" y="68" font-size="19.5" font-weight="700" fill="#1C1C2E">英伟达服务器传出涨价消息</text>
  <text x="24" y="97" font-size="19.5" font-weight="700" fill="#4A90D9">涨幅「很多情况下超过15%」</text>

  <!-- Accent bar -->
  <rect x="24" y="110" width="44" height="3" rx="1.5" fill="url(#gAc)"/>

  <!-- Subtitle -->
  <text x="24" y="130" font-size="11" fill="#7A8FA0">北京时间周日凌晨 · 涨价的风终于吹到搭载英伟达芯片的服务器</text>

  <!-- ==================== 3 KEY STATS ==================== -->

  <!-- Stat 1: 15%+ -->
  <rect x="16" y="154" width="114" height="78" rx="14" fill="#FFF" filter="url(#sh)"/>
  <rect x="56" y="162" width="34" height="3" rx="1.5" fill="#4A90D9"/>
  <text x="73" y="194" font-size="30" font-weight="800" fill="#4A90D9" text-anchor="middle">15%+</text>
  <text x="73" y="214" font-size="11" fill="#888" text-anchor="middle">服务器涨幅</text>
  <text x="73" y="226" font-size="9" fill="#BCC0C4" text-anchor="middle">2025年初生效</text>

  <!-- Stat 2: 75% -->
  <rect x="138" y="154" width="114" height="78" rx="14" fill="#FFF" filter="url(#sh)"/>
  <rect x="178" y="162" width="34" height="3" rx="1.5" fill="#67C23A"/>
  <text x="195" y="194" font-size="30" font-weight="800" fill="#67C23A" text-anchor="middle">75%</text>
  <text x="195" y="214" font-size="11" fill="#888" text-anchor="middle">最新毛利率</text>
  <text x="195" y="226" font-size="9" fill="#BCC0C4" text-anchor="middle">上财年同期60.5%</text>

  <!-- Stat 3: $500-700万 -->
  <rect x="260" y="154" width="114" height="78" rx="14" fill="#FFF" filter="url(#sh)"/>
  <rect x="300" y="162" width="34" height="3" rx="1.5" fill="#E6A23C"/>
  <text x="317" y="192" font-size="16" font-weight="800" fill="#E6A23C" text-anchor="middle">$500-700万</text>
  <text x="317" y="214" font-size="11" fill="#888" text-anchor="middle">VR200单台价</text>
  <text x="317" y="226" font-size="9" fill="#BCC0C4" text-anchor="middle">出货前询价</text>

  <!-- ==================== POINT ① ==================== -->
  <rect x="16" y="246" width="358" height="74" rx="14" fill="#FFF" filter="url(#sh)"/>
  <circle cx="46" cy="272" r="14" fill="#E8F0FE"/>
  <text x="46" y="277" font-size="14" font-weight="700" fill="#4A90D9" text-anchor="middle">①</text>
  <text x="70" y="268" font-size="13.5" font-weight="600" fill="#333">内存成本飙升 → 服务器普遍提价</text>
  <text x="70" y="289" font-size="11.5" fill="#666">搭载 Vera Rubin、Grace Blackwell 等芯片的</text>
  <text x="70" y="305" font-size="11.5" fill="#666">服务器明年初起将普遍提价，部分涨幅将超过15%</text>

  <!-- ==================== POINT ② ==================== -->
  <rect x="16" y="332" width="358" height="74" rx="14" fill="#FFF" filter="url(#sh)"/>
  <circle cx="46" cy="358" r="14" fill="#FDF3E2"/>
  <text x="46" y="363" font-size="14" font-weight="700" fill="#E6A23C" text-anchor="middle">②</text>
  <text x="70" y="354" font-size="13.5" font-weight="600" fill="#333">下周财报 → 关注利润率变化</text>
  <text x="70" y="375" font-size="11.5" fill="#666">英伟达将于下周三美股盘后发布最新财报，</text>
  <text x="70" y="391" font-size="11.5" fill="#666">市场关注存储涨价是否会侵蚀算力龙头利润率</text>

  <!-- ==================== PRICE COMPARISON ==================== -->
  <rect x="16" y="420" width="358" height="178" rx="14" fill="#FFF" filter="url(#sh)"/>

  <!-- Section title -->
  <rect x="32" y="436" width="4" height="16" rx="2" fill="#4A90D9"/>
  <text x="44" y="449" font-size="13.5" font-weight="600" fill="#333">关键价格一览</text>

  <!-- RTX 5080 label -->
  <text x="32" y="472" font-size="11" fill="#888">RTX 5080 显卡（1个月内涨幅）</text>

  <!-- Bar 1 (¥8,000) -->
  <rect x="32" y="480" width="140" height="15" rx="7.5" fill="url(#gBl)"/>
  <text x="178" y="492" font-size="10.5" fill="#4A90D9" font-weight="600">¥8,000</text>

  <!-- Bar 2 (¥12,000) -->
  <rect x="32" y="500" width="210" height="15" rx="7.5" fill="url(#gOr)"/>
  <text x="248" y="512" font-size="10.5" fill="#E6A23C" font-weight="600">¥12,000</text>

  <!-- +50% badge -->
  <rect x="292" y="486" width="66" height="28" rx="14" fill="#FFF0E0"/>
  <text x="325" y="505" font-size="14" font-weight="800" fill="#E6A23C" text-anchor="middle">+50%</text>

  <!-- Separator -->
  <line x1="32" y1="530" x2="358" y2="530" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Server prices label -->
  <text x="32" y="552" font-size="11" fill="#888">AI 服务器单台售价</text>

  <!-- GB200 row -->
  <rect x="32" y="564" width="9" height="9" rx="4.5" fill="#4A90D9"/>
  <text x="50" y="573" font-size="11.5" fill="#555">GB200 NVL72</text>
  <text x="358" y="573" font-size="12.5" font-weight="700" fill="#4A90D9" text-anchor="end">$280-340万</text>

  <!-- VR200 row -->
  <rect x="32" y="582" width="9" height="9" rx="4.5" fill="#E6A23C"/>
  <text x="50" y="591" font-size="11.5" fill="#555">VR200 NVL72</text>
  <text x="358" y="591" font-size="12.5" font-weight="700" fill="#E6A23C" text-anchor="end">$500-700万</text>

  <!-- ==================== IMPACT & TREND ==================== -->
  <rect x="16" y="612" width="358" height="170" rx="14" fill="#FFF" filter="url(#sh)"/>

  <!-- Section title 1 -->
  <rect x="32" y="628" width="4" height="16" rx="2" fill="#E6A23C"/>
  <text x="44" y="641" font-size="13.5" font-weight="600" fill="#333">行业影响与趋势</text>

  <!-- DRAM point -->
  <circle cx="42" cy="662" r="3" fill="#E6A23C"/>
  <text x="54" y="666" font-size="11.5" fill="#555">DRAM 矛缺推动内存价格大幅飙升，</text>
  <text x="54" y="682" font-size="11.5" fill="#555">苹果、高通等因芯片短缺被迫提价</text>

  <!-- Self-developed chips -->
  <circle cx="42" cy="704" r="3" fill="#4A90D9"/>
  <text x="54" y="708" font-size="11.5" fill="#555">亚马逊、微软、谷歌、Meta 加速自研芯片，</text>
  <text x="54" y="724" font-size="11.5" fill="#555">但英伟达软件「护城河」仍构成强大壁垒</text>

  <!-- Separator -->
  <line x1="32" y1="740" x2="358" y2="740" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Section title 2 -->
  <rect x="32" y="752" width="4" height="16" rx="2" fill="#67C23A"/>
  <text x="44" y="765" font-size="13.5" font-weight="600" fill="#333">后续关注</text>

  <!-- Watchlist content -->
  <text x="44" y="778" font-size="11.5" fill="#666">下周三美股盘后 · 英伟达最新财报</text>

  <!-- ==================== FOOTER ==================== -->
  <!-- Background strip -->
  <rect x="0" y="796" width="390" height="48" fill="#E8EDF2"/>
  <text x="195" y="820" font-size="11" fill="#8899AA" text-anchor="middle" font-weight="500">本财年第二财季毛利率预期：74.9% ~ 75%</text>
  <text x="195" y="836" font-size="9.5" fill="#AABBCC" text-anchor="middle">英伟达是训练和运行人工智能软件的关键芯片供应商</text>
</svg>