<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#fafbff"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6cf7"/>
      <stop offset="100%" stop-color="#6c8fff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a6cf7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4a6cf7" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSm" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#4a6cf7" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clipCard">
      <rect x="16" y="0" width="343" height="812" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="330" cy="50" r="80" fill="#4a6cf7" opacity="0.04"/>
  <circle cx="30" cy="700" r="60" fill="#a78bfa" opacity="0.05"/>
  <circle cx="350" cy="400" r="50" fill="#4a6cf7" opacity="0.03"/>

  <!-- Header -->
  <rect x="0" y="0" width="375" height="155" rx="0" fill="url(#headerGrad)"/>
  <rect x="0" y="145" width="375" height="20" fill="url(#headerGrad)" opacity="0.3"/>

  <!-- Header decorative -->
  <circle cx="340" cy="30" r="50" fill="#ffffff" opacity="0.06"/>
  <circle cx="40" cy="130" r="40" fill="#ffffff" opacity="0.05"/>

  <!-- Source badge -->
  <rect x="16" y="14" width="80" height="20" rx="10" fill="#ffffff" opacity="0.2"/>
  <text x="56" y="27.5" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9" fill="#ffffff" opacity="0.9">财联社 8.23</text>

  <!-- Title -->
  <text x="16" y="62" font-family="PingFang SC, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">英伟达服务器传出涨价消息</text>
  <text x="16" y="92" font-family="PingFang SC, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">涨幅<tspan fill="#ffeb3b">"很多情况下超过15%"</tspan></text>

  <!-- Subtitle line -->
  <text x="16" y="120" font-family="PingFang SC, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.75">编辑：史正丞 · 北京时间周日凌晨最新消息</text>

  <!-- ==================== SECTION 1: Key Stats ==================== -->
  <!-- Big stat card -->
  <rect x="16" y="175" width="343" height="95" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="16" y="175" width="5" height="95" rx="2.5" fill="url(#accentGrad)"/>

  <text x="35" y="197" font-family="PingFang SC, -apple-system, sans-serif" font-size="10" fill="#7c8db5" letter-spacing="1">核心数据</text>

  <!-- Big number -->
  <text x="35" y="238" font-family="PingFang SC, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#redGrad)">15%</text>
  <text x="132" y="238" font-family="PingFang SC, -apple-system, sans-serif" font-size="14" fill="#ef4444" font-weight="600">+</text>
  <text x="152" y="228" font-family="PingFang SC, -apple-system, sans-serif" font-size="13" fill="#475569">搭载英伟达AI芯片的服务器</text>
  <text x="152" y="250" font-family="PingFang SC, -apple-system, sans-serif" font-size="13" fill="#475569">明年年初起将普遍提价</text>

  <!-- Arrow icon -->
  <polygon points="330,210 345,235 315,235" fill="#ef4444" opacity="0.8"/>

  <!-- ==================== SECTION 2: Two Key Points ==================== -->
  <!-- Point 1 -->
  <rect x="16" y="285" width="343" height="78" rx="14" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="16" y="285" width="5" height="78" rx="2.5" fill="#4a6cf7"/>

  <!-- Icon circle 1 -->
  <circle cx="48" cy="324" r="16" fill="#4a6cf7" opacity="0.12"/>
  <text x="48" y="329" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4a6cf7">①</text>

  <text x="75" y="311" font-family="PingFang SC, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">涨价原因与时间</text>
  <text x="75" y="332" font-family="PingFang SC, -apple-system, sans-serif" font-size="11.5" fill="#64748b">内存芯片成本飙升，Vera Rubin、Grace Blackwell</text>
  <text x="75" y="350" font-family="PingFang SC, -apple-system, sans-serif" font-size="11.5" fill="#64748b">等芯片服务器 <tspan font-weight="700" fill="#ef4444">明年初起普遍提价</tspan></text>

  <!-- Point 2 -->
  <rect x="16" y="375" width="343" height="78" rx="14" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="16" y="375" width="5" height="78" rx="2.5" fill="#a78bfa"/>

  <!-- Icon circle 2 -->
  <circle cx="48" cy="414" r="16" fill="#a78bfa" opacity="0.15"/>
  <text x="48" y="419" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7c3aed">②</text>

  <text x="75" y="401" font-family="PingFang SC, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">财报与利润率关注</text>
  <text x="75" y="422" font-family="PingFang SC, -apple-system, sans-serif" font-size="11.5" fill="#64748b">下周三盘后发布财报，市场关注存储涨价</text>
  <text x="75" y="440" font-family="PingFang SC, -apple-system, sans-serif" font-size="11.5" fill="#64748b">是否会侵蚀 <tspan font-weight="700" fill="#7c3aed">算力龙头利润率</tspan></text>

  <!-- ==================== SECTION 3: Price Comparison ==================== -->
  <text x="16" y="483" font-family="PingFang SC, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">🖥️ AI服务器价格参考</text>
  <line x1="16" y1="491" x2="130" y2="491" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Price card 1 -->
  <rect x="16" y="500" width="166" height="75" rx="12" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="16" y="500" width="166" height="4" rx="2" fill="#4a6cf7"/>
  <text x="100" y="522" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9.5" fill="#7c8db5">Blackwell GB200 NVL72</text>
  <text x="100" y="553" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#4a6cf7">280-340<tspan font-size="11">万</tspan></text>
  <text x="100" y="568" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9" fill="#94a3b8">美元 / 台</text>

  <!-- Price card 2 -->
  <rect x="193" y="500" width="166" height="75" rx="12" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="193" y="500" width="166" height="4" rx="2" fill="#ef4444"/>
  <text x="276" y="522" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9.5" fill="#7c8db5">Vera Rubin NVL72 VR200</text>
  <text x="276" y="553" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#ef4444">500-700<tspan font-size="11">万</tspan></text>
  <text x="276" y="568" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9" fill="#94a3b8">美元 / 台</text>

  <!-- ==================== SECTION 4: Key Metrics ==================== -->
  <text x="16" y="610" font-family="PingFang SC, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">📊 关键指标</text>
  <line x1="16" y1="618" x2="98" y2="618" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Metric boxes -->
  <rect x="16" y="628" width="108" height="62" rx="12" fill="#ffffff" filter="url(#shadowSm)"/>
  <text x="70" y="649" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9.5" fill="#7c8db5">毛利率</text>
  <text x="70" y="675" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#10b981">~75%</text>

  <rect x="134" y="628" width="108" height="62" rx="12" fill="#ffffff" filter="url(#shadowSm)"/>
  <text x="188" y="649" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9.5" fill="#7c8db5">RTX 5080 涨幅</text>
  <text x="188" y="675" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ef4444">50%</text>
  <text x="188" y="686" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="8" fill="#94a3b8">8000→12000元/月</text>

  <rect x="252" y="628" width="107" height="62" rx="12" fill="#ffffff" filter="url(#shadowSm)"/>
  <text x="306" y="649" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="9.5" fill="#7c8db5">15%额外开销</text>
  <text x="306" y="675" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#7c3aed">≈百万</text>
  <text x="306" y="686" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="8" fill="#94a3b8">美元/台</text>

  <!-- ==================== SECTION 5: Market Impact ==================== -->
  <rect x="16" y="704" width="343" height="72" rx="14" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="16" y="704" width="343" height="72" rx="14" fill="#f8f9ff"/>

  <text x="32" y="726" font-family="PingFang SC, -apple-system, sans-serif" font-size="10" fill="#7c8db5" letter-spacing="1">💡 市场影响</text>

  <text x="32" y="748" font-family="PingFang SC, -apple-system, sans-serif" font-size="11.5" fill="#475569">云巨头加速自研芯片：亚马逊、微软、谷歌、Meta推进内部研发</text>
  <text x="32" y="767" font-family="PingFang SC, -apple-system, sans-serif" font-size="11.5" fill="#475569">但英伟达软件<tspan font-weight="700" fill="#4a6cf7">"护城河"</tspan>使多数数据中心仍依赖其芯片</text>

  <!-- Footer -->
  <line x1="16" y1="792" x2="359" y2="792" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="188" y="807" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">财联社8月23日讯 · 编辑：史正丞 · 信息图可视化</text>
</svg>