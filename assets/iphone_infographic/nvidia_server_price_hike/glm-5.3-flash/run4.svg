<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Heiti SC, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F6EF"/>
      <stop offset="0.55" stop-color="#F7FAF6"/>
      <stop offset="1" stop-color="#FDFEFD"/>
    </linearGradient>
    <linearGradient id="greenV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9BD143"/>
      <stop offset="1" stop-color="#4E8B12"/>
    </linearGradient>
    <linearGradient id="barO" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A24B"/>
      <stop offset="1" stop-color="#DE5420"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3A5A40" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="url(#bgG)"/>
  <circle cx="362" cy="-24" r="92" fill="#DFF0CE" opacity="0.5"/>

  <!-- 头部 -->
  <rect x="22" y="24" width="112" height="24" rx="12" fill="#E7F1DC"/>
  <text x="78" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#43701A" letter-spacing="1">财联社 · 08·23</text>

  <text x="24" y="82" font-size="20.5" font-weight="700" fill="#182830">英伟达服务器<tspan fill="#3F7D10">传出涨价消息</tspan></text>
  <text x="24" y="105" font-size="11.5" fill="#6B7A83">电子产品“涨价的风”，吹向 AI 算力核心</text>

  <!-- 右上角上涨小图表装饰 -->
  <g stroke="#7CB83B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M314 88 L334 72 L342 76 L354 62"/>
    <path d="M354 62 L345 62"/><path d="M354 62 L354 71"/>
  </g>
  <rect x="318" y="86" width="8" height="14" rx="2" fill="#CFE3C2"/>
  <rect x="330" y="76" width="8" height="24" rx="2" fill="#B7D49E"/>
  <rect x="342" y="66" width="8" height="34" rx="2" fill="#9BC47E"/>

  <!-- 卡片1：核心数字 -->
  <rect x="20" y="124" width="350" height="108" rx="16" fill="#FFFFFF" filter="url(#ds)"/>
  <text x="40" y="150" font-size="10.5" fill="#8795A1">服务器整机最大涨幅</text>
  <text x="38" y="198" font-size="42" font-weight="800" fill="#3F7D10">15%+</text>
  <text x="40" y="216" font-size="9.5" fill="#55913C">部分系统将进一步上浮</text>
  <line x1="168" y1="140" x2="168" y2="216" stroke="#EDF1EB" stroke-width="1.5"/>
  <text x="182" y="152" font-size="10.5" fill="#8795A1">新一代平台 · 明年初起适用</text>
  <text x="182" y="177" font-size="13" font-weight="700" fill="#22303A">Vera Rubin</text>
  <text x="182" y="195" font-size="13" font-weight="700" fill="#22303A">Grace Blackwell</text>
  <text x="182" y="213" font-size="10" fill="#8795A1">涨幅取决于芯片与内存配置</text>
  <path d="M332 156 L344 144" stroke="#7CB83B" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M344 152 L344 144 L336 144" stroke="#7CB83B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 卡片2：涨价传导链 -->
  <rect x="20" y="244" width="350" height="82" rx="16" fill="#FFFFFF" filter="url(#ds)"/>
  <text x="36" y="262" font-size="10" font-weight="600" fill="#6F8757" letter-spacing="1">涨价传导链</text>
  <rect x="30" y="272" width="94" height="36" rx="8" fill="#FDF0EA"/>
  <text x="77" y="287" text-anchor="middle" font-size="10.5" font-weight="700" fill="#BF4A24">DRAM 内存</text>
  <text x="77" y="301" text-anchor="middle" font-size="9.5" fill="#C97F5C">成本大幅飙升</text>
  <line x1="126" y1="290" x2="139" y2="290" stroke="#B9C4BB" stroke-width="1.6"/>
  <path d="M139 285.5 L147 290 L139 294.5 Z" fill="#B9C4BB"/>
  <rect x="148" y="272" width="94" height="36" rx="8" fill="#3F7A10"/>
  <text x="195" y="287" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">AI 服务器</text>
  <text x="195" y="301" text-anchor="middle" font-size="9.5" fill="#DCF2C4">报价普涨超 15%</text>
  <line x1="244" y1="290" x2="257" y2="290" stroke="#B9C4BB" stroke-width="1.6"/>
  <path d="M257 285.5 L265 290 L257 294.5 Z" fill="#B9C4BB"/>
  <rect x="266" y="272" width="92" height="36" rx="8" fill="#F0F5F0"/>
  <text x="312" y="287" text-anchor="middle" font-size="10.5" font-weight="700" fill="#47584F">大型云厂商</text>
  <text x="312" y="301" text-anchor="middle" font-size="9.2" fill="#6E7F76">微软·谷歌·甲骨文</text>

  <!-- 卡片3：价格对比 -->
  <rect x="20" y="338" width="350" height="152" rx="16" fill="#FFFFFF" filter="url(#ds)"/>
  <text x="36" y="358" font-size="12" font-weight="700" fill="#22303A">单套系统售价（美元）</text>
  <text x="354" y="358" text-anchor="end" font-size="9.5" fill="#9AA7AD">媒体援引知情人士</text>

  <text x="36" y="380" font-size="11.5" font-weight="700" fill="#22303A">GB200<tspan font-weight="400" font-size="9.5" fill="#8795A1" dx="5">Blackwell 架构</tspan></text>
  <text x="354" y="380" text-anchor="end" font-size="11.5" font-weight="700" fill="#2A3A42">$280万–340万</text>
  <rect x="36" y="388" width="160" height="8" rx="4" fill="#EFF3EE"/>
  <rect x="36" y="388" width="78" height="8" rx="4" fill="#B7CBAF"/>

  <text x="36" y="416" font-size="11.5" font-weight="700" fill="#22303A">VR200<tspan font-weight="400" font-size="9.5" fill="#8795A1" dx="5">Vera Rubin · 明年出货</tspan></text>
  <text x="354" y="416" text-anchor="end" font-size="11.5" font-weight="700" fill="#D96C2E">$500万–700万</text>
  <rect x="36" y="424" width="160" height="8" rx="4" fill="#FBEADF"/>
  <rect x="36" y="424" width="160" height="8" rx="4" fill="url(#barO)"/>

  <line x1="36" y1="446" x2="354" y2="446" stroke="#E7ECE6" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="36" y="454" width="52" height="17" rx="8.5" fill="#FDF0EA"/>
  <text x="62" y="466" text-anchor="middle" font-size="9.5" font-weight="600" fill="#D96C2E">消费级</text>
  <text x="96" y="466" font-size="11">
    <tspan font-weight="700" fill="#22303A">RTX 5080 </tspan>
    <tspan font-weight="700" fill="#22303A">¥8,000</tspan>
    <tspan fill="#9AA7AD"> → </tspan>
    <tspan font-weight="700" fill="#D9542B">¥12,000</tspan>
    <tspan font-size="9.5" fill="#8795A1" dx="4">一个月 +50%</tspan>
  </text>

  <!-- 卡片4：利润率与财报 -->
  <rect x="20" y="504" width="350" height="96" rx="16" fill="#FFFFFF" filter="url(#ds)"/>
  <circle cx="58" cy="552" r="26" fill="none" stroke="#E7ECE6" stroke-width="9"/>
  <circle cx="58" cy="552" r="26" fill="none" stroke="url(#greenV)" stroke-width="9" stroke-linecap="round" stroke-dasharray="122.5 164" transform="rotate(-90 58 552)"/>
  <text x="58" y="550" text-anchor="middle" font-size="15" font-weight="800" fill="#2E5710">75%</text>
  <text x="58" y="565" text-anchor="middle" font-size="8.5" fill="#7B8890">毛利率</text>

  <text x="104" y="534" font-size="12.5" font-weight="700" fill="#22303A">关注点：存储涨价会否侵蚀利润率</text>
  <rect x="104" y="544" width="142" height="20" rx="10" fill="#EAF4DF"/>
  <text x="175" y="558" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3F7D10">财报发布｜下周三美股盘后</text>
  <text x="104" y="580" font-size="10">
    <tspan fill="#8795A1">本季指引 </tspan><tspan font-weight="700" fill="#3F7D10">74.9–75%</tspan>
    <tspan fill="#8795A1" dx="8">去年同期 </tspan><tspan font-weight="700" fill="#46555E">60.5%</tspan>
  </text>

  <!-- 连环影响 -->
  <text x="22" y="612" font-size="10" font-weight="600" fill="#8AA07B" letter-spacing="1">连环影响</text>

  <rect x="20" y="618" width="350" height="42" rx="12" fill="#FFFFFF" filter="url(#ds)"/>
  <circle cx="40" cy="639" r="10" fill="#FDF0EA"/>
  <text x="40" y="643" text-anchor="middle" font-size="11" font-weight="800" fill="#D96C2E">1</text>
  <text x="58" y="636" font-size="11.5" font-weight="700" fill="#22303A">存储厂商话语权跃升</text>
  <text x="58" y="651" font-size="9.5" fill="#6B7A83">三星、SK海力士、美光强势议价，苹果、高通等被迫跟涨</text>

  <rect x="20" y="668" width="350" height="42" rx="12" fill="#FFFFFF" filter="url(#ds)"/>
  <circle cx="40" cy="689" r="10" fill="#EAF4DF"/>
  <text x="40" y="693" text-anchor="middle" font-size="11" font-weight="800" fill="#4A7D14">2</text>
  <text x="58" y="686" font-size="11.5" font-weight="700" fill="#22303A">云巨头自研芯片提速</text>
  <text x="58" y="701" font-size="9.5" fill="#6B7A83">亚马逊、微软、谷歌、Meta 加码自研，但仍难破英伟达软件生态</text>

  <rect x="20" y="718" width="350" height="42" rx="12" fill="#FFFFFF" filter="url(#ds)"/>
  <circle cx="40" cy="739" r="10" fill="#EEE9FB"/>
  <text x="40" y="743" text-anchor="middle" font-size="11" font-weight="800" fill="#6A57C7">3</text>
  <text x="58" y="736" font-size="11.5" font-weight="700" fill="#22303A">挑战者的机会窗口</text>
  <text x="58" y="751" font-size="9.5" fill="#6B7A83">胜负手在于能否锁定三大存储厂的 DRAM 供应</text>

  <!-- 页脚 -->
  <line x1="30" y1="774" x2="360" y2="774" stroke="#E3E9E2" stroke-width="1"/>
  <text x="195" y="790" text-anchor="middle" font-size="9" fill="#97A4AB">资料来源：财联社 · 2025年8月23日｜编辑 史正丞</text>
</svg>