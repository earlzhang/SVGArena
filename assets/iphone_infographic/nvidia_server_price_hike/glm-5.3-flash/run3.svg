<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <!-- 背景 -->
  <rect width="390" height="844" fill="#F7F4EC"/>

  <!-- ===== 报头 ===== -->
  <rect x="24" y="30" width="342" height="3" fill="#1A1B17"/>
  <rect x="24" y="38" width="342" height="1" fill="#1A1B17" opacity=".18"/>
  <text x="24" y="56" font-size="10" letter-spacing="2" fill="#75786E">半导体 ／ AI 算力 · 08.23</text>

  <!-- 涨幅徽章 -->
  <g transform="rotate(-8 326 87)">
    <circle cx="326" cy="87" r="43" fill="#FFFDF7" stroke="#76B900" stroke-width="3.5"/>
    <circle cx="326" cy="87" r="35.5" fill="none" stroke="#1A1B17" stroke-width=".7" stroke-dasharray="2.5 3" opacity=".45"/>
    <text x="326" y="73" text-anchor="middle" font-size="8.5" letter-spacing="2" fill="#75786E">涨幅预告</text>
    <text x="326" y="96" text-anchor="middle" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="800" font-size="25" fill="#1A1B17">+15%</text>
    <text x="326" y="112" text-anchor="middle" font-size="8.5" letter-spacing="1" fill="#75786E">或更高</text>
  </g>

  <!-- ===== 主标题 ===== -->
  <text x="24" y="97" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="30" letter-spacing="1" fill="#1A1B17">英伟达服务器</text>
  <text x="24" y="134" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="30" letter-spacing="1" fill="#1A1B17">传出涨价消息</text>

  <!-- 导语 · 划重点 -->
  <text x="24" y="166" font-size="11.5" fill="#75786E">很多情况下</text>
  <text x="90" y="166" font-size="13" font-weight="600" fill="#1A1B17">涨幅将超过</text>
  <rect x="159" y="154" width="56" height="13.5" fill="#76B900"/>
  <text x="163" y="166" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="800" font-size="18.5" fill="#1A1B17">&gt;15%</text>

  <!-- ===== 因果链 ===== -->
  <g>
    <rect x="24" y="192" width="100" height="44" rx="2" fill="#FCFBF7" stroke="#1A1B17" stroke-width="1.2"/>
    <text x="74" y="209" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1A1B17">DRAM 内存</text>
    <text x="74" y="224" text-anchor="middle" font-size="10.5" fill="#75786E">成本大幅飙升</text>
    <path d="M127,213 H138" stroke="#1A1B17" stroke-width="1.6"/><path d="M137,207 L146,213 L137,219 Z" fill="#1A1B17"/>

    <rect x="145" y="192" width="100" height="44" rx="2" fill="#FCFBF7" stroke="#1A1B17" stroke-width="1.2"/>
    <text x="195" y="209" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1A1B17">AI 芯片性能</text>
    <text x="195" y="224" text-anchor="middle" font-size="10.5" fill="#75786E">取决于内存容量</text>
    <path d="M248,213 H259" stroke="#1A1B17" stroke-width="1.6"/><path d="M258,207 L267,213 L258,219 Z" fill="#1A1B17"/>

    <rect x="266" y="192" width="100" height="44" rx="2" fill="#76B900"/>
    <text x="316" y="209" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1A1B17">明年初出货起</text>
    <text x="316" y="224" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1A1B17">多数涨幅 &gt;15%</text>
  </g>

  <rect x="24" y="248" width="342" height="1" fill="#1A1B17" opacity=".18"/>

  <!-- ===== 机架报价 ===== -->
  <rect x="24" y="258" width="7" height="7" fill="#76B900"/>
  <text x="37" y="266" font-size="12" font-weight="700" fill="#1A1B17">先进 AI 机架 · 单台售价参照</text>

  <text x="24" y="288" font-size="9.5" fill="#75786E">GB200 NVL72 ｜ Blackwell · 年初报价</text>
  <text x="366" y="288" text-anchor="end" font-size="12.5" font-weight="600" fill="#1A1B17">280 – 340 万</text>
  <rect x="24" y="294" width="166" height="13" fill="#F4F1E6" stroke="#1A1B17" stroke-width="1.2"/>

  <text x="24" y="322" font-size="9.5" fill="#75786E">VR200 NVL72 ｜ Vera Rubin · 询价已达</text>
  <text x="366" y="322" text-anchor="end" font-size="12.5" font-weight="700" fill="#1A1B17">500 – 700 万</text>
  <rect x="24" y="328" width="342" height="13" fill="#76B900"/>

  <rect x="24" y="350" width="7" height="7" fill="#76B900"/>
  <text x="37" y="358" font-size="10.8" fill="#1A1B17" opacity=".82">哪怕只涨 15%，也是每台数十万乃至近百万美元的追加开支</text>

  <rect x="24" y="372" width="342" height="1" fill="#1A1B17" opacity=".18"/>

  <!-- ===== 消费端先例 ===== -->
  <rect x="24" y="382" width="7" height="7" fill="#76B900"/>
  <text x="37" y="390" font-size="12" font-weight="700" fill="#1A1B17">消费级同类剧情 · RTX 5080 显卡</text>

  <rect x="32" y="415" width="34" height="37" fill="#DEDACA"/>
  <rect x="74" y="396" width="34" height="56" fill="#76B900"/>
  <rect x="24" y="452" width="90" height="1" fill="#1A1B17" opacity=".35"/>
  <text x="49" y="409" text-anchor="middle" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="600" font-size="9.5" fill="#75786E">¥8,000</text>
  <text x="91" y="390" text-anchor="middle" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="700" font-size="9.5" fill="#1A1B17">¥12,000</text>
  <text x="49" y="465" text-anchor="middle" font-size="8.5" fill="#75786E">此前价位</text>
  <text x="91" y="465" text-anchor="middle" font-size="8.5" fill="#75786E">如今价位</text>

  <text x="132" y="406" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="800" font-size="17" fill="#1A1B17">RTX 5080</text>
  <text x="132" y="425" font-size="12" fill="#1A1B17">一个月内 ¥8,000 → ¥12,000</text>
  <rect x="132" y="437" width="52" height="19" rx="2" fill="#1A1B17"/>
  <text x="158" y="450.5" text-anchor="middle" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="700" font-size="11.5" fill="#F7F4EC">+50%</text>

  <rect x="24" y="482" width="342" height="1" fill="#1A1B17" opacity=".18"/>

  <!-- ===== 客户与反应 ===== -->
  <line x1="196" y1="496" x2="196" y2="548" stroke="#D9D5C8" stroke-width="1"/>
  <text x="24" y="508" font-size="9.5" letter-spacing="2" fill="#75786E">收到涨价通知</text>
  <text x="24" y="529" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="15.5" fill="#1A1B17">微软 · 谷歌 · 甲骨文</text>
  <text x="24" y="547" font-size="9.5" fill="#75786E">代工的服务器厂商近期已逐一告知</text>

  <text x="210" y="508" font-size="9.5" letter-spacing="2" fill="#75786E">大客户的下一步</text>
  <text x="210" y="529" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="15.5" fill="#1A1B17">转攻自研芯片</text>
  <text x="210" y="547" font-size="9.5" fill="#75786E">亚马逊 · Meta 等皆有内部项目</text>

  <rect x="24" y="562" width="342" height="1" fill="#1A1B17" opacity=".18"/>

  <!-- ===== 财报前瞻 ===== -->
  <rect x="24" y="574" width="166" height="21" fill="#1A1B17"/>
  <text x="107" y="588.5" text-anchor="middle" font-size="9.5" letter-spacing="1" fill="#F7F4EC">财报前瞻 ｜ 下周三 美股盘后</text>

  <text x="24" y="617" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="16" fill="#1A1B17">“存储狂潮”会否侵蚀 75% 的毛利率？</text>

  <text x="24" y="645" font-size="9.5" fill="#75786E">最近季度毛利率（截至 4/26）</text>
  <text x="366" y="645" text-anchor="end" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="700" font-size="13" fill="#1A1B17">75%</text>
  <rect x="24" y="651" width="225" height="12" fill="#76B900"/>
  <text x="255" y="661" font-size="8.5" fill="#75786E">下季指引 74.9–75%</text>

  <text x="24" y="677" font-size="9.5" fill="#75786E">上一财年同期</text>
  <text x="366" y="677" text-anchor="end" font-family="'Helvetica Neue','Helvetica',sans-serif" font-weight="600" font-size="13" fill="#1A1B17">60.5%</text>
  <rect x="24" y="683" width="182" height="12" fill="#DEDACA"/>

  <rect x="24" y="704" width="342" height="1" fill="#1A1B17" opacity=".18"/>

  <!-- ===== 结语 ===== -->
  <rect x="24" y="716" width="3" height="46" fill="#76B900"/>
  <text x="37" y="734" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="14.5" fill="#1A1B17">近乎疯狂的算力争抢之下，</text>
  <text x="37" y="754" font-family="'Songti SC','STSong',serif" font-weight="900" font-size="14.5" fill="#1A1B17">内存厂商握住了空前的行业话语权。</text>
  <text x="24" y="780" font-size="10.8" fill="#75786E">留给挑战者的变量：能否锁定三星 ／ SK海力士 ／ 美光的 DRAM 供给</text>

  <!-- 页脚 -->
  <rect x="24" y="794" width="342" height="1" fill="#1A1B17" opacity=".18"/>
  <text x="24" y="810" font-size="8.5" fill="#75786E">来源：财联社（编辑 史正丞）· 媒体援引知情人士及过往财报整理</text>
  <rect x="358" y="802" width="6" height="6" fill="#76B900"/>
</svg>