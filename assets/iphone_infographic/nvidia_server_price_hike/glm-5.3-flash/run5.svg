<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7E7FD"/>
      <stop offset="0.7" stop-color="#EDF3FC"/>
      <stop offset="1" stop-color="#F6F8FB"/>
    </linearGradient>
    <linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#D8330C"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0B1B33" flood-opacity="0.06"/>
    </filter>
    <style>
      text{font-family:'PingFang SC','Hiragino Sans GB',sans-serif}
      .w{font-weight:600}.b{font-weight:700}
    </style>
  </defs>

  <rect width="390" height="844" fill="#F6F8FB"/>

  <!-- ======== HEADER ======== -->
  <rect width="390" height="118" fill="url(#hg)"/>
  <circle cx="345" cy="-18" r="72" fill="#D3E5FD"/>
  <circle cx="392" cy="34" r="46" fill="#DEEBFE" opacity="0.9"/>
  <circle cx="303" cy="10" r="7" fill="#BBD4FA" opacity="0.6"/>

  <rect x="20" y="16" width="112" height="20" rx="10" fill="#E1ECFE" stroke="#C9DCFC"/>
  <text x="76" y="29.5" text-anchor="middle" font-size="9.5" fill="#2F66D8" class="w" letter-spacing="0.5">行业快讯 · 芯片</text>

  <text x="20" y="60" font-size="22" fill="#152238" class="b">英伟达服务器传出涨价消息</text>
  <text x="20" y="87" font-size="19" fill="#22314A" class="b">涨幅“很多情况下<tspan fill="#E14817">超过15%</tspan>”</text>
  <rect x="20" y="96" width="34" height="4" rx="2" fill="#2563EB"/>

  <!-- ======== HERO CARD ======== -->
  <g filter="url(#sh)">
    <rect x="16" y="112" width="358" height="104" rx="14" fill="#FFFFFF" stroke="#E4EAF2"/>
  </g>
  <line x1="146" y1="126" x2="146" y2="200" stroke="#EEF2F7"/>

  <text x="28" y="136" font-size="10" fill="#93A0B4">服务器报价 · 涨幅</text>
  <text x="26" y="182" font-size="46" fill="url(#gUp)" class="b">+15%</text>
  <text x="28" y="201" font-size="9" fill="#98A2B4">“很多情况下涨幅将超15%”</text>

  <rect x="158" y="127" width="6" height="6" rx="2" fill="#E14817"/>
  <text x="172" y="134" font-size="11" fill="#2A3648" class="w">驱动｜DRAM 内存成本飙升</text>
  <rect x="158" y="147" width="6" height="6" rx="2" fill="#2563EB"/>
  <text x="172" y="154" font-size="11" fill="#2A3648" class="w">范围｜明年初出货系统起</text>
  <text x="158" y="171" font-size="9.5" fill="#8D97A9">幅度｜视具体芯片与内存配置</text>

  <rect x="158" y="179" width="74" height="18" rx="9" fill="#EDF3FE" stroke="#CDDEFB"/>
  <text x="195" y="191" text-anchor="middle" font-size="9.5" fill="#2C61C8" class="w">Vera Rubin</text>
  <rect x="238" y="179" width="100" height="18" rx="9" fill="#EDF3FE" stroke="#CDDEFB"/>
  <text x="288" y="191" text-anchor="middle" font-size="9.5" fill="#2C61C8" class="w">Grace Blackwell</text>

  <!-- ======== SECTION A ======== -->
  <rect x="20" y="230" width="4" height="15" rx="2" fill="#E14817"/>
  <text x="32" y="243" font-size="13" fill="#1B2A40" class="b">价格速览｜终端全线涨</text>
  <line x1="180" y1="238" x2="374" y2="238" stroke="#E0E6EE" stroke-dasharray="4 4"/>

  <!-- Row 1 -->
  <g filter="url(#sh)"><rect x="16" y="254" width="358" height="58" rx="12" fill="#FFFFFF" stroke="#E6EBF3"/></g>
  <circle cx="44" cy="283" r="15" fill="#FFF0E9"/>
  <path d="M44 275 l8 12 h-5 v6 h-6 v-6 h-5 z" fill="#E14817"/>
  <text x="70" y="278" font-size="12" fill="#202A3B" class="b">RTX 5080 · 消费级显卡</text>
  <text x="70" y="297" font-size="9.5" fill="#8A93A5">次旗舰 · 刚经历一轮暴涨</text>
  <text x="360" y="279.5" text-anchor="end" font-size="13.5" fill="#202A3B" class="b">¥8,000 → ¥12,000</text>
  <text x="360" y="297" text-anchor="end" font-size="9.5" fill="#E14817" class="w">一个月内 ↑ +50%</text>

  <!-- Row 2 -->
  <g filter="url(#sh)"><rect x="16" y="322" width="358" height="58" rx="12" fill="#FFFFFF" stroke="#E6EBF3"/></g>
  <circle cx="44" cy="351" r="15" fill="#E9F2FF"/>
  <rect x="36.5" y="337" width="15" height="4.5" rx="2" fill="#2563EB"/>
  <rect x="36.5" y="344.5" width="15" height="4.5" rx="2" fill="#2563EB"/>
  <rect x="36.5" y="352" width="15" height="4.5" rx="2" fill="#2563EB"/>
  <circle cx="48.5" cy="339.2" r="1.2" fill="#FFFFFF"/>
  <circle cx="48.5" cy="346.7" r="1.2" fill="#FFFFFF"/>
  <circle cx="48.5" cy="354.2" r="1.2" fill="#FFFFFF"/>
  <text x="70" y="346" font-size="12" fill="#202A3B" class="b">GB200 NVL72 机架</text>
  <text x="70" y="365" font-size="9.5" fill="#8A93A5">基于 Grace Blackwell 组合</text>
  <text x="360" y="347.5" text-anchor="end" font-size="13" fill="#202A3B" class="b">$280万–$340万<tspan font-size="9" fill="#8A93A5"> /台</tspan></text>
  <text x="360" y="365" text-anchor="end" font-size="9.5" fill="#8A93A5">今年早些时候成交基准</text>

  <!-- Row 3 -->
  <g filter="url(#sh)"><rect x="16" y="390" width="358" height="58" rx="12" fill="#FFFFFF" stroke="#E6EBF3"/></g>
  <circle cx="44" cy="419" r="15" fill="#E6F7F2"/>
  <rect x="38.5" y="413.5" width="11" height="11" rx="2.5" fill="none" stroke="#0E9488" stroke-width="1.6"/>
  <g stroke="#0E9488" stroke-width="1.5" stroke-linecap="round">
    <line x1="41.5" y1="410.5" x2="41.5" y2="413"/><line x1="46.5" y1="410.5" x2="46.5" y2="413"/>
    <line x1="41.5" y1="425" x2="41.5" y2="427.5"/><line x1="46.5" y1="425" x2="46.5" y2="427.5"/>
    <line x1="35.5" y1="417" x2="38" y2="417"/><line x1="50" y1="417" x2="52.5" y2="417"/>
  </g>
  <text x="70" y="414" font-size="12" fill="#202A3B" class="b">VR200 NVL72 系统</text>
  <text x="70" y="433" font-size="9.5" fill="#8A93A5">搭载 Vera Rubin 芯片组合</text>
  <text x="360" y="415.5" text-anchor="end" font-size="13" fill="#202A3B" class="b">$500万–$700万<tspan font-size="9" fill="#8A93A5"> /台</tspan></text>
  <text x="360" y="433" text-anchor="end" font-size="9.5" fill="#D2481C" class="w">出货前询价最高已达此档</text>

  <!-- Insight strip -->
  <rect x="16" y="459" width="358" height="36" rx="10" fill="#FFF6E9" stroke="#FBE3C2"/>
  <path d="M42 468 L51 484 H33 Z" fill="#F5A623"/>
  <rect x="40.9" y="472.5" width="2.2" height="6.5" rx="1" fill="#FFFFFF"/>
  <circle cx="42" cy="481.5" r="1.3" fill="#FFFFFF"/>
  <text x="58" y="481" font-size="11.5" fill="#8F4E0B" class="w">单台数百万美元级 → +15% 相当于多付 <tspan class="b">大几十万美元</tspan></text>

  <!-- ======== SECTION B ======== -->
  <rect x="20" y="511" width="4" height="15" rx="2" fill="#2563EB"/>
  <text x="32" y="524" font-size="13" fill="#1B2A40" class="b">财报焦点｜下周三美股盘后</text>
  <line x1="204" y1="519" x2="374" y2="519" stroke="#E0E6EE" stroke-dasharray="4 4"/>

  <g filter="url(#sh)"><rect x="16" y="534" width="358" height="88" rx="14" fill="#FFFFFF" stroke="#E4EAF2"/></g>
  <circle cx="52" cy="578" r="24" fill="none" stroke="#ECEFF5" stroke-width="7"/>
  <circle cx="52" cy="578" r="24" fill="none" stroke="#2563EB" stroke-width="7"
          stroke-dasharray="113.1 999" transform="rotate(-90 52 578)"/>
  <text x="52" y="582.5" text-anchor="middle" font-size="12.5" fill="#1F2C42" class="b">75%</text>

  <text x="94" y="561" font-size="11.5" fill="#22314A" class="b">毛利率保持约 75%</text>
  <text x="94" y="578" font-size="9.5" fill="#7E8899">上一财年同期 60.5%｜下季指引 74.9%–75%</text>
  <circle cx="99" cy="598.5" r="3" fill="#E14817"/>
  <text x="109" y="602" font-size="11" fill="#D2481C" class="w">关注点：存储涨价会否侵蚀利润率</text>

  <!-- ======== SECTION C ======== -->
  <rect x="20" y="640" width="4" height="15" rx="2" fill="#0E9488"/>
  <text x="32" y="653" font-size="13" fill="#1B2A40" class="b">连锁影响｜格局与对策</text>
  <line x1="180" y1="648" x2="374" y2="648" stroke="#E0E6EE" stroke-dasharray="4 4"/>

  <g filter="url(#sh)"><rect x="16" y="664" width="358" height="116" rx="14" fill="#FFFFFF" stroke="#E4EAF2"/></g>

  <circle cx="36" cy="677" r="8.5" fill="#E7EFFE"/>
  <text x="36" y="680.5" text-anchor="middle" font-size="10" fill="#2C61C8" class="b">1</text>
  <text x="54" y="675" font-size="11.5" fill="#243247" class="b">云巨头加速自研芯片</text>
  <text x="54" y="690" font-size="9.5" fill="#7E8899">亚马逊、微软、谷歌、Meta 立项推进中</text>
  <line x1="54" y1="701" x2="358" y2="701" stroke="#EFF2F6"/>

  <circle cx="36" cy="713" r="8.5" fill="#E7EFFE"/>
  <text x="36" y="716.5" text-anchor="middle" font-size="10" fill="#2C61C8" class="b">2</text>
  <text x="54" y="711" font-size="11.5" fill="#243247" class="b">缺芯潮向更多厂商蔓延</text>
  <text x="54" y="726" font-size="9.5" fill="#7E8899">苹果、高通等亦因芯片短缺上调产品价格</text>
  <line x1="54" y1="737" x2="358" y2="737" stroke="#EFF2F6"/>

  <circle cx="36" cy="749" r="8.5" fill="#E7EFFE"/>
  <text x="36" y="752.5" text-anchor="middle" font-size="10" fill="#2C61C8" class="b">3</text>
  <text x="54" y="747" font-size="11.5" fill="#243247" class="b">挑战者紧盯的机会窗口</text>
  <text x="54" y="762" font-size="9.5" fill="#7E8899">关键筹码：能否从三星、SK海力士、美光获得内存供给</text>

  <!-- ======== FOOTER ======== -->
  <line x1="16" y1="804" x2="374" y2="804" stroke="#E4E9F0"/>
  <text x="195" y="822" text-anchor="middle" font-size="9" fill="#9AA3B3">来源｜财联社 8月23日快讯 · 编辑 史正丞</text>
