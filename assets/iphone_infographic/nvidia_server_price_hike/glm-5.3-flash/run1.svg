<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="hdrFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECF1DB"/>
      <stop offset="1" stop-color="#ECF1DB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F6F5F0"/>
  <rect width="390" height="160" fill="url(#hdrFade)"/>

  <!-- 顶部 -->
  <circle cx="30" cy="33" r="3.5" fill="#537B0A"/>
  <text x="42" y="37" font-size="11" letter-spacing="1.5" fill="#77836E">财联社快讯 · 8 月 23 日</text>
  <text x="28" y="73" font-size="23" font-weight="600" fill="#17251F">英伟达服务器传出涨价消息</text>
  <text x="28" y="103" font-size="23" font-weight="600" fill="#17251F">涨幅<tspan fill="#537B0A">「很多情况下超过 15%」</tspan></text>

  <!-- 卡片 1：核心涨幅 -->
  <g>
    <rect x="16" y="130" width="358" height="154" rx="18" fill="#FFFFFF" stroke="#E9E7DC"/>
    <rect x="32" y="153" width="18" height="3" rx="1.5" fill="#537B0A"/>
    <text x="32" y="172" font-size="10.5" letter-spacing="3" fill="#98A196">预计涨幅</text>
    <text x="32" y="232" font-size="54" font-weight="700" fill="#537B0A">15%</text>
    <polygon points="146,220 158,203 170,220" fill="#537B0A"/>
    <text x="32" y="259" font-size="10.5" fill="#8A938C">单台新增或达近百万美元</text>

    <line x1="196" y1="152" x2="196" y2="262" stroke="#EFEBDD"/>
    <text x="214" y="170" font-size="12.5" font-weight="600" fill="#17251F">诱因：DRAM 成本飙升</text>
    <line x1="214" x2="356" y1="179" y2="179" stroke="#EFEDE2"/>
    <circle cx="219" cy="198" r="2.5" fill="#537B0A"/>
    <text x="229" y="202" font-size="12" fill="#3B4540">覆盖明年初交付的系统</text>
    <circle cx="219" cy="222" r="2.5" fill="#537B0A"/>
    <text x="229" y="226" font-size="12" fill="#3B4540">Vera Rubin 组合</text>
    <circle cx="219" cy="246" r="2.5" fill="#537B0A"/>
    <text x="229" y="250" font-size="12" fill="#3B4540">Grace Blackwell 组合</text>
  </g>

  <!-- 卡片 2：机架报价 -->
  <g>
    <rect x="16" y="298" width="358" height="152" rx="18" fill="#FFFFFF" stroke="#E9E7DC"/>
    <rect x="32" y="312" width="4" height="16" rx="2" fill="#537B0A"/>
    <text x="44" y="325" font-size="14" font-weight="600" fill="#17251F">旗舰机架报价参照</text>
    <text x="360" y="325" font-size="10.5" fill="#98A196" text-anchor="end">单位：美元 / 台</text>

    <text x="32" y="353" font-size="10.5" font-weight="500" fill="#47514B">GB200 机架</text>
    <text x="32" y="365" font-size="9.5" fill="#98A196">Blackwell</text>
    <rect x="100" y="346" width="119" height="16" rx="8" fill="#BBCB82"/>
    <text x="227" y="358" font-size="10.5" font-weight="500" fill="#47514B">$280 – 340 万</text>

    <text x="32" y="395" font-size="10.5" font-weight="500" fill="#47514B">VR200 系统</text>
    <text x="32" y="407" font-size="9.5" fill="#98A196">Vera Rubin</text>
    <rect x="100" y="388" width="245" height="16" rx="8" fill="#537B0A"/>
    <text x="337" y="400" font-size="10" font-weight="500" fill="#FFFFFF" text-anchor="end">$500 – 700 万 · 询价</text>

    <line x1="32" x2="358" y1="420" y2="420" stroke="#F0EEE4"/>
    <text x="32" y="438" font-size="10.5" fill="#8A938C">NVL72 机架 · 按 340 万美元计，+15% ≈ 多付约 51 万美元</text>
  </g>

  <!-- 卡片 3：消费端 -->
  <g>
    <rect x="16" y="464" width="358" height="96" rx="18" fill="#FFFFFF" stroke="#E9E7DC"/>
    <rect x="32" y="482" width="4" height="16" rx="2" fill="#BF4B33"/>
    <text x="44" y="495" font-size="13.5" font-weight="600" fill="#17251F">消费级显卡同步暴涨</text>
    <text x="44" y="515" font-size="11" fill="#8A938C">次旗舰 RTX 5080 · 近一个月行情</text>

    <rect x="300" y="478" width="56" height="20" rx="10" fill="#FAE9E3"/>
    <text x="328" y="492" font-size="11.5" font-weight="700" fill="#BF4B33" text-anchor="middle">+50%</text>
    <text x="192" y="530" font-size="16" font-weight="500" fill="#A2A8A2">¥8,000</text>
    <line x1="188" x2="248" y1="524" y2="524" stroke="#B9BFB8" stroke-width="1.5"/>
    <line x1="256" x2="278" y1="524" y2="524" stroke="#BF4B33" stroke-width="2"/>
    <polygon points="286,524 276,519 276,529" fill="#BF4B33"/>
    <text x="294" y="530" font-size="18" font-weight="700" fill="#BF4B33">¥12,000</text>
  </g>

  <!-- 卡片 4：财报前瞻 -->
  <g>
    <rect x="16" y="574" width="358" height="118" rx="18" fill="#FFFFFF" stroke="#E9E7DC"/>
    <rect x="32" y="588" width="4" height="16" rx="2" fill="#537B0A"/>
    <text x="44" y="601" font-size="14" font-weight="600" fill="#17251F">关注点：下周三财报</text>
    <text x="358" y="601" font-size="10.5" fill="#98A196" text-anchor="end">美股盘后发布</text>
    <text x="44" y="622" font-size="11" fill="#8A938C">检验存储涨价是否侵蚀算力龙头利润率</text>

    <text x="32" y="648" font-size="10.5" fill="#6E7770">上年同期</text>
    <rect x="100" y="640" width="177" height="9" rx="4.5" fill="#CBD3C0"/>
    <text x="285" y="648" font-size="10.5" fill="#6E7770">60.5%</text>

    <text x="32" y="672" font-size="10.5" fill="#47514B" font-weight="500">最新季度</text>
    <rect x="100" y="664" width="219" height="9" rx="4.5" fill="#537B0A"/>
    <text x="327" y="672" font-size="11" font-weight="700" fill="#17251F">≈75%</text>
  </g>

  <!-- 卡片 5：延伸影响 -->
  <g>
    <rect x="16" y="706" width="358" height="100" rx="18" fill="#FFFFFF" stroke="#E9E7DC"/>
    <rect x="32" y="720" width="4" height="16" rx="2" fill="#537B0A"/>
    <text x="44" y="733" font-size="13.5" font-weight="600" fill="#17251F">延伸影响</text>

    <circle cx="40" cy="750" r="2.5" fill="#537B0A"/>
    <text x="54" y="754" font-size="12" fill="#37403B">三星 / SK海力士 / 美光：内存话语权大增</text>
    <circle cx="40" cy="770" r="2.5" fill="#537B0A"/>
    <text x="54" y="774" font-size="12" fill="#37403B">苹果、高通等多家巨头因缺芯相继提价</text>
    <circle cx="40" cy="790" r="2.5" fill="#537B0A"/>
    <text x="54" y="794" font-size="12" fill="#37403B">云巨头自研芯片提速，短期仍依赖英伟达</text>
  </g>

  <!-- 页脚 -->
  <text x="195" y="831" font-size="9.5" letter-spacing="1" fill="#A6ACA3" text-anchor="middle">资料来源：财联社 · 编辑 史正丞</text>
</svg>