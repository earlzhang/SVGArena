<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>英伟达服务器涨价信息图</title>
<defs>
<linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FBFCF9"/>
<stop offset="1" stop-color="#F1F4EC"/>
</linearGradient>
<linearGradient id="gOr" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFB05A"/>
<stop offset="1" stop-color="#EE6B2E"/>
</linearGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20303F" flood-opacity="0.07"/>
</filter>
</defs>

<rect width="390" height="844" fill="url(#bgG)"/>
<circle cx="374" cy="24" r="72" fill="#F0F6E2" opacity="0.9"/>
<circle cx="6" cy="196" r="46" fill="#FFF0E4" opacity="0.8"/>
<circle cx="392" cy="782" r="42" fill="#EDF3FB" opacity="0.85"/>

<g font-family="'PingFang SC','PingFang TC','Helvetica Neue',sans-serif">

<!-- 头部 -->
<rect x="24" y="16" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#E3E8DC"/>
<circle cx="38" cy="27" r="3" fill="#E8590C"/>
<text x="48" y="31" font-size="10.5" font-weight="600" fill="#5A6B54">财联社 · 2025年8月23日</text>
<text x="24" y="72" font-size="21" font-weight="700" fill="#141C26">英伟达服务器传出涨价消息</text>
<text x="24" y="98" font-size="16" font-weight="600" fill="#2A3542">涨幅“很多情况下超过<tspan font-size="18" font-weight="800" fill="#E8590C">15%</tspan>”</text>

<!-- 卡1 核心快讯 -->
<rect x="24" y="112" width="342" height="116" rx="16" fill="#FFFDFB" stroke="#F5DEC9" filter="url(#ds)"/>
<circle cx="48" cy="134" r="11" fill="#FFE4CF"/>
<path d="M48 139 V129 M44 133 l4 -4 l4 4" stroke="#E8590C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="138" font-size="11" font-weight="700" fill="#D9480F" letter-spacing="1">核心快讯</text>
<text x="40" y="165" font-size="15" font-weight="700" fill="#1B2430">AI服务器将普遍提价，涨幅多数超15%</text>
<text x="40" y="186" font-size="11.5" fill="#5F6977">直接推手：内存(DRAM)成本大幅上涨</text>
<rect x="40" y="194" width="70" height="20" rx="10" fill="#F0F5E6" stroke="#DCE6C9"/>
<text x="75" y="207.5" font-size="10" font-weight="600" fill="#4E6B31" text-anchor="middle">Vera Rubin</text>
<rect x="118" y="194" width="97" height="20" rx="10" fill="#F0F5E6" stroke="#DCE6C9"/>
<text x="166.5" y="207.5" font-size="10" font-weight="600" fill="#4E6B31" text-anchor="middle">Grace Blackwell</text>
<rect x="223" y="194" width="74" height="20" rx="10" fill="#F0F5E6" stroke="#DCE6C9"/>
<text x="260" y="207.5" font-size="10" font-weight="600" fill="#4E6B31" text-anchor="middle">明年初起交付</text>

<!-- 卡2 价格对比 -->
<rect x="24" y="244" width="342" height="188" rx="16" fill="#FFFFFF" stroke="#E6EAE0" filter="url(#ds)"/>
<text x="40" y="270" font-size="14" font-weight="700" fill="#1B2430">一台AI服务器卖多少钱？<tspan font-size="9.5" font-weight="400" fill="#9AA3AE">（美元/台）</tspan></text>
<rect x="283" y="262" width="13" height="9" rx="2" fill="#FFE9DB" stroke="#E8894C" stroke-width="1" stroke-dasharray="2.5 2"/>
<text x="350" y="271" font-size="9" fill="#8C95A1" text-anchor="end">再加15%后</text>

<line x1="40" y1="292" x2="40" y2="372" stroke="#DFE3E8" stroke-width="1"/>

<text x="40" y="296"><tspan font-size="12.5" font-weight="700" fill="#202A36">GB200 NVL72</tspan><tspan font-size="9.5" fill="#98A1AC">　Blackwell</tspan></text>
<text x="350" y="296" font-size="12" font-weight="700" fill="#D9480F" text-anchor="end">280–340万美元</text>
<rect x="41" y="303" width="113" height="13" rx="6.5" fill="url(#gOr)"/>
<rect x="132.4" y="303" width="1.2" height="13" fill="#FFFFFF" opacity="0.85"/>
<rect x="154" y="303" width="17" height="13" rx="6.5" fill="#FFEADA" stroke="#E8894C" stroke-width="1" stroke-dasharray="2.5 2"/>

<text x="40" y="340"><tspan font-size="12.5" font-weight="700" fill="#202A36">VR200 NVL72</tspan><tspan font-size="9.5" fill="#98A1AC">　Vera Rubin</tspan></text>
<text x="350" y="340" font-size="12" font-weight="700" fill="#D9480F" text-anchor="end">500–700万美元</text>
<rect x="41" y="347" width="232" height="13" rx="6.5" fill="url(#gOr)"/>
<rect x="205.1" y="347" width="1.2" height="13" fill="#FFFFFF" opacity="0.85"/>
<rect x="273" y="347" width="35" height="13" rx="6.5" fill="#FFEADA" stroke="#E8894C" stroke-width="1" stroke-dasharray="2.5 2"/>

<text x="40" y="380" font-size="8" fill="#AEB6BF">0</text>
<text x="156" y="380" font-size="8" fill="#AEB6BF" text-anchor="middle">350万</text>
<text x="272" y="380" font-size="8" fill="#AEB6BF" text-anchor="middle">700万</text>

<rect x="40" y="388" width="310" height="30" rx="9" fill="#FFF1E3"/>
<text x="195" y="407" text-anchor="middle"><tspan font-size="11" fill="#7A6A5C">若整体涨15%：</tspan><tspan font-size="12" font-weight="800" fill="#D9480F">单台多付约42万–105万美元</tspan></text>

<!-- 卡3 消费端 -->
<rect x="24" y="446" width="342" height="64" rx="16" fill="#FFFFFF" stroke="#E6EAE0" filter="url(#ds)"/>
<circle cx="54" cy="478" r="19" fill="#EFEBFC"/>
<text x="54" y="482" font-size="10" font-weight="800" fill="#6B4EE6" text-anchor="middle">RTX</text>
<text x="84" y="471" font-size="13.5" font-weight="700" fill="#1B2430">消费显卡先行狂飙 · RTX 5080</text>
<text x="84" y="493" font-size="12" fill="#5F6977">一个月内 ¥8,000 → <tspan font-size="12.5" font-weight="800" fill="#D9480F">¥12,000</tspan></text>
<rect x="308" y="466" width="50" height="24" rx="12" fill="#FFE1D0"/>
<text x="333" y="482" font-size="12.5" font-weight="800" fill="#D9480F" text-anchor="middle">+50%</text>

<!-- 卡4 利润率 -->
<rect x="24" y="524" width="342" height="120" rx="16" fill="#F7FBF3" stroke="#DFEDD2" filter="url(#ds)"/>
<circle cx="52" cy="549" r="11" fill="#E2F1D3"/>
<text x="52" y="553.5" font-size="12" font-weight="800" fill="#3E7B27" text-anchor="middle">%</text>
<text x="72" y="554" font-size="14.5" font-weight="700" fill="#22421B">下周三盘后放榜，市场紧盯利润率</text>
<text x="40" y="580" font-size="11.5" fill="#5C7052">焦点：存储涨价会否侵蚀算力龙头的高毛利</text>
<rect x="40" y="592" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#CBDFBA"/>
<text x="106" y="608" text-anchor="middle"><tspan font-size="10.5" fill="#5F7355">当前毛利率 </tspan><tspan font-size="13" font-weight="800" fill="#2F6B1F">75%</tspan></text>
<rect x="180" y="592" width="160" height="24" rx="12" fill="#FFFFFF" stroke="#CBDFBA"/>
<text x="260" y="608" text-anchor="middle"><tspan font-size="10.5" fill="#5F7355">上年同期 </tspan><tspan font-size="13" font-weight="800" fill="#8A94A2">60.5%</tspan></text>
<text x="40" y="634" font-size="9.5" fill="#7C8B72">公司指引下季仍维持74.9%–75%，处于历史高位</text>

<!-- 卡5 连锁反应 -->
<rect x="24" y="658" width="342" height="106" rx="16" fill="#F2F7FD" stroke="#DCE8F6" filter="url(#ds)"/>
<circle cx="46" cy="680" r="4" fill="#2F6DA8"/>
<text x="58" y="685" font-size="14" font-weight="700" fill="#14304C">连锁反应与后续看点</text>
<circle cx="48" cy="702" r="3" fill="#7FA6D0"/>
<text x="58" y="706" font-size="12" fill="#3B4756">存储巨头话语权飙升，DRAM成AI最紧瓶颈</text>
<circle cx="48" cy="722" r="3" fill="#7FA6D0"/>
<text x="58" y="726" font-size="12" fill="#3B4756">亚马逊、谷歌、Meta等云巨头加速自研芯片</text>
<circle cx="48" cy="742" r="3" fill="#7FA6D0"/>
<text x="58" y="746" font-size="12" fill="#3B4756">CUDA生态护城河仍在，短期难以被替代</text>

<!-- 页脚 -->
<line x1="24" y1="784" x2="366" y2="784" stroke="#E2E6DD" stroke-width="1"/>
<text x="195" y="802" font-size="9.5" fill="#9AA3AB" text-anchor="middle">资料来源：财联社 2025-08-23 · 编辑 史正丞</text>

</g>
</svg>