<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#EAEFF5"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF6F4"/>
    </linearGradient>
    <filter id="s" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1C2A3A" flood-opacity="0.07"/>
    </filter>
    <filter id="s2" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1C2A3A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>
  <rect width="390" height="6" fill="#2F8F4E"/>

  <text x="20" y="32" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#7A8699">财联社 · 8月23日</text>
  <text x="370" y="32" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#7A8699">科技 / 算力</text>

  <text x="20" y="64" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="21" font-weight="600" fill="#1A2332">英伟达服务器传出涨价消息</text>
  <text x="20" y="92" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="16" font-weight="500" fill="#C44536">涨幅「很多情况下超过 15%」</text>

  <rect x="16" y="112" width="358" height="132" rx="16" fill="url(#hero)" filter="url(#s)"/>
  <rect x="16" y="112" width="6" height="132" rx="3" fill="#DC4C3E"/>
  <text x="40" y="148" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" fill="#9A4A40">普遍提价幅度</text>
  <text x="36" y="204" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="52" font-weight="700" fill="#DC4C3E">&gt;15%</text>
  <line x1="188" y1="132" x2="188" y2="224" stroke="#F0D8D4" stroke-width="1"/>
  <text x="208" y="150" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#8A93A3">生效时间</text>
  <text x="208" y="174" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="16" font-weight="600" fill="#1A2332">明年年初出货</text>
  <text x="208" y="198" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" fill="#5A6577">Vera Rubin / Grace Blackwell</text>
  <text x="208" y="220" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" fill="#C44536">主因：内存芯片成本飙升</text>

  <rect x="16" y="258" width="174" height="88" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <circle cx="38" cy="282" r="11" fill="#E8F5EC"/>
  <text x="38" y="286" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" font-weight="600" fill="#2F8F4E">①</text>
  <text x="56" y="286" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" font-weight="600" fill="#1A2332">服务器提价</text>
  <text x="28" y="312" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">最大客户已获通知</text>
  <text x="28" y="330" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">涨幅视芯片与内存而定</text>

  <rect x="200" y="258" width="174" height="88" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <circle cx="222" cy="282" r="11" fill="#EEF3FA"/>
  <text x="222" y="286" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" font-weight="600" fill="#3B6FA0">②</text>
  <text x="240" y="286" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" font-weight="600" fill="#1A2332">财报将至</text>
  <text x="212" y="312" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">下周三美股盘后发布</text>
  <text x="212" y="330" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">关注存储涨价蚀利润</text>

  <text x="20" y="372" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" font-weight="600" fill="#1A2332">价格对照</text>
  <text x="370" y="372" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#8A93A3">15% ≈ 数十万至近百万美元</text>

  <rect x="16" y="384" width="114" height="118" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="73" y="410" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="10" fill="#8A93A3">NVL72 GB200</text>
  <text x="73" y="436" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="15" font-weight="700" fill="#1A2332">280–340万</text>
  <text x="73" y="456" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">美元 / 台</text>
  <rect x="32" y="468" width="82" height="20" rx="10" fill="#EEF3FA"/>
  <text x="73" y="482" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="10" fill="#3B6FA0">Blackwell</text>

  <rect x="138" y="384" width="114" height="118" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="195" y="410" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="10" fill="#8A93A3">NVL72 VR200</text>
  <text x="195" y="436" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="15" font-weight="700" fill="#1A2332">500–700万</text>
  <text x="195" y="456" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">美元 / 台</text>
  <rect x="154" y="468" width="82" height="20" rx="10" fill="#E8F5EC"/>
  <text x="195" y="482" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="10" fill="#2F8F4E">Vera Rubin</text>

  <rect x="260" y="384" width="114" height="118" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="317" y="410" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="10" fill="#8A93A3">消费级 RTX 5080</text>
  <text x="317" y="436" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="15" font-weight="700" fill="#DC4C3E">0.8→1.2万</text>
  <text x="317" y="456" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">人民币 / 1个月</text>
  <rect x="276" y="468" width="82" height="20" rx="10" fill="#FDEEEC"/>
  <text x="317" y="482" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="10" fill="#C44536">已先暴涨</text>

  <rect x="16" y="518" width="358" height="92" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="32" y="544" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" font-weight="600" fill="#1A2332">毛利率仍处高位</text>
  <text x="358" y="544" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="20" font-weight="700" fill="#2F8F4E">75%</text>
  <rect x="32" y="558" width="326" height="8" rx="4" fill="#E8EDF3"/>
  <rect x="32" y="558" width="245" height="8" rx="4" fill="#2F8F4E"/>
  <text x="32" y="586" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#8A93A3">上年同期 60.5%</text>
  <text x="358" y="586" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#8A93A3">Q2指引 74.9%–75%</text>

  <rect x="16" y="626" width="174" height="108" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="32" y="652" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" font-weight="600" fill="#1A2332">为何涨价</text>
  <text x="32" y="676" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">AI芯片性能高度依赖</text>
  <text x="32" y="694" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">配套 DRAM 容量</text>
  <text x="32" y="716" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#C44536">存储从大宗品变定价权</text>

  <rect x="200" y="626" width="174" height="108" rx="14" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="216" y="652" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" font-weight="600" fill="#1A2332">连锁影响</text>
  <text x="216" y="676" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">云厂加速自研芯片</text>
  <text x="216" y="694" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#5A6577">亚马逊 / 微软 / 谷歌 / Meta</text>
  <text x="216" y="716" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#3B6FA0">CUDA 护城河仍在</text>

  <rect x="16" y="750" width="358" height="70" rx="14" fill="#1A2332"/>
  <text x="195" y="778" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="12" fill="#D5DCE6">代工厂已通知微软、谷歌、甲骨文等客户</text>
  <text x="195" y="800" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="11" fill="#8A93A3">挑战者关键：能否拿到三星 / SK海力士 / 美光供应</text>
</svg>