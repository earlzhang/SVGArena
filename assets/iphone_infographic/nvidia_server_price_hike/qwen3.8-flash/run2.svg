<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text {
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "STHeiti", sans-serif;
    }
    .h1 { font-size: 19px; font-weight: 700; fill: #111827; }
    .tag { font-size: 11px; fill: #1D4ED8; }
    .card-title { font-size: 13px; font-weight: 700; fill: #111827; }
    .card-sub { font-size: 12px; fill: #4B5563; }
    .small { font-size: 11px; fill: #6B7280; }
    .metric { font-size: 22px; font-weight: 700; fill: #111827; }
    .metric-label { font-size: 11px; fill: #4B5563; }
    .chip-text { font-size: 11px; font-weight: 700; fill: #2F855A; }
    .chip-text-gray { font-size: 11px; font-weight: 700; fill: #4B5563; }
  </style>

  <rect width="390" height="844" fill="#F8FAFC"/>
  <circle cx="345" cy="30" r="80" fill="#EAF7EA" opacity=".65"/>
  <circle cx="20" cy="780" r="90" fill="#EEF2FF" opacity=".55"/>

  <rect x="18" y="20" width="86" height="20" rx="10" fill="#E7F0FF"/>
  <text x="30" y="34" class="tag">财联社 8月23日</text>

  <text x="18" y="62" class="h1">英伟达服务器传出涨价消息</text>
  <text x="18" y="84" font-size="18" font-weight="700" fill="#111827">涨幅“很多情况下超过15%”</text>

  <rect x="18" y="100" width="108" height="72" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="72" y="130" text-anchor="middle" class="metric">&gt;15%</text>
  <text x="72" y="152" text-anchor="middle" class="metric-label">常见涨幅</text>

  <rect x="132" y="100" width="108" height="72" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="186" y="130" text-anchor="middle" class="metric">明年初</text>
  <text x="186" y="152" text-anchor="middle" class="metric-label">出货系统</text>

  <rect x="246" y="100" width="108" height="72" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="300" y="130" text-anchor="middle" class="metric">下周三</text>
  <text x="300" y="152" text-anchor="middle" class="metric-label">发布财报</text>

  <rect x="18" y="184" width="354" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30" y="206" class="card-title">本轮涨价适用于哪些系统？</text>
  <rect x="28" y="218" width="112" height="26" rx="13" fill="#EAF7EA"/>
  <text x="84" y="235" text-anchor="middle" class="chip-text">Vera Rubin</text>
  <rect x="148" y="218" width="124" height="26" rx="13" fill="#EAF7EA"/>
  <text x="210" y="235" text-anchor="middle" class="chip-text">Grace Blackwell</text>
  <rect x="282" y="218" width="80" height="26" rx="13" fill="#F3F4F6"/>
  <text x="322" y="235" text-anchor="middle" class="chip-text-gray">内存配置</text>
  <text x="28" y="260" class="small">多家代工企业已通知微软、谷歌、甲骨文等客户。</text>

  <rect x="18" y="284" width="354" height="86" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30" y="306" class="card-title">涨价逻辑：内存成本飙升</text>
  <circle cx="34" cy="322" r="3" fill="#76B900"/>
  <text x="46" y="326" class="card-sub">AI芯片性能取决于配套 DRAM 容量</text>
  <circle cx="34" cy="342" r="3" fill="#76B900"/>
  <text x="46" y="346" class="card-sub">内存涨价推高整机成本，部分涨幅超15%</text>
  <circle cx="34" cy="362" r="3" fill="#76B900"/>
  <text x="46" y="366" class="card-sub">具体涨幅取决于芯片与内存配置</text>

  <rect x="18" y="382" width="354" height="84" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30" y="404" class="card-title">市场关注：利润率是否承压</text>
  <text x="360" y="406" text-anchor="end" font-size="24" font-weight="700" fill="#76B900">75%</text>
  <text x="360" y="422" text-anchor="end" class="small">当前毛利率</text>
  <text x="30" y="428" class="card-sub">下周三美股盘后发布最新财报</text>
  <text x="30" y="448" class="small">存储“狂潮”是否会侵蚀算力芯片龙头利润率</text>

  <rect x="18" y="476" width="354" height="184" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30" y="498" class="card-title">价格参考：从显卡到机架</text>
  <text x="30" y="520" class="card-sub">消费显卡：RTX 5080</text>
  <text x="30" y="542" font-size="14" font-weight="700" fill="#111827">8000元 → 12000元</text>
  <line x1="30" y1="554" x2="360" y2="554" stroke="#E5E7EB" stroke-width="1"/>
  <text x="30" y="574" class="card-sub">AI服务器按台询价</text>

  <text x="30" y="596" class="small" fill="#4B5563">GB200 NVL72</text>
  <rect x="140" y="588" width="110" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="140" y="588" width="55" height="10" rx="5" fill="#9CA3AF"/>
  <text x="256" y="597" class="small" fill="#4B5563">280–340万</text>

  <text x="30" y="622" class="small" fill="#4B5563">VR200 NVL72</text>
  <rect x="140" y="614" width="110" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="140" y="614" width="110" height="10" rx="5" fill="#76B900"/>
  <text x="256" y="623" class="small" fill="#4B5563">500–700万</text>

  <text x="30" y="644" class="small">注：美元报价；15%涨幅可增数十万至近百万美元</text>

  <rect x="18" y="672" width="354" height="84" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30" y="694" class="card-title">后续影响</text>
  <circle cx="34" cy="710" r="3" fill="#76B900"/>
  <text x="46" y="714" class="card-sub">云厂商加速自研，但仍依赖英伟达软件生态</text>
  <circle cx="34" cy="730" r="3" fill="#76B900"/>
  <text x="46" y="734" class="card-sub">挑战者关键：能否获得足够内存芯片供应</text>

  <text x="195" y="778" text-anchor="middle" class="small">信息图基于公开报道整理，仅供阅读参考</text>
</svg>