<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text {
        font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "STHeiti", "Songti SC", "Kaiti SC", sans-serif;
      }
      .card { fill:#FFFFFF; stroke:#E5E7EB; stroke-width:1; }
      .title { font-size:17px; font-weight:700; fill:#111827; }
      .sub { font-size:11px; fill:#4B5563; }
      .small { font-size:10px; fill:#6B7280; }
      .tiny { font-size:9px; fill:#9CA3AF; }
      .h2 { font-size:13px; font-weight:700; fill:#111827; }
      .bar-bg { fill:#F3F4F6; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F6F8FB"/>

  <!-- Header -->
  <rect class="card" x="16" y="16" width="358" height="84" rx="18"/>
  <text class="title" x="32" y="42">英伟达服务器传出涨价消息</text>
  <text class="sub" x="32" y="63">搭载 Vera Rubin / Grace Blackwell 芯片</text>
  <text class="sub" x="32" y="80">明年初出货系统普遍提价，内存成本是主因</text>

  <rect x="284" y="26" width="72" height="64" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="320" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#C2410C">+15%</text>
  <text x="320" y="70" text-anchor="middle" font-size="10" fill="#9A3412">很多情况下</text>
  <text x="320" y="84" text-anchor="middle" font-size="10" fill="#9A3412">超过</text>

  <!-- Core info -->
  <rect class="card" x="16" y="110" width="358" height="96" rx="16"/>
  <text class="small" x="32" y="130">核心信息</text>

  <rect x="32" y="142" width="102" height="48" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="44" y="160" font-size="10" fill="#9A3412">涨价对象</text>
  <text x="44" y="176" font-size="10" font-weight="700" fill="#7C2D12">Vera Rubin</text>
  <text x="44" y="187" font-size="9" font-weight="700" fill="#7C2D12">Grace Blackwell</text>

  <rect x="144" y="142" width="102" height="48" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="156" y="160" font-size="10" fill="#1E40AF">生效时间</text>
  <text x="156" y="177" font-size="11" font-weight="700" fill="#1E3A8A">明年初出货</text>
  <text x="156" y="189" font-size="9" fill="#3B82F6">按配置决定</text>

  <rect x="256" y="142" width="102" height="48" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="268" y="160" font-size="10" fill="#065F46">直接推手</text>
  <text x="268" y="177" font-size="11" font-weight="700" fill="#047857">内存成本</text>
  <text x="268" y="189" font-size="9" fill="#059669">DRAM 飙升</text>

  <!-- Price pressure -->
  <rect class="card" x="16" y="218" width="358" height="180" rx="16"/>
  <text class="h2" x="32" y="242">价格锚点：从显卡到 AI 机架</text>

  <text class="small" x="32" y="264">消费显卡 RTX 5080（元）</text>
  <text x="358" y="264" text-anchor="end" font-size="10" font-weight="700" fill="#C2410C">1个月 +50%</text>
  <rect class="bar-bg" x="32" y="272" width="326" height="8" rx="4"/>
  <rect x="32" y="272" width="217" height="8" rx="4" fill="#FDBA74"/>
  <rect x="249" y="272" width="109" height="8" rx="4" fill="#F97316"/>
  <text x="32" y="290" font-size="9" fill="#6B7280">8000</text>
  <text x="358" y="290" text-anchor="end" font-size="9" font-weight="700" fill="#C2410C">1.2万</text>

  <text class="small" x="32" y="306">GB200 NVL72 机架（万美元）</text>
  <rect class="bar-bg" x="32" y="314" width="326" height="8" rx="4"/>
  <rect x="32" y="314" width="158" height="8" rx="4" fill="#60A5FA"/>
  <text x="32" y="332" font-size="9" fill="#6B7280">280</text>
  <text x="198" y="332" font-size="9" font-weight="700" fill="#1D4ED8">340</text>

  <text class="small" x="32" y="348">VR200 系统询价（万美元）</text>
  <rect class="bar-bg" x="32" y="356" width="326" height="8" rx="4"/>
  <rect x="32" y="356" width="326" height="8" rx="4" fill="#34D399"/>
  <text x="32" y="374" font-size="9" fill="#6B7280">500</text>
  <text x="358" y="374" text-anchor="end" font-size="9" font-weight="700" fill="#047857">700</text>

  <text class="tiny" x="32" y="388">注：AI服务器单价高，15%涨幅可能意味着数十万美元</text>

  <!-- Financial focus -->
  <rect class="card" x="16" y="408" width="358" height="150" rx="16"/>
  <text class="h2" x="32" y="432">财报前关注：利润率会被内存涨价侵蚀吗</text>
  <text class="small" x="32" y="450">下周三美股盘后发布最新财报</text>

  <rect x="32" y="460" width="102" height="54" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="44" y="478" font-size="10" fill="#6B7280">季度营收</text>
  <text x="44" y="500" font-size="17" font-weight="700" fill="#111827">816亿</text>
  <text x="92" y="500" font-size="10" fill="#6B7280">美元</text>

  <rect x="144" y="460" width="102" height="54" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="156" y="478" font-size="10" fill="#9A3412">当前毛利率</text>
  <text x="156" y="500" font-size="17" font-weight="700" fill="#C2410C">75%</text>
  <text x="192" y="500" font-size="10" fill="#9A3412">约</text>

  <rect x="256" y="460" width="102" height="54" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="268" y="478" font-size="10" fill="#065F46">指引</text>
  <text x="268" y="500" font-size="15" font-weight="700" fill="#047857">74.9-75%</text>

  <text class="small" x="32" y="528">毛利率变化</text>
  <rect class="bar-bg" x="32" y="534" width="326" height="8" rx="4"/>
  <rect x="32" y="534" width="197" height="8" rx="4" fill="#FDBA74"/>
  <rect x="229" y="534" width="48" height="8" rx="4" fill="#F97316"/>
  <text x="32" y="552" font-size="9" fill="#6B7280">上一财年同期 60.5%</text>
  <text x="358" y="552" text-anchor="end" font-size="9" font-weight="700" fill="#C2410C">当前约 75%</text>

  <!-- Industry impact -->
  <rect class="card" x="16" y="568" width="358" height="214" rx="16"/>
  <text class="h2" x="32" y="592">产业链影响与后续变量</text>

  <circle cx="38" cy="612" r="3" fill="#F97316"/>
  <text x="50" y="615" font-size="10" fill="#374151">DRAM 容量影响 AI 性能，算力争抢推高内存价格</text>

  <circle cx="38" cy="638" r="3" fill="#3B82F6"/>
  <text x="50" y="641" font-size="10" fill="#374151">苹果、高通等也因芯片短缺提高产品价格</text>

  <circle cx="38" cy="664" r="3" fill="#10B981"/>
  <text x="50" y="667" font-size="10" fill="#374151">亚马逊 / 微软 / 谷歌 / Meta 推进自研芯片</text>

  <circle cx="38" cy="690" r="3" fill="#8B5CF6"/>
  <text x="50" y="693" font-size="10" fill="#374151">但软件生态“护城河”使数据中心仍依赖英伟达</text>

  <circle cx="38" cy="716" r="3" fill="#EF4444"/>
  <text x="50" y="719" font-size="10" fill="#374151">挑战者机会取决于三星、SK海力士、美光供应</text>

  <text class="small" x="32" y="746">具体涨幅取决于英伟达芯片型号与服务器内存配置。</text>
  <text class="small" x="32" y="762">多家大型数据中心代工厂近期已通知客户提价。</text>

  <!-- Footer -->
  <text x="195" y="810" text-anchor="middle" class="tiny">财联社8月23日 · 编辑 史正丞</text>
</svg>