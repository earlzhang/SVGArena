<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172033" flood-opacity="0.06"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c4d6"/>
    </marker>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>

  <g font-family="PingFang SC, Hiragino Sans GB">
    <!-- Header -->
    <rect x="12" y="12" width="366" height="106" rx="18" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <rect x="24" y="26" width="52" height="20" rx="10" fill="#fff1f0" stroke="#ffc9c9"/>
    <text x="50" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#c03434">涨价</text>
    <text x="88" y="40" font-size="10" fill="#667085">财联社 8月23日</text>
    <text x="24" y="64" font-size="17" font-weight="700" fill="#172033">英伟达服务器传出涨价消息</text>
    <text x="24" y="88" font-size="14" font-weight="700" fill="#c03434">涨幅“很多情况下超过15%”</text>
    <text x="24" y="106" font-size="9" fill="#5f6b7f">搭载 Vera Rubin / Grace Blackwell 等芯片的服务器，明年初起普遍提价</text>

    <!-- KPI cards -->
    <rect x="12" y="126" width="112" height="68" rx="16" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="24" y="150" font-size="22" font-weight="700" fill="#c03434">&gt;15%</text>
    <text x="24" y="166" font-size="10" font-weight="700" fill="#172033">服务器涨幅</text>
    <text x="24" y="180" font-size="9" fill="#5f6b7f">多数情况下</text>

    <rect x="134" y="126" width="112" height="68" rx="16" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="146" y="150" font-size="18" font-weight="700" fill="#172033">明年初</text>
    <text x="146" y="166" font-size="10" font-weight="700" fill="#172033">出货系统提价</text>
    <text x="146" y="180" font-size="9" fill="#5f6b7f">最大客户获通知</text>

    <rect x="256" y="126" width="122" height="68" rx="16" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="268" y="150" font-size="18" font-weight="700" fill="#172033">下周财报</text>
    <text x="268" y="166" font-size="10" font-weight="700" fill="#172033">关注毛利率</text>
    <text x="268" y="180" font-size="9" fill="#5f6b7f">存储成本侵蚀</text>

    <!-- Server price -->
    <rect x="12" y="202" width="366" height="126" rx="18" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="24" y="224" font-size="12" font-weight="700" fill="#172033">AI服务器报价：涨价基数更高</text>

    <text x="24" y="246" font-size="10" fill="#5f6b7f">GB200 NVL72 机架</text>
    <text x="366" y="246" text-anchor="end" font-size="10" font-weight="700" fill="#172033">280–340万</text>
    <rect x="24" y="252" width="342" height="10" rx="5" fill="#edf2f7"/>
    <rect x="24" y="252" width="166" height="10" rx="5" fill="#8ab4ff"/>

    <text x="24" y="278" font-size="10" fill="#5f6b7f">VR200 NVL72 系统</text>
    <text x="366" y="278" text-anchor="end" font-size="10" font-weight="700" fill="#172033">500–700万</text>
    <rect x="24" y="284" width="342" height="10" rx="5" fill="#edf2f7"/>
    <rect x="24" y="284" width="342" height="10" rx="5" fill="#fca5a5"/>

    <rect x="24" y="300" width="342" height="20" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="195" y="314" text-anchor="middle" font-size="10" fill="#b45309">若涨15%：额外成本约 42–105 万美元</text>

    <!-- Financial + consumer GPU -->
    <rect x="12" y="334" width="183" height="128" rx="18" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="24" y="356" font-size="12" font-weight="700" fill="#172033">英伟达财务面</text>
    <text x="24" y="374" font-size="10" fill="#5f6b7f">营收 816 亿美元</text>

    <text x="24" y="394" font-size="10" fill="#5f6b7f">上财年毛利率</text>
    <text x="171" y="394" text-anchor="end" font-size="10" font-weight="700" fill="#172033">60.5%</text>
    <rect x="24" y="400" width="159" height="8" rx="4" fill="#edf2f7"/>
    <rect x="24" y="400" width="96" height="8" rx="4" fill="#8ab4ff"/>

    <text x="24" y="424" font-size="10" fill="#5f6b7f">本季度毛利率</text>
    <text x="171" y="424" text-anchor="end" font-size="10" font-weight="700" fill="#172033">75%</text>
    <rect x="24" y="430" width="159" height="8" rx="4" fill="#edf2f7"/>
    <rect x="24" y="430" width="119" height="8" rx="4" fill="#fca5a5"/>

    <text x="24" y="450" font-size="9" fill="#5f6b7f">预期 74.9%–75%</text>

    <rect x="207" y="334" width="171" height="128" rx="18" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="219" y="356" font-size="12" font-weight="700" fill="#172033">消费市场已涨过</text>
    <text x="219" y="374" font-size="10" fill="#5f6b7f">RTX 5080 显卡</text>

    <text x="219" y="392" font-size="10" fill="#5f6b7f">8000元</text>
    <text x="366" y="392" text-anchor="end" font-size="10" fill="#5f6b7f">1个月</text>
    <rect x="219" y="396" width="147" height="8" rx="4" fill="#edf2f7"/>
    <rect x="219" y="396" width="98" height="8" rx="4" fill="#8ab4ff"/>

    <text x="219" y="420" font-size="10" fill="#5f6b7f">12000元</text>
    <text x="366" y="420" text-anchor="end" font-size="10" font-weight="700" fill="#c03434">+50%</text>
    <rect x="219" y="424" width="147" height="8" rx="4" fill="#edf2f7"/>
    <rect x="219" y="424" width="147" height="8" rx="4" fill="#fca5a5"/>

    <text x="219" y="444" font-size="9" fill="#5f6b7f">芯片短缺推高终端价格</text>

    <!-- Logic chain -->
    <rect x="12" y="468" width="366" height="146" rx="18" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="24" y="490" font-size="12" font-weight="700" fill="#172033">核心逻辑：存储涨价如何传导</text>

    <line x1="78" y1="524" x2="140" y2="524" stroke="#c7d2e0" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="168" y1="524" x2="230" y2="524" stroke="#c7d2e0" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="258" y1="524" x2="320" y2="524" stroke="#c7d2e0" stroke-width="2" marker-end="url(#arr)"/>

    <circle cx="64" cy="524" r="14" fill="#eef4ff" stroke="#8ab4ff" stroke-width="2"/>
    <text x="64" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#4b6cb7">1</text>
    <text x="64" y="552" text-anchor="middle" font-size="10" font-weight="700" fill="#172033">内存成本</text>
    <text x="64" y="566" text-anchor="middle" font-size="10" fill="#5f6b7f">飙升</text>

    <circle cx="154" cy="524" r="14" fill="#eef4ff" stroke="#8ab4ff" stroke-width="2"/>
    <text x="154" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#4b6cb7">2</text>
    <text x="154" y="552" text-anchor="middle" font-size="10" font-weight="700" fill="#172033">AI服务器</text>
    <text x="154" y="566" text-anchor="middle" font-size="10" fill="#5f6b7f">提价</text>

    <circle cx="244" cy="524" r="14" fill="#fff5f5" stroke="#fca5a5" stroke-width="2"/>
    <text x="244" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#c03434">3</text>
    <text x="244" y="552" text-anchor="middle" font-size="10" font-weight="700" fill="#172033">利润率</text>
    <text x="244" y="566" text-anchor="middle" font-size="10" fill="#5f6b7f">受审视</text>

    <circle cx="334" cy="524" r="14" fill="#f0fbf6" stroke="#86d7b6" stroke-width="2"/>
    <text x="334" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#2f855a">4</text>
    <text x="334" y="552" text-anchor="middle" font-size="10" font-weight="700" fill="#172033">自研与</text>
    <text x="334" y="566" text-anchor="middle" font-size="10" fill="#5f6b7f">供应博弈</text>

    <text x="195" y="594" text-anchor="middle" font-size="10" fill="#5f6b7f">DRAM容量决定芯片实际性能，内存制造商影响力上升</text>

    <!-- Watchpoints -->
    <rect x="12" y="620" width="366" height="158" rx="18" fill="#ffffff" stroke="#e2e8f2" filter="url(#soft)"/>
    <text x="24" y="642" font-size="12" font-weight="700" fill="#172033">市场关注</text>

    <circle cx="30" cy="660" r="3" fill="#fca5a5"/>
    <text x="42" y="664" font-size="11" font-weight="700" fill="#172033">下周财报：存储涨价是否侵蚀毛利率</text>

    <circle cx="30" cy="686" r="3" fill="#8ab4ff"/>
    <text x="42" y="690" font-size="11" fill="#172033">大型云厂商推进自研芯片，但仍高度依赖英伟达</text>

    <circle cx="30" cy="712" r="3" fill="#2f855a"/>
    <text x="42" y="716" font-size="11" font-weight="700" fill="#172033">挑战者关键：能否获得足够芯片供应</text>
    <text x="42" y="732" font-size="10" fill="#5f6b7f">三星 / SK海力士 / 美光</text>

    <circle cx="30" cy="748" r="3" fill="#f5a623"/>
    <text x="42" y="752" font-size="11" fill="#172033">更多终端厂商：苹果、高通等也因芯片短缺提价</text>

    <!-- Footer -->
    <rect x="12" y="784" width="366" height="52" rx="16" fill="#eef3f8" stroke="#e2e8f2"/>
    <text x="24" y="804" font-size="10" fill="#5f6b7f">信息图核心摘要</text>
    <text x="24" y="822" font-size="10" font-weight="700" fill="#172033">内存成本上升，服务器提价，利润率与替代进程成为焦点</text>
  </g>
</svg>