<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#EEF1F6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FA8B44"/>
      <stop offset="1" stop-color="#E2520D"/>
    </linearGradient>
    <linearGradient id="blu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB2FA"/>
      <stop offset="1" stop-color="#3B6EF5"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#16223B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- 顶部标签 -->
  <circle cx="27" cy="42" r="3" fill="#E2520D"/>
  <text x="37" y="46" font-size="11" fill="#8E9AAD" letter-spacing="0.5">财联社 · 8月23日</text>

  <!-- 标题 -->
  <text x="22" y="84" font-size="23" font-weight="700" fill="#16223B" letter-spacing="-0.2">英伟达服务器传出涨价</text>
  <text x="22" y="108" font-size="11.5" fill="#6B7789" letter-spacing="0.2">明年初起出货的系统将普遍提价</text>

  <!-- 核心卡片：涨幅 -->
  <rect x="22" y="124" width="346" height="104" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="44" y="182" font-size="48" font-weight="800" fill="url(#hot)">&gt;15%</text>
  <text x="44" y="208" font-size="11.5" fill="#8E9AAD" letter-spacing="0.3">服务器价格涨幅</text>
  <line x1="200" y1="148" x2="200" y2="202" stroke="#EEF1F6" stroke-width="1"/>
  <text x="216" y="168" font-size="11" fill="#3C4658">内存芯片成本飙升</text>
  <text x="216" y="190" font-size="11" fill="#3C4658">多家最大客户已接通知</text>

  <!-- 适用范围 -->
  <rect x="22" y="244" width="346" height="92" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="38" y="270" font-size="11" fill="#8E9AAD" letter-spacing="0.4">适用芯片组合</text>
  <rect x="38" y="280" width="84" height="26" rx="13" fill="#EAF0FE"/>
  <text x="80" y="297" font-size="11.5" font-weight="600" fill="#2F5BD0" text-anchor="middle">Vera Rubin</text>
  <rect x="130" y="280" width="118" height="26" rx="13" fill="#EAF0FE"/>
  <text x="189" y="297" font-size="11.5" font-weight="600" fill="#2F5BD0" text-anchor="middle">Grace Blackwell</text>
  <text x="38" y="324" font-size="11" fill="#6B7789">搭载上述芯片的服务器，明年初起陆续出货</text>

  <!-- 单台售价 -->
  <rect x="22" y="352" width="346" height="128" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="38" y="378" font-size="11" fill="#8E9AAD" letter-spacing="0.4">单台售价参考</text>

  <text x="38" y="406" font-size="12" fill="#3C4658">GB200 NVL72</text>
  <text x="352" y="406" font-size="12" font-weight="700" fill="#16223B" text-anchor="end">280–340 万美元</text>
  <rect x="38" y="416" width="314" height="9" rx="4.5" fill="#EFF2F7"/>
  <rect x="38" y="416" width="133" height="9" rx="4.5" fill="url(#blu)"/>

  <text x="38" y="450" font-size="12" fill="#3C4658">VR200 NVL72</text>
  <text x="352" y="450" font-size="12" font-weight="700" fill="#16223B" text-anchor="end">500–700 万美元</text>
  <rect x="38" y="460" width="314" height="9" rx="4.5" fill="#EFF2F7"/>
  <rect x="38" y="460" width="275" height="9" rx="4.5" fill="url(#blu)"/>

  <!-- 消费端 -->
  <rect x="22" y="496" width="346" height="88" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="38" y="522" font-size="11" fill="#8E9AAD" letter-spacing="0.4">消费端同步上涨 · RTX 5080 显卡 · 1 个月内</text>
  <text x="38" y="558" font-size="16" fill="#9AA5B8">8,000元</text>
  <text x="108" y="557" font-size="14" fill="#C3CBD9">→</text>
  <text x="136" y="559" font-size="21" font-weight="800" fill="url(#hot)">1.2万元</text>
  <rect x="298" y="533" width="54" height="24" rx="12" fill="#FDECE3"/>
  <text x="325" y="549" font-size="11" font-weight="700" fill="#E2520D" text-anchor="middle">+50%</text>

  <!-- 财报关注 -->
  <rect x="22" y="600" width="346" height="124" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="38" y="626" font-size="11" fill="#8E9AAD" letter-spacing="0.4">财报关注点</text>
  <text x="38" y="654" font-size="13" font-weight="700" fill="#16223B">下周三美股盘后发布最新财报</text>
  <rect x="38" y="666" width="106" height="26" rx="13" fill="#EAF0FE"/>
  <text x="91" y="683" font-size="11" font-weight="600" fill="#2F5BD0" text-anchor="middle">毛利率 75%</text>
  <rect x="152" y="666" width="148" height="26" rx="13" fill="#F2F4F8"/>
  <text x="226" y="683" font-size="11" font-weight="600" fill="#55607A" text-anchor="middle">上季营收 816 亿美元</text>
  <text x="38" y="712" font-size="11" fill="#E2520D">市场担忧：存储涨价是否侵蚀算力利润率</text>

  <!-- 底部结论 -->
  <rect x="22" y="740" width="346" height="72" rx="18" fill="#1E2A44"/>
  <text x="42" y="770" font-size="12.5" font-weight="700" fill="#FFFFFF">云厂商自研芯片动力增强</text>
  <text x="42" y="792" font-size="10.5" fill="#93A1BE">挑战者能否抓住机会，取决于三星、SK海力士、美光的供应</text>
</svg>