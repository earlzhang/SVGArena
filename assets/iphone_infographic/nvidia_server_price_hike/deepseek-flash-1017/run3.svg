<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8552D"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>
  </defs>

  <rect width="430" height="932" fill="#F4F6F9"/>
  <rect width="430" height="6" fill="url(#topbar)"/>

  <!-- 头部 -->
  <text x="24" y="46" font-size="11.5" fill="#9AA5B5" letter-spacing="0.6">财联社 · 8月23日 讯</text>
  <text x="24" y="84" font-size="24" font-weight="600" fill="#16202F">英伟达服务器传出涨价</text>
  <text x="24" y="116" font-size="20" font-weight="600" fill="#E8552D">涨幅“很多情况下超过15%”</text>

  <!-- 卡片1：核心数字 -->
  <rect x="24" y="136" width="382" height="104" rx="16" fill="#FFFFFF" stroke="#E9EDF3"/>
  <text x="48" y="198" font-size="42" font-weight="700" fill="#E8552D" letter-spacing="-0.5">&gt;15%</text>
  <text x="48" y="222" font-size="11" fill="#97A2B2">部分机型涨幅</text>
  <line x1="192" y1="158" x2="192" y2="222" stroke="#EFF2F7" stroke-width="1"/>
  <text x="212" y="172" font-size="12.5" fill="#16202F">多家“英伟达最大客户”</text>
  <text x="212" y="194" font-size="12.5" fill="#16202F">已被告知：将涨价</text>
  <text x="212" y="220" font-size="11" fill="#97A2B2">明年初起出货的系统</text>

  <!-- 卡片2：原因 -->
  <rect x="24" y="252" width="382" height="90" rx="16" fill="#FFFFFF" stroke="#E9EDF3"/>
  <text x="48" y="284" font-size="14.5" font-weight="600" fill="#16202F">内存芯片（DRAM）成本飙升</text>
  <text x="48" y="310" font-size="11.5" fill="#707C8E">为微软、谷歌、甲骨文等代工的服务器厂商</text>
  <text x="48" y="330" font-size="11.5" fill="#707C8E">已通知客户：价格即将上调</text>

  <!-- 卡片3：价格 -->
  <rect x="24" y="354" width="382" height="230" rx="16" fill="#FFFFFF" stroke="#E9EDF3"/>
  <text x="48" y="384" font-size="13" font-weight="600" fill="#16202F">AI 服务器整机报价</text>
  <text x="382" y="384" font-size="11" fill="#97A2B2" text-anchor="end">每台</text>

  <text x="48" y="412" font-size="11" fill="#7C8798">GB200 NVL72 · Blackwell 架构</text>
  <text x="48" y="438" font-size="20" font-weight="600" fill="#16202F">280–340 万美元</text>

  <text x="48" y="472" font-size="11" fill="#7C8798">VR200 NVL72 · Vera Rubin 架构</text>
  <text x="48" y="498" font-size="20" font-weight="600" fill="#E8552D">500–700 万美元</text>

  <line x1="48" y1="518" x2="382" y2="518" stroke="#EFF2F7" stroke-width="1"/>
  <text x="48" y="540" font-size="11" fill="#7C8798">消费级显卡同步跟涨</text>
  <text x="48" y="562" font-size="12.5" font-weight="600" fill="#16202F">RTX 5080：8000元 → 1.2万元 / 1个月</text>

  <!-- 卡片4：财报 -->
  <rect x="24" y="596" width="382" height="118" rx="16" fill="#FFFFFF" stroke="#E9EDF3"/>
  <text x="48" y="622" font-size="12.5" font-weight="600" fill="#16202F">下周三美股盘后 · 发布最新财报</text>
  <text x="48" y="654" font-size="22" font-weight="700" fill="#16202F">816<tspan font-size="11" font-weight="400" fill="#7C8798" dx="4">亿美元</tspan></text>
  <text x="48" y="674" font-size="10.5" fill="#97A2B2">上季营收</text>
  <text x="248" y="654" font-size="22" font-weight="700" fill="#E8552D">75%</text>
  <text x="248" y="674" font-size="10.5" fill="#97A2B2">毛利率</text>
  <text x="48" y="698" font-size="11" fill="#707C8E">市场关注：存储涨价是否会侵蚀利润率</text>

  <!-- 卡片5：连锁反应 -->
  <rect x="24" y="726" width="382" height="140" rx="16" fill="#FFFFFF" stroke="#E9EDF3"/>
  <text x="48" y="754" font-size="12.5" font-weight="600" fill="#16202F">连锁反应</text>

  <circle cx="50" cy="778" r="2.5" fill="#3D68B8"/>
  <text x="62" y="782" font-size="13" font-weight="600" fill="#16202F">云厂商加速自研芯片</text>
  <text x="62" y="802" font-size="11" fill="#7C8798">亚马逊、微软、谷歌、Meta 均在推进</text>

  <circle cx="50" cy="826" r="2.5" fill="#E8552D"/>
  <text x="62" y="830" font-size="13" font-weight="600" fill="#16202F">挑战者要抢到内存产能</text>
  <text x="62" y="850" font-size="11" fill="#7C8798">取决于三星、SK海力士、美光的供应</text>

  <!-- 页脚 -->
  <text x="24" y="898" font-size="10" fill="#A6B0BE">信息整理自公开报道 · 仅供参考</text>
</svg>