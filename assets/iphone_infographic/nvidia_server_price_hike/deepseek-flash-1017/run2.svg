<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','STHeiti',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="390" height="920" fill="#F4F7FB"/>
  <circle cx="378" cy="14" r="96" fill="#E4F0D2" opacity="0.55"/>
  <circle cx="8" cy="880" r="70" fill="#E7EEF8" opacity="0.7"/>

  <!-- 顶部标题 -->
  <text x="24" y="52" font-size="11" fill="#5C9E00" letter-spacing="1.2">财联社 · 8月23日 讯</text>
  <text x="24" y="88" font-size="24" font-weight="700" fill="#16202E">英伟达服务器涨价</text>
  <text x="24" y="114" font-size="14.5" font-weight="600" fill="#3F7A00">涨幅「很多情况下超过15%」</text>

  <!-- 核心卡片 -->
  <rect x="20" y="136" width="350" height="148" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="20" y="136" width="6" height="148" rx="3" fill="#8CC63F" opacity="0.9"/>
  <text x="40" y="170" font-size="10.5" fill="#7A8797" letter-spacing="0.5">部分机型涨幅</text>
  <text x="38" y="224" font-size="42" font-weight="700" fill="#5C9E00">&gt;15%</text>
  <text x="168" y="180" font-size="12.5" font-weight="700" fill="#16202E">多家最大客户已被告知</text>
  <text x="168" y="204" font-size="12" fill="#4A5568">内存芯片成本飙升，</text>
  <text x="168" y="226" font-size="12" fill="#4A5568">明年初起服务器普遍提价</text>

  <!-- 适用机型 -->
  <text x="24" y="316" font-size="11.5" fill="#7A8797">适用于明年年初出货的系统</text>
  <rect x="20" y="326" width="104" height="30" rx="15" fill="#EAF4DA"/>
  <text x="72" y="346" font-size="12" font-weight="600" fill="#3F7A00" text-anchor="middle">Vera Rubin</text>
  <rect x="132" y="326" width="152" height="30" rx="15" fill="#EAF4DA"/>
  <text x="208" y="346" font-size="12" font-weight="600" fill="#3F7A00" text-anchor="middle">Grace Blackwell</text>

  <!-- 单机架价格 -->
  <text x="24" y="382" font-size="11.5" fill="#7A8797">单机架售价参考</text>
  <rect x="20" y="394" width="350" height="128" rx="16" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="36" y="422" font-size="12" fill="#4A5568">GB200 NVL72</text>
  <text x="36" y="438" font-size="9.5" fill="#9AA5B4">基于 Blackwell 架构</text>
  <text x="354" y="430" font-size="16" font-weight="700" fill="#16202E" text-anchor="end">280–340万美元</text>
  <line x1="36" y1="454" x2="354" y2="454" stroke="#EDF1F6" stroke-width="1"/>
  <text x="36" y="478" font-size="12" fill="#4A5568">VR200 NVL72</text>
  <text x="36" y="494" font-size="9.5" fill="#9AA5B4">基于 Vera Rubin 架构 · 出货前询价</text>
  <text x="354" y="486" font-size="16" font-weight="700" fill="#5C9E00" text-anchor="end">500–700万美元</text>

  <!-- 消费显卡对照 -->
  <rect x="20" y="538" width="350" height="76" rx="16" fill="#FFF6EC"/>
  <text x="36" y="562" font-size="10.5" fill="#A1622F" letter-spacing="0.5">消费端同步 · 显卡刚刚涨过一轮</text>
  <text x="36" y="590" font-size="15" font-weight="700" fill="#C2410C">RTX 5080：8000元</text>
  <text x="184" y="590" font-size="15" fill="#C2410C">→</text>
  <text x="204" y="590" font-size="15" font-weight="700" fill="#C2410C">1.2万元</text>
  <text x="284" y="590" font-size="10.5" fill="#A1622F">仅1个月</text>

  <!-- 财报 -->
  <text x="24" y="644" font-size="11.5" fill="#7A8797">下周财报 · 存储涨价会侵蚀利润率吗</text>
  <rect x="20" y="656" width="350" height="118" rx="16" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="36" y="684" font-size="12.5" font-weight="700" fill="#16202E">下周三 美股盘后发布财报</text>

  <text x="36" y="720" font-size="15" font-weight="700" fill="#16202E">816亿</text>
  <text x="36" y="738" font-size="10" fill="#7A8797">上季度营收(美元)</text>

  <text x="152" y="720" font-size="15" font-weight="700" fill="#16202E">约75%</text>
  <text x="152" y="738" font-size="10" fill="#7A8797">当前毛利率</text>

  <text x="268" y="720" font-size="15" font-weight="700" fill="#5C9E00">74.9–75%</text>
  <text x="268" y="738" font-size="10" fill="#7A8797">Q2毛利率指引</text>

  <!-- 连锁反应 -->
  <text x="24" y="798" font-size="11.5" fill="#7A8797">连锁反应</text>
  <rect x="20" y="810" width="350" height="88" rx="16" fill="#EDF6E0"/>
  <text x="36" y="836" font-size="12.5" font-weight="700" fill="#3F7A00">服务器再涨价 → 云厂商加速自研芯片</text>
  <text x="36" y="860" font-size="11" fill="#4A5568">亚马逊、微软、谷歌、Meta 均在推进内部芯片项目</text>
  <text x="36" y="880" font-size="11" fill="#4A5568">但英伟达软件生态「护城河」仍在，短期难替代</text>

  <!-- 底部 -->
  <text x="195" y="906" font-size="9.5" fill="#9AA5B4" text-anchor="middle">来源：财联社 · 编辑 史正丞</text>
</svg>