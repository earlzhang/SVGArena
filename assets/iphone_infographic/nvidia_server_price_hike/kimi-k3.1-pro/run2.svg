<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">英伟达服务器涨价核心信息图</title>
  <desc id="svgDesc">内存成本飙升推动英伟达人工智能服务器明年初提价，很多情况下涨幅超过百分之十五；市场同时关注下周财报中的利润率表现。</desc>
  <defs>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EA6F4"/>
      <stop offset="100%" stop-color="#426FDB"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6B38E"/>
      <stop offset="100%" stop-color="#ED7050"/>
    </linearGradient>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "STHeiti"; fill: #19263D; }
      .card { fill: #FFFFFF; stroke: #E5EAF2; stroke-width: 1; }
      .section { font-size: 13.5px; font-weight: 700; }
      .body { font-size: 11px; fill: #5E6C82; }
      .small { font-size: 9.5px; fill: #8995A7; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F6F8FC"/>
  <circle cx="371" cy="20" r="78" fill="#E9F0FF" opacity="0.72"/>
  <circle cx="354" cy="4" r="39" fill="#F0EDFF" opacity="0.7"/>
  <circle cx="377" cy="105" r="25" fill="#FFF0E9" opacity="0.75"/>

  <!-- 标题 -->
  <rect x="20" y="20" width="92" height="22" rx="11" fill="#E8F0FF"/>
  <circle cx="31" cy="31" r="3" fill="#4B78DE"/>
  <text x="40" y="35" font-size="10.5" font-weight="600" fill="#3969C9">供应链消息</text>
  <text x="370" y="35" text-anchor="end" font-size="10" fill="#748196">财联社 · 8月23日</text>

  <text x="20" y="70" font-size="22" font-weight="700">英伟达服务器传出涨价消息</text>
  <text x="20" y="100" font-size="22" font-weight="700">很多情况下，涨幅<tspan fill="#EB6448">超过 15%</tspan></text>
  <text x="20" y="120" font-size="11" fill="#66748A">内存芯片成本飙升，涨价的风吹向 AI 服务器</text>

  <!-- 涨幅与传导 -->
  <rect class="card" x="16" y="134" width="358" height="154" rx="18"/>
  <text x="30" y="158" font-size="11.5" font-weight="600" fill="#4C5A71">AI 服务器将普遍提价</text>
  <text x="29" y="208" font-size="42" font-weight="700" fill="#EB6448">&gt;15%</text>
  <text x="31" y="229" font-size="10.5" fill="#7A879A">很多情况下的涨幅</text>
  <line x1="176" y1="153" x2="176" y2="228" stroke="#EDF0F5"/>

  <text x="192" y="158" font-size="10.5" font-weight="600" fill="#7A879A">涨价传导</text>

  <!-- 内存芯片图标 -->
  <rect x="194" y="172" width="36" height="34" rx="7" fill="#EEF3FF" stroke="#C5D4F4"/>
  <rect x="202" y="179" width="20" height="20" rx="3" fill="none" stroke="#527CD8"/>
  <text x="212" y="192.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#527CD8">DRAM</text>
  <path d="M190 179h4M190 189h4M190 199h4M230 179h4M230 189h4M230 199h4M202 168v4M212 168v4M222 168v4M202 206v4M212 206v4M222 206v4" stroke="#9BB4E7" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 箭头与服务器图标 -->
  <path d="M240 189h35M270 184l6 5-6 5" fill="none" stroke="#E58A72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="291" y="172" width="43" height="35" rx="6" fill="#FFF2ED" stroke="#F0B9A8"/>
  <line x1="296" y1="183" x2="329" y2="183" stroke="#E9A18B"/>
  <line x1="296" y1="195" x2="329" y2="195" stroke="#E9A18B"/>
  <circle cx="299" cy="178" r="1.5" fill="#E97958"/>
  <circle cx="299" cy="190" r="1.5" fill="#E97958"/>
  <circle cx="299" cy="201" r="1.5" fill="#E97958"/>
  <text x="212" y="222" text-anchor="middle" font-size="10.5" fill="#536177">内存成本↑</text>
  <text x="313" y="222" text-anchor="middle" font-size="10.5" fill="#536177">服务器价格↑</text>

  <line x1="30" y1="241" x2="360" y2="241" stroke="#EDF0F5"/>
  <rect x="30" y="251" width="80" height="25" rx="7" fill="#F1F4F9"/>
  <text x="70" y="267" text-anchor="middle" font-size="10" font-weight="600" fill="#5B6980">明年初出货</text>
  <rect x="118" y="251" width="90" height="25" rx="7" fill="#EEF3FF"/>
  <text x="163" y="267" text-anchor="middle" font-size="10" font-weight="600" fill="#4C70C4">Vera Rubin</text>
  <rect x="216" y="251" width="130" height="25" rx="7" fill="#EEF3FF"/>
  <text x="281" y="267" text-anchor="middle" font-size="9.8" font-weight="600" fill="#4C70C4">Grace Blackwell</text>

  <!-- 单套系统价格 -->
  <rect class="card" x="16" y="300" width="358" height="164" rx="18"/>
  <text class="section" x="30" y="324">百分比之外，是巨额额外开销</text>
  <text x="30" y="347" font-size="11.2" fill="#66748A">即便只涨 <tspan fill="#EB6448" font-weight="700">15%</tspan>，也可能多花近百万美元</text>

  <text x="30" y="374" font-size="11.2" font-weight="600">NVL72 GB200</text>
  <text x="344" y="374" text-anchor="end" font-size="11.2" font-weight="600">280–340 万美元</text>
  <rect x="30" y="382" width="314" height="8" rx="4" fill="#EDF1F7"/>
  <rect x="30" y="382" width="153" height="8" rx="4" fill="url(#blueBar)"/>

  <text x="30" y="413" font-size="11.2" font-weight="600">NVL72 VR200</text>
  <text x="344" y="413" text-anchor="end" font-size="11.2" font-weight="600">500–700 万美元</text>
  <rect x="30" y="421" width="314" height="8" rx="4" fill="#EDF1F7"/>
  <rect x="30" y="421" width="314" height="8" rx="4" fill="url(#orangeBar)"/>

  <text class="small" x="30" y="451">按报价区间上限对比 · 单套系统</text>

  <!-- 财报与利润率 -->
  <rect class="card" x="16" y="476" width="358" height="142" rx="18"/>
  <text class="section" x="30" y="501">下周财报，聚焦利润率</text>
  <rect x="236" y="486" width="110" height="22" rx="11" fill="#EEF3FF"/>
  <text x="291" y="500.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A6FC2">下周三 · 美股盘后</text>

  <circle cx="64" cy="554" r="27" fill="none" stroke="#E7F1EF" stroke-width="7"/>
  <circle cx="64" cy="554" r="27" fill="none" stroke="#24A38B" stroke-width="7" stroke-linecap="round" stroke-dasharray="127.2 169.7" transform="rotate(-90 64 554)"/>
  <text x="64" y="557" text-anchor="middle" font-size="14.5" font-weight="700" fill="#178B76">≈75%</text>
  <text x="64" y="573" text-anchor="middle" font-size="8.5" fill="#6F7E90">毛利率</text>

  <text x="108" y="545" font-size="17.5" font-weight="700">816 亿美元</text>
  <text x="108" y="562" font-size="9.5" fill="#8491A3">最近季度营收</text>
  <line x1="222" y1="528" x2="222" y2="568" stroke="#EDF0F5"/>
  <text x="238" y="545" font-size="14.2" font-weight="700">74.9%–75%</text>
  <text x="238" y="562" font-size="9.5" fill="#8491A3">第二财季毛利率指引</text>

  <rect x="30" y="586" width="314" height="22" rx="8" fill="#F1F5FC"/>
  <circle cx="40" cy="597" r="3" fill="#597FD4"/>
  <text x="50" y="601" font-size="10.5" fill="#4E5E76">市场焦点：存储涨价会否侵蚀利润率？</text>

  <!-- 连锁反应 -->
  <rect class="card" x="16" y="630" width="358" height="174" rx="18"/>
  <text class="section" x="30" y="654">连锁反应：DRAM 成关键变量</text>
  <text x="30" y="674" font-size="10.5" fill="#748196">AI 算力争抢，让大宗存储芯片获得更强议价权</text>

  <circle cx="40" cy="697" r="11" fill="#EAF1FF"/>
  <text x="40" y="701" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4D73CA">云</text>
  <text x="60" y="701" font-size="11.5" font-weight="700">云厂商</text>
  <text x="116" y="701" font-size="10.5" fill="#637188">自研芯片动力增强</text>
  <line x1="60" y1="714" x2="344" y2="714" stroke="#F0F2F6"/>

  <circle cx="40" cy="733" r="11" fill="#E9F7F3"/>
  <text x="40" y="737" text-anchor="middle" font-size="10.5" font-weight="700" fill="#218F7B">盾</text>
  <text x="60" y="737" font-size="11.5" font-weight="700">英伟达</text>
  <text x="116" y="737" font-size="10.5" fill="#637188">软件护城河仍在，采购依赖短期难改</text>
  <line x1="60" y1="750" x2="344" y2="750" stroke="#F0F2F6"/>

  <circle cx="40" cy="769" r="11" fill="#FFF0E9"/>
  <text x="40" y="773" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DF704F">供</text>
  <text x="60" y="773" font-size="11.5" font-weight="700">挑战者</text>
  <text x="116" y="773" font-size="10.5" fill="#637188">能否突围，取决于 DRAM 供应</text>

  <text x="30" y="792" font-size="9.5" fill="#8995A7">核心内存供应：三星 · SK海力士 · 美光</text>

  <text x="20" y="825" font-size="9.2" fill="#939EAD">注：涨价为媒体援引知情人士消息，实际幅度因芯片与内存配置而异。</text>
</svg>