<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto" font-family="'PingFang SC','Hiragino Sans GB','STHeiti','Heiti SC',sans-serif" fill="#18251F" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">英伟达服务器涨价信息图</title>
  <desc id="svgDesc">内存芯片成本飙升推动英伟达人工智能服务器提价，很多情况下涨幅超过15%，明年初出货系统起适用。市场关注下周财报及存储涨价对利润率的影响。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBF8"/>
      <stop offset="1" stop-color="#F2F6F4"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF7F0"/>
    </linearGradient>
    <linearGradient id="ringColor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78B92A"/>
      <stop offset="1" stop-color="#128A62"/>
    </linearGradient>
    <radialGradient id="topGlow">
      <stop offset="0" stop-color="#DDEFE2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DDEFE2" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#173D2C" flood-opacity="0.055"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="358" cy="52" r="112" fill="url(#topGlow)"/>
  <circle cx="374" cy="804" r="92" fill="#EAF2ED" opacity="0.45"/>

  <!-- 顶部信息 -->
  <rect x="20" y="22" width="66" height="22" rx="11" fill="#E4F2E9"/>
  <text x="53" y="37" text-anchor="middle" font-size="10.5" font-weight="600" fill="#157A55">市场快讯</text>
  <text x="370" y="37" text-anchor="end" font-size="10.5" fill="#748179">财联社 · 8月23日</text>

  <text x="20" y="73" font-size="24" font-weight="700" letter-spacing="-0.3">英伟达服务器传出涨价消息</text>
  <text x="20" y="96" font-size="11.5" fill="#6E7B74">存储成本飙升，涨价风终于吹到 AI 服务器</text>

  <!-- 核心涨幅 -->
  <rect x="20" y="112" width="350" height="174" rx="18" fill="url(#heroBg)" stroke="#E1EAE4" filter="url(#cardShadow)"/>

  <rect x="34" y="126" width="134" height="20" rx="10" fill="#E3F1E8"/>
  <text x="101" y="140" text-anchor="middle" font-size="10.2" font-weight="600" fill="#187B56">明年初起 · 新出货系统</text>
  <text x="356" y="140" text-anchor="end" font-size="10" fill="#6D7B73">多家大型客户已获通知</text>

  <text x="34" y="163" font-size="11.5" fill="#65736B">很多情况下，服务器涨幅</text>
  <text x="32" y="216" font-size="48" font-weight="700" fill="#13855B" letter-spacing="-1.5">&gt;15%</text>

  <!-- 服务器与上涨箭头 -->
  <circle cx="298" cy="184" r="43" fill="#E4F2E9"/>
  <path d="M258 207 L275 190 L287 195 L322 154" fill="none" stroke="#E47D45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 154 H322 V164" fill="none" stroke="#E47D45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="285" y="162" width="45" height="58" rx="7" fill="#FFFFFF" stroke="#8DBAA0" stroke-width="1.2"/>
  <rect x="291" y="171" width="33" height="10" rx="2.5" fill="#E2F0E7"/>
  <rect x="291" y="187" width="33" height="10" rx="2.5" fill="#E2F0E7"/>
  <rect x="291" y="203" width="33" height="10" rx="2.5" fill="#E2F0E7"/>
  <circle cx="296" cy="176" r="1.5" fill="#2B9A6B"/>
  <circle cx="296" cy="192" r="1.5" fill="#2B9A6B"/>
  <circle cx="296" cy="208" r="1.5" fill="#E47D45"/>
  <path d="M302 176 H318 M302 192 H318 M302 208 H318" stroke="#9AB6A5" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 原因与平台 -->
  <rect x="32" y="231" width="326" height="42" rx="10" fill="#F4F8F5"/>
  <text x="44" y="248" font-size="10.5">
    <tspan fill="#7A8780">主因　</tspan>
    <tspan font-weight="600" fill="#26352D">内存芯片（DRAM）成本飙升</tspan>
  </text>
  <text x="44" y="265" font-size="10.2">
    <tspan fill="#7A8780">平台　</tspan>
    <tspan font-weight="600" fill="#187B56">Vera Rubin / Grace Blackwell</tspan>
  </text>
  <text x="346" y="265" text-anchor="end" font-size="9.2" fill="#839088">涨幅因配置而异</text>

  <!-- 价格影响 -->
  <rect x="20" y="304" width="4" height="14" rx="2" fill="#18875D"/>
  <text x="31" y="316" font-size="14" font-weight="700">数百万美元系统，再贵一截</text>
  <text x="370" y="316" text-anchor="end" font-size="10" fill="#7C8981">单机报价 / 询价</text>

  <rect x="20" y="328" width="350" height="126" rx="16" fill="#FFFFFF" stroke="#E6ECE8" filter="url(#cardShadow)"/>
  <line x1="194" y1="346" x2="194" y2="402" stroke="#E8EDE9"/>

  <text x="34" y="352" font-size="10.5" font-weight="600" fill="#4C5B53">GB200 · NVL72</text>
  <text x="34" y="383">
    <tspan font-size="22" font-weight="700">280–340</tspan>
    <tspan font-size="10.5" font-weight="600" fill="#536159"> 万美元</tspan>
  </text>
  <text x="34" y="403" font-size="10" fill="#7B8880">Blackwell · 今年早前报价</text>

  <text x="208" y="352" font-size="10.5" font-weight="600" fill="#4C5B53">VR200 · NVL72</text>
  <text x="208" y="383">
    <tspan font-size="22" font-weight="700" fill="#137F57">500–700</tspan>
    <tspan font-size="10.5" font-weight="600" fill="#536159"> 万美元</tspan>
  </text>
  <text x="208" y="403" font-size="10" fill="#7B8880">Vera Rubin · 出货前询价</text>

  <rect x="32" y="414" width="326" height="28" rx="9" fill="#FFF4EA"/>
  <text x="195" y="432" text-anchor="middle" font-size="10.4" font-weight="500" fill="#A75E31">即便 +15%，也可能增加数十万至近百万美元成本</text>

  <!-- 财报与利润率 -->
  <rect x="20" y="472" width="4" height="14" rx="2" fill="#18875D"/>
  <text x="31" y="484" font-size="14" font-weight="700">下周财报：存储会侵蚀利润率吗？</text>

  <rect x="20" y="496" width="350" height="158" rx="16" fill="#FFFFFF" stroke="#E6ECE8" filter="url(#cardShadow)"/>
  <rect x="34" y="510" width="124" height="20" rx="10" fill="#EAF3EE"/>
  <text x="96" y="524" text-anchor="middle" font-size="10.3" font-weight="600" fill="#187B56">下周三 · 美股盘后</text>
  <text x="342" y="524" text-anchor="end" font-size="10" fill="#B16A3B">市场紧盯毛利率</text>

  <!-- 毛利率圆环 -->
  <circle cx="78" cy="582" r="31" fill="none" stroke="#E8EFEA" stroke-width="7"/>
  <circle cx="78" cy="582" r="31" fill="none" stroke="url(#ringColor)" stroke-width="7" stroke-linecap="round" stroke-dasharray="146.1 194.8" transform="rotate(-90 78 582)"/>
  <text x="78" y="588" text-anchor="middle" font-size="17.5" font-weight="700" fill="#147E57">约75%</text>
  <text x="78" y="639" text-anchor="middle" font-size="10" fill="#748179">最新季度毛利率</text>

  <!-- 财务数据 -->
  <text x="132" y="549" font-size="10" fill="#7A8780">上季营收｜截至 4 月 26 日的三个月</text>
  <text x="132" y="575">
    <tspan font-size="23" font-weight="700">816</tspan>
    <tspan font-size="12" font-weight="600" fill="#536159"> 亿美元</tspan>
  </text>
  <line x1="132" y1="588" x2="342" y2="588" stroke="#EBEFEC"/>

  <text x="132" y="609" font-size="10.5" fill="#748179">上年同期毛利率</text>
  <text x="342" y="609" text-anchor="end" font-size="11.5" font-weight="600">60.5%</text>

  <text x="132" y="631" font-size="10.5" fill="#748179">本财季毛利率指引</text>
  <text x="342" y="631" text-anchor="end" font-size="11.5" font-weight="600" fill="#157F58">74.9%–75%</text>

  <!-- 产业链影响 -->
  <rect x="20" y="672" width="4" height="14" rx="2" fill="#18875D"/>
  <text x="31" y="684" font-size="14" font-weight="700">DRAM 容量影响 AI 性能，存储成新瓶颈</text>

  <rect x="20" y="696" width="350" height="116" rx="16" fill="#FFFFFF" stroke="#E6ECE8"/>

  <!-- 传导路径 -->
  <rect x="32" y="709" width="90" height="26" rx="8" fill="#F0F4F2"/>
  <text x="77" y="727" text-anchor="middle" font-size="10.5" font-weight="600" fill="#53655B">AI 算力争抢</text>
  <path d="M127 722 H138 M134 718 L138 722 L134 726" fill="none" stroke="#A6B2AA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="143" y="709" width="90" height="26" rx="8" fill="#FFF3E8"/>
  <text x="188" y="727" text-anchor="middle" font-size="10.2" font-weight="600" fill="#AA6738">DRAM 紧缺涨价</text>
  <path d="M238 722 H249 M245 718 L249 722 L245 726" fill="none" stroke="#A6B2AA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="254" y="709" width="102" height="26" rx="8" fill="#E8F4EC"/>
  <text x="305" y="727" text-anchor="middle" font-size="10.5" font-weight="600" fill="#197A55">服务器再提价</text>

  <line x1="194" y1="748" x2="194" y2="800" stroke="#E8EDE9"/>

  <!-- 两类产业影响 -->
  <text x="34" y="762" font-size="10.5" font-weight="700" fill="#187B56">云厂商｜自研芯片提速</text>
  <text x="34" y="781" font-size="10" fill="#68766E">但短期仍高度依赖</text>
  <text x="34" y="799" font-size="10" fill="#68766E">英伟达软件生态“护城河”</text>

  <text x="208" y="762" font-size="10.5" font-weight="700" fill="#A66336">挑战者｜供应成关键</text>
  <text x="208" y="781" font-size="10" fill="#68766E">三星 / SK海力士 / 美光</text>
  <text x="208" y="799" font-size="10" fill="#68766E">能否获得足够 DRAM 供应</text>

  <!-- 来源 -->
  <text x="20" y="831" font-size="9" fill="#8A958E">来源：财联社报道　·　价格为报价 / 询价，实际涨幅因配置而异</text>
</svg>