<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">英伟达服务器传出涨价消息，很多情况下涨幅超过15%</title>
  <desc id="svgDesc">信息图展示涨价原因、适用系统、NVL72价格、财报利润率焦点及产业链影响。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F7EC"/>
      <stop offset="0.36" stop-color="#F7F9F6"/>
      <stop offset="1" stop-color="#F4F7FA"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F6E7"/>
    </linearGradient>
    <linearGradient id="priceBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5C96B"/>
      <stop offset="1" stop-color="#649D46"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#689A35"/>
    </marker>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="367" cy="72" r="76" fill="#E6F0D9" opacity="0.65"/>
  <circle cx="-18" cy="790" r="72" fill="#EAF1F5" opacity="0.7"/>

  <g font-family="PingFang SC, Hiragino Sans GB, STHeiti" fill="#17251F">
    <!-- 顶部与标题 -->
    <rect x="20" y="14" width="36" height="18" rx="9" fill="#E1EDCE"/>
    <text x="38" y="27" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5D8730">快讯</text>
    <text x="64" y="27" font-size="10.5" fill="#718078">财联社 · 8月23日</text>
    <text x="370" y="27" text-anchor="end" font-size="10.5" fill="#718078">AI 服务器供应链</text>

    <text x="20" y="59" font-size="25" font-weight="700" letter-spacing="0.5">英伟达服务器</text>
    <text x="20" y="88" font-size="25" font-weight="700" letter-spacing="0.5">传出涨价消息</text>

    <!-- 核心涨幅 -->
    <rect x="16" y="102" width="358" height="142" rx="20" fill="url(#hero)" stroke="#DDE7D6"/>
    <text x="32" y="128" font-size="12" font-weight="500" fill="#52645A">很多情况下 · 服务器涨幅</text>
    <text x="30" y="184" font-size="52" font-weight="700" fill="#5E9100" letter-spacing="-1">&gt;15%</text>
    <text x="32" y="213" font-size="11.5" font-weight="600" fill="#30473A">明年初出货起 · 普遍提价</text>
    <text x="32" y="233" font-size="10.5" fill="#738078">涨幅由芯片与内存配置决定</text>

    <rect x="234" y="116" width="104" height="20" rx="10" fill="#E5EFD8"/>
    <text x="286" y="130" text-anchor="middle" font-size="10" font-weight="500" fill="#648442">存储成本推动</text>
    <line x1="218" y1="190" x2="334" y2="190" stroke="#DCE5D6"/>
    <rect x="222" y="172" width="18" height="18" rx="4" fill="#D7E7C0"/>
    <rect x="249" y="159" width="18" height="31" rx="4" fill="#B7D38D"/>
    <rect x="276" y="145" width="18" height="45" rx="4" fill="#8DB659"/>
    <path d="M218 181C248 179 277 155 326 143" fill="none" stroke="#689A35" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="218" y="204" font-size="9.5" fill="#7A877E">适用芯片组合</text>
    <text x="218" y="220" font-size="10.5" font-weight="600" fill="#40564A">Vera Rubin</text>
    <text x="218" y="236" font-size="10.5" font-weight="600" fill="#40564A">Grace Blackwell</text>

    <!-- 涨价根源 -->
    <rect x="16" y="257" width="4" height="14" rx="2" fill="#76A842"/>
    <text x="28" y="269" font-size="14" font-weight="700">涨价的根源</text>
    <text x="370" y="269" text-anchor="end" font-size="10.5" fill="#7B8880">DRAM → 服务器</text>

    <rect x="16" y="280" width="358" height="106" rx="16" fill="#FFFFFF" stroke="#E4EAE5"/>
    <rect x="34" y="300" width="34" height="34" rx="7" fill="#FFF2E6" stroke="#E8C6A6"/>
    <rect x="43" y="309" width="16" height="16" rx="3" fill="none" stroke="#C77A3C" stroke-width="1.4"/>
    <path d="M42 296V300M51 296V300M60 296V300M42 334V338M51 334V338M60 334V338M30 308H34M30 317H34M30 326H34M68 308H72M68 317H72M68 326H72" stroke="#D39A69" stroke-width="1.5" stroke-linecap="round"/>
    <text x="84" y="307" font-size="13.5" font-weight="700">内存芯片成本飙升</text>
    <text x="84" y="328" font-size="11" fill="#5E6C64">AI 芯片性能高度依赖配套 DRAM</text>
    <text x="84" y="347" font-size="11" fill="#5E6C64">算力争抢推升存储价格，成本传导至整机</text>
    <circle cx="34" cy="370" r="3" fill="#D88C4A"/>
    <text x="44" y="374" font-size="10.2" fill="#758078">服务微软、谷歌、甲骨文等的代工厂，已通知客户调价</text>

    <!-- 系统价格 -->
    <rect x="16" y="399" width="4" height="14" rx="2" fill="#76A842"/>
    <text x="28" y="411" font-size="14" font-weight="700">高价系统，再抬成本</text>
    <text x="370" y="411" text-anchor="end" font-size="10" fill="#7B8880">NVL72｜万美元 / 台</text>

    <rect x="16" y="423" width="358" height="132" rx="16" fill="#FFFFFF" stroke="#E4EAE5"/>
    <text x="32" y="450" font-size="12" font-weight="700">GB200</text>
    <text x="88" y="450" font-size="9.5" fill="#849087">Blackwell · 此前报价</text>
    <text x="338" y="450" text-anchor="end" font-size="14" font-weight="700" fill="#40564A">280–340</text>
    <rect x="32" y="461" width="306" height="9" rx="4.5" fill="#EDF1EE"/>
    <rect x="32" y="461" width="149" height="9" rx="4.5" fill="#A8B9AF"/>

    <text x="32" y="497" font-size="12" font-weight="700">VR200</text>
    <text x="88" y="497" font-size="9.5" fill="#849087">Vera Rubin · 出货前询价</text>
    <text x="338" y="497" text-anchor="end" font-size="14" font-weight="700" fill="#5E9100">500–700</text>
    <rect x="32" y="508" width="306" height="9" rx="4.5" fill="#EDF1EE"/>
    <rect x="32" y="508" width="306" height="9" rx="4.5" fill="url(#priceBar)"/>

    <rect x="32" y="529" width="3" height="14" rx="1.5" fill="#D99A5C"/>
    <text x="42" y="540" font-size="10.2" fill="#69766E">15% 也可能意味着数十万至近百万美元的额外开销</text>

    <!-- 财报焦点 -->
    <rect x="16" y="568" width="4" height="14" rx="2" fill="#76A842"/>
    <text x="28" y="580" font-size="14" font-weight="700">下周财报，聚焦利润率</text>
    <text x="370" y="580" text-anchor="end" font-size="10.5" font-weight="500" fill="#668148">下周三 · 美股盘后</text>

    <rect x="16" y="592" width="358" height="132" rx="16" fill="#FFFFFF" stroke="#E4EAE5"/>
    <text x="32" y="618" font-size="10.5" fill="#7B8880">上一财季毛利率</text>
    <text x="30" y="657" font-size="34" font-weight="700" fill="#5E9100">≈75%</text>
    <text x="32" y="677" font-size="10" fill="#7B8880">上年同期 60.5%</text>
    <text x="32" y="700" font-size="9.5" fill="#7B8880">本季指引 74.9%–75%</text>

    <line x1="158" y1="612" x2="158" y2="705" stroke="#E7ECE8"/>
    <text x="176" y="619" font-size="10.5" fill="#7B8880">上一财季营收</text>
    <text x="176" y="645" font-size="20" font-weight="700">816 亿美元</text>
    <text x="176" y="671" font-size="10.5" font-weight="600" fill="#68894B">市场追问</text>
    <text x="176" y="690" font-size="11.5" font-weight="600" fill="#40564A">存储涨价会否侵蚀</text>
    <text x="176" y="709" font-size="11.5" font-weight="600" fill="#40564A">算力芯片龙头的利润率？</text>

    <!-- 产业影响 -->
    <rect x="16" y="737" width="4" height="14" rx="2" fill="#76A842"/>
    <text x="28" y="749" font-size="13" font-weight="700">产业链的下一步</text>

    <rect x="16" y="758" width="358" height="58" rx="14" fill="#EDF4E6" stroke="#DEE8D5"/>
    <circle cx="33" cy="775" r="3" fill="#76A842"/>
    <text x="43" y="779" font-size="11" font-weight="600" fill="#364C3E">云厂商自研芯片的动力增强</text>
    <circle cx="33" cy="797" r="3" fill="#9AAE9F"/>
    <text x="43" y="801" font-size="10.5" fill="#5F7065">短期仍依赖英伟达生态；挑战者受制于存储供应</text>

    <text x="20" y="833" font-size="9" fill="#929D96">来源：财联社 8月23日讯｜编辑：史正丞</text>
    <text x="370" y="833" text-anchor="end" font-size="8.5" fill="#A0AAA4">核心信息整理</text>
  </g>
</svg>