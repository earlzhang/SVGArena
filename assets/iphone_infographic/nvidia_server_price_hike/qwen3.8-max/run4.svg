<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="英伟达服务器涨价信息图">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F2DC"/>
      <stop offset="1" stop-color="#F5F8F2"/>
    </linearGradient>
    <linearGradient id="gBar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9D375"/>
      <stop offset="1" stop-color="#76B900"/>
    </linearGradient>
    <linearGradient id="gBar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6C552"/>
      <stop offset="1" stop-color="#EC9A0C"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#41601F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','STHeiti',sans-serif">

    <!-- 底色 -->
    <rect x="0" y="0" width="390" height="844" fill="#F5F8F2"/>
    <rect x="0" y="0" width="390" height="118" fill="url(#gTop)"/>
    <circle cx="355" cy="-10" r="70" fill="#76B900" opacity="0.07"/>
    <circle cx="298" cy="42" r="24" fill="#76B900" opacity="0.05"/>

    <!-- 顶部标签 -->
    <rect x="18" y="20" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#D9E6D2"/>
    <text x="70" y="35" text-anchor="middle" font-size="10.5" fill="#5A6B54">财联社 · 8月23日</text>
    <rect x="284" y="20" width="88" height="22" rx="11" fill="#76B900" opacity="0.14"/>
    <text x="328" y="35" text-anchor="middle" font-size="10.5" fill="#4C7A0B" font-weight="600">AI 硬件观察</text>

    <!-- 标题 -->
    <text x="18" y="74" font-size="23" font-weight="700" fill="#1C2A18">英伟达服务器传出涨价</text>
    <text x="18" y="104" font-size="15" fill="#4A5540">涨幅很多情况下超过<tspan dx="4" font-size="27" font-weight="700" fill="#3E7C0A">15%</tspan><tspan dx="3" font-size="15" font-weight="600" fill="#3E7C0A">以上</tspan></text>
    <polygon points="266,103 280,103 273,89" fill="#3E7C0A" opacity="0.9"/>

    <!-- 芯片小图标 -->
    <g stroke="#A8CE6F" stroke-width="2" stroke-linecap="round">
      <line x1="326" y1="46" x2="326" y2="50"/><line x1="334" y1="46" x2="334" y2="50"/><line x1="342" y1="46" x2="342" y2="50"/>
      <line x1="326" y1="86" x2="326" y2="90"/><line x1="334" y1="86" x2="334" y2="90"/><line x1="342" y1="86" x2="342" y2="90"/>
      <line x1="312" y1="58" x2="316" y2="58"/><line x1="312" y1="66" x2="316" y2="66"/><line x1="312" y1="74" x2="316" y2="74"/>
      <line x1="352" y1="58" x2="356" y2="58"/><line x1="352" y1="66" x2="356" y2="66"/><line x1="352" y1="74" x2="356" y2="74"/>
    </g>
    <rect x="316" y="50" width="36" height="36" rx="7" fill="#FFFFFF" stroke="#A8CE6F" stroke-width="1.5"/>
    <rect x="328" y="62" width="12" height="12" rx="2" fill="#76B900"/>

    <!-- 核心要点 ① -->
    <rect x="16" y="128" width="358" height="72" rx="14" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <circle cx="42" cy="164" r="13" fill="#76B900"/>
    <text x="42" y="168.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
    <text x="64" y="158" font-size="12" fill="#333F2E">明年初起，搭载 Vera Rubin、Grace</text>
    <text x="64" y="178" font-size="12" fill="#333F2E">Blackwell 芯片的服务器普遍提价，部分超 <tspan font-weight="700" fill="#3E7C0A">15%</tspan></text>

    <!-- 核心要点 ② -->
    <rect x="16" y="208" width="358" height="72" rx="14" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <circle cx="42" cy="244" r="13" fill="#E8A020"/>
    <text x="42" y="248.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
    <text x="64" y="238" font-size="12" fill="#333F2E">英伟达定档下周三（美股盘后）发布最新财报</text>
    <text x="64" y="258" font-size="12" fill="#333F2E">市场关注：存储涨价是否侵蚀算力龙头利润率</text>

    <!-- 涨价逻辑 -->
    <rect x="18" y="295" width="4" height="13" rx="2" fill="#76B900"/>
    <text x="28" y="306" font-size="13" font-weight="700" fill="#22301F">这一轮为什么涨？</text>
    <rect x="16" y="316" width="358" height="86" rx="14" fill="#FCF6E8" stroke="#F0E1BC" filter="url(#s)"/>
    <rect x="30" y="328" width="132" height="46" rx="10" fill="#FFFFFF" stroke="#EAD9AE"/>
    <text x="96" y="347" text-anchor="middle" font-size="11" fill="#6C7763">内存芯片 DRAM</text>
    <text x="96" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#B4520A">成本飙升</text>
    <text x="179" y="341" text-anchor="middle" font-size="8.5" fill="#B08A3E">成本传导</text>
    <line x1="165" y1="351" x2="184" y2="351" stroke="#C99A3D" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="184,345.5 194,351 184,356.5" fill="#C99A3D"/>
    <rect x="196" y="328" width="164" height="46" rx="10" fill="#FFFFFF" stroke="#EAD9AE"/>
    <text x="278" y="347" text-anchor="middle" font-size="11" fill="#6C7763">英伟达 AI 服务器</text>
    <text x="278" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#3E7C0A">明年初出货将涨价</text>
    <text x="195" y="396" text-anchor="middle" font-size="9" fill="#8A8064">为微软、谷歌、甲骨文代工的服务器厂商已通知客户</text>

    <!-- 价格标尺 -->
    <rect x="18" y="409" width="4" height="13" rx="2" fill="#76B900"/>
    <text x="28" y="420" font-size="13" font-weight="700" fill="#22301F">单台服务器已进入「百万美元级」</text>
    <text x="358" y="420" text-anchor="end" font-size="9.5" fill="#9AA48F">单位：美元</text>
    <rect x="16" y="430" width="358" height="146" rx="14" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <text x="32" y="452" font-size="11" fill="#6C7763">NVL72 GB200 机架 · Blackwell</text>
    <rect x="32" y="458" width="151" height="16" rx="8" fill="url(#gBar1)"/>
    <text x="175" y="470" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">$280万–340万</text>
    <text x="32" y="496" font-size="11" fill="#6C7763">NVL72 VR200 系统 · Vera Rubin</text>
    <rect x="32" y="502" width="312" height="16" rx="8" fill="url(#gBar2)"/>
    <text x="336" y="514" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">$500万–700万</text>
    <circle cx="38" cy="533" r="7" fill="#FDEBDC"/>
    <text x="38" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#C2620A">＋</text>
    <text x="50" y="537" font-size="11.5" fill="#6C7763">15% 涨幅 ≈ 单台增加 <tspan font-weight="700" fill="#B4520A">数十万~近百万美元</tspan> 开销</text>
    <rect x="32" y="546" width="312" height="20" rx="10" fill="#F1F5EC" stroke="#DFE8D8"/>
    <text x="188" y="559.5" text-anchor="middle" font-size="10.5" fill="#5A6652">消费端先例：RTX 5080 一个月内 8000元 <tspan font-weight="700" fill="#3E7C0A">→ 1.2万元</tspan></text>

    <!-- 财报焦点 -->
    <rect x="18" y="587" width="4" height="13" rx="2" fill="#76B900"/>
    <text x="28" y="598" font-size="13" font-weight="700" fill="#22301F">财报焦点：利润率是否承压</text>
    <rect x="16" y="608" width="358" height="100" rx="14" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <rect x="252" y="618" width="112" height="20" rx="10" fill="#FFF3DC" stroke="#F2DFB6"/>
    <text x="308" y="631.5" text-anchor="middle" font-size="10.5" fill="#A06B00" font-weight="600">下周三盘后发布财报</text>
    <circle cx="66" cy="660" r="28" fill="none" stroke="#ECF1E6" stroke-width="9"/>
    <circle cx="66" cy="660" r="28" fill="none" stroke="#76B900" stroke-width="9" stroke-linecap="round" stroke-dasharray="131.9 999" transform="rotate(-90 66 660)"/>
    <text x="66" y="659" text-anchor="middle" font-size="14" font-weight="700" fill="#35690A">75%</text>
    <text x="66" y="673" text-anchor="middle" font-size="8.5" fill="#7A8472">毛利率</text>
    <text x="112" y="634" font-size="11" fill="#6C7763">上季度营收 <tspan font-size="13" font-weight="700" fill="#22301F">816 亿美元</tspan></text>
    <text x="112" y="656" font-size="11" fill="#6C7763">毛利率：60.5%（上年同期）→ <tspan font-weight="700" fill="#3E7C0A">75%</tspan></text>
    <text x="112" y="675" font-size="11" fill="#6C7763">本季指引：74.9%–75%（维持高位）</text>
    <text x="112" y="695" font-size="11.5" font-weight="700" fill="#B4520A">市场焦点：存储涨价或侵蚀利润率</text>

    <!-- 连锁反应 -->
    <rect x="18" y="719" width="4" height="13" rx="2" fill="#76B900"/>
    <text x="28" y="730" font-size="13" font-weight="700" fill="#22301F">产业链连锁反应</text>
    <rect x="16" y="740" width="112" height="68" rx="12" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <text x="72" y="762" text-anchor="middle" font-size="12" font-weight="700" fill="#C2620A">涨价蔓延</text>
    <text x="72" y="780" text-anchor="middle" font-size="9.5" fill="#6C7763">苹果、高通因</text>
    <text x="72" y="794" text-anchor="middle" font-size="9.5" fill="#6C7763">芯片短缺提价</text>
    <rect x="136" y="740" width="112" height="68" rx="12" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <text x="192" y="762" text-anchor="middle" font-size="12" font-weight="700" fill="#3E7C0A">自研加速</text>
    <text x="192" y="780" text-anchor="middle" font-size="9.5" fill="#6C7763">亚马逊、微软、</text>
    <text x="192" y="794" text-anchor="middle" font-size="9.5" fill="#6C7763">谷歌、Meta 自研</text>
    <rect x="256" y="740" width="118" height="68" rx="12" fill="#FFFFFF" stroke="#E4EBDF" filter="url(#s)"/>
    <text x="315" y="762" text-anchor="middle" font-size="12" font-weight="700" fill="#2C6FA8">供应关键</text>
    <text x="315" y="780" text-anchor="middle" font-size="9.5" fill="#6C7763">三星、SK海力士、</text>
    <text x="315" y="794" text-anchor="middle" font-size="9.5" fill="#6C7763">美光 产能争夺</text>

    <text x="195" y="828" text-anchor="middle" font-size="9.5" fill="#8A9484">英伟达软件生态仍是护城河，新建数据中心短期内仍高度依赖英伟达芯片</text>
  </g>
</svg>