<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CCB4F"/><stop offset="1" stop-color="#5E9E21"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC63F"/><stop offset="1" stop-color="#5E9C22"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#3A5A1E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#F6F8F2"/>
  <circle cx="356" cy="96" r="70" fill="#76B900" opacity="0.05"/>
  <circle cx="14" cy="520" r="60" fill="#76B900" opacity="0.04"/>
  <circle cx="372" cy="768" r="56" fill="#E08A3C" opacity="0.05"/>
  <rect width="390" height="5" fill="url(#gTop)"/>

  <g font-family="PingFang SC, Hiragino Sans GB, STHeiti, Helvetica Neue, Arial, sans-serif">

    <!-- 头部 -->
    <rect x="16" y="22" width="112" height="24" rx="12" fill="#E7F2D8" stroke="#D5E7BC"/>
    <circle cx="30" cy="34" r="3" fill="#76B900"/>
    <text x="39" y="38" font-size="11" fill="#4C7A1E">财联社 · 8月23日</text>

    <text x="16" y="76" font-size="22" font-weight="700" fill="#1D2B21" letter-spacing="0.5">英伟达服务器传出涨价消息</text>
    <text x="16" y="104" font-size="22" font-weight="700" letter-spacing="0.5">
      <tspan fill="#1D2B21">涨幅“很多情况下</tspan><tspan fill="#C43C21">超过15%</tspan><tspan fill="#1D2B21">”</tspan>
    </text>

    <!-- 核心数字 -->
    <rect x="16" y="120" width="358" height="76" rx="16" fill="#EAF4DB" stroke="#D9E9C4" filter="url(#soft)"/>
    <text x="34" y="143" font-size="10.5" fill="#5F7A4A">很多情况下，涨幅将</text>
    <text x="33" y="180" font-size="34" font-weight="800" fill="#C43C21">&gt;15%</text>
    <path d="M132 163 L140 150 L148 163 H142.5 V174 H137.5 V163 Z" fill="#C43C21"/>
    <line x1="160" y1="138" x2="160" y2="178" stroke="#C7DDB0" stroke-width="1"/>
    <text x="172" y="151" font-size="11.5" font-weight="600" fill="#33463A">多家「英伟达最大客户」已获通知</text>
    <text x="172" y="171" font-size="11.5" fill="#46564B">明年年初出货的 AI 服务器将提价</text>

    <!-- ① 涨什么 · 何时涨 -->
    <rect x="16" y="208" width="358" height="122" rx="14" fill="#FFFFFF" stroke="#E5ECDF" filter="url(#soft)"/>
    <circle cx="36" cy="232" r="10" fill="#76B900"/>
    <text x="36" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <text x="54" y="236" font-size="14" font-weight="700" fill="#1D2B21">涨什么 · 何时涨</text>
    <rect x="286" y="222" width="72" height="20" rx="10" fill="#F1F6EA"/>
    <text x="322" y="236" text-anchor="middle" font-size="10.5" fill="#55792E">明年年初起</text>
    <rect x="32" y="254" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="264" font-size="11.5" fill="#46564B">搭载 Vera Rubin、Grace Blackwell 芯片组合的服务器</text>
    <rect x="32" y="275" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="285" font-size="11.5" fill="#46564B">诱因：内存芯片（DRAM）成本飙升</text>
    <rect x="32" y="296" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="306" font-size="11.5" fill="#46564B">为微软、谷歌、甲骨文代工的企业已通知客户</text>

    <!-- ② 有多贵 -->
    <rect x="16" y="342" width="358" height="170" rx="14" fill="#FFFFFF" stroke="#E5ECDF" filter="url(#soft)"/>
    <circle cx="36" cy="366" r="10" fill="#76B900"/>
    <text x="36" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
    <text x="54" y="370" font-size="14" font-weight="700" fill="#1D2B21">有多贵：单台多花几十万至百万美元</text>

    <text x="32" y="396" font-size="11" fill="#46564B">Blackwell NVL72 GB200 机架</text>
    <text x="358" y="396" text-anchor="end" font-size="12.5" font-weight="700" fill="#1D2B21">$280–340万</text>
    <rect x="32" y="404" width="210" height="9" rx="4.5" fill="#EFF3EA"/>
    <rect x="32" y="404" width="95" height="9" rx="4.5" fill="url(#gBar)"/>
    <rect x="129" y="404" width="14" height="9" rx="4.5" fill="#E0532F"/>
    <text x="152" y="412.5" font-size="9.5" fill="#C43C21">+15% ≈ 多付 42–51 万美元</text>

    <text x="32" y="438" font-size="11" fill="#46564B">Vera Rubin NVL72 VR200（询价）</text>
    <text x="358" y="438" text-anchor="end" font-size="12.5" font-weight="700" fill="#1D2B21">$500–700万</text>
    <rect x="32" y="446" width="210" height="9" rx="4.5" fill="#EFF3EA"/>
    <rect x="32" y="446" width="196" height="9" rx="4.5" fill="url(#gBar)"/>

    <line x1="32" y1="468" x2="358" y2="468" stroke="#ECF1E6"/>
    <rect x="32" y="480" width="6" height="6" rx="1.5" fill="#E08A3C"/>
    <text x="44" y="490" font-size="11" fill="#46564B">显卡已先涨：RTX 5080 一个月 ¥8,000 → ¥12,000（+50%）</text>

    <!-- ③ 财报焦点 -->
    <rect x="16" y="524" width="358" height="140" rx="14" fill="#FFFFFF" stroke="#E5ECDF" filter="url(#soft)"/>
    <circle cx="36" cy="548" r="10" fill="#76B900"/>
    <text x="36" y="552" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    <text x="54" y="552" font-size="14" font-weight="700" fill="#1D2B21">财报焦点：会否侵蚀利润率</text>
    <rect x="32" y="566" width="128" height="20" rx="10" fill="#F1F6EA"/>
    <text x="96" y="580" text-anchor="middle" font-size="10.5" fill="#55792E">财报：下周三美股盘后</text>

    <text x="32" y="620" font-size="22" font-weight="800" fill="#1D2B21">$816亿</text>
    <text x="32" y="637" font-size="10" fill="#7C8B7D">最新季度营收</text>
    <line x1="186" y1="602" x2="186" y2="638" stroke="#ECF1E6"/>
    <text x="202" y="620" font-size="22" font-weight="800" fill="#3E7C1F">≈75%</text>
    <text x="202" y="637" font-size="10" fill="#7C8B7D">毛利率 · 去年同期60.5%</text>

    <path d="M40 643 L46.5 654 L33.5 654 Z" fill="#E08A3C"/>
    <text x="54" y="654" font-size="11" font-weight="600" fill="#B4571F">市场审视：存储涨价是否侵蚀毛利率</text>

    <!-- ④ 连锁反应 -->
    <rect x="16" y="676" width="358" height="126" rx="14" fill="#FFFFFF" stroke="#E5ECDF" filter="url(#soft)"/>
    <circle cx="36" cy="700" r="10" fill="#76B900"/>
    <text x="36" y="704" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
    <text x="54" y="704" font-size="14" font-weight="700" fill="#1D2B21">连锁反应</text>
    <text x="358" y="704" text-anchor="end" font-size="10" fill="#97A598">涨价外溢</text>
    <rect x="32" y="716" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="726" font-size="11" fill="#46564B">苹果、高通也称因芯片短缺提价</text>
    <rect x="32" y="736" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="746" font-size="11" fill="#46564B">亚马逊、微软、谷歌、Meta 加速自研芯片</text>
    <rect x="32" y="756" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="766" font-size="11" fill="#46564B">新建数据中心仍高度依赖英伟达软件生态</text>
    <rect x="32" y="776" width="6" height="6" rx="1.5" fill="#76B900"/>
    <text x="44" y="786" font-size="11" fill="#46564B">挑战者关键：三星、海力士、美光的供应</text>

    <!-- 页脚 -->
    <text x="195" y="826" text-anchor="middle" font-size="9.5" fill="#97A598">来源：财联社 8月23日报道 · 数据均为文中提及信息</text>
  </g>
</svg>