<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="英伟达服务器涨价信息图">
  <title>英伟达服务器传出涨价消息</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5D65C"/>
      <stop offset="1" stop-color="#6FAE00"/>
    </linearGradient>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#7E9A5E" flood-opacity="0.16"/>
    </filter>
    <style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif;}</style>
  </defs>

  <rect width="390" height="844" fill="#F6F8F2"/>
  <circle cx="392" cy="6" r="56" fill="#E7F0D8" opacity="0.6"/>
  <rect width="390" height="5" fill="url(#top)"/>

  <!-- 头部 -->
  <rect x="16" y="22" width="112" height="22" rx="11" fill="#E7F0D9"/>
  <text x="72" y="37" text-anchor="middle" font-size="11" fill="#4F6B2A">财联社 · 8月23日讯</text>
  <rect x="264" y="22" width="110" height="22" rx="11" fill="#FBEEDC"/>
  <text x="319" y="37" text-anchor="middle" font-size="11" fill="#96621D">内存涨价 · AI硬件</text>

  <text x="16" y="79" font-size="21" font-weight="700" fill="#232F1A">英伟达服务器传出涨价消息</text>
  <text x="16" y="107" font-size="21" font-weight="700" fill="#232F1A">涨幅“很多情况下<tspan fill="#4E8F00">超过15%</tspan>”</text>
  <text x="16" y="125" font-size="11" fill="#7C8A70">据媒体援引知情人士透露 ·「涨价的风」吹到了AI服务器</text>

  <!-- 核心数字 -->
  <rect x="16" y="134" width="358" height="96" rx="16" fill="#FFFFFF" stroke="#E6EDDC" filter="url(#cs)"/>
  <text x="34" y="158" font-size="10.5" fill="#93A187">服务器提价幅度</text>
  <text x="34" y="196" font-size="40" font-weight="700" fill="#5E9E00">&gt;15%</text>
  <text x="34" y="214" font-size="11" fill="#77866B">很多情况下的涨幅</text>
  <line x1="160" y1="152" x2="160" y2="212" stroke="#EEF2E6" stroke-width="1.5"/>
  <rect x="243" y="136" width="36" height="16" rx="8" fill="#76B900"/>
  <text x="261" y="147.5" text-anchor="middle" font-size="10" fill="#FFFFFF">提价</text>
  <rect x="200" y="184" width="18" height="26" rx="3" fill="#D8E8BE"/>
  <rect x="226" y="170" width="18" height="40" rx="3" fill="#ABD178"/>
  <rect x="252" y="158" width="18" height="52" rx="3" fill="#76B900"/>
  <text x="235" y="224" text-anchor="middle" font-size="10" fill="#93A187">明年初起 · 普遍提价</text>

  <!-- 涨价范围 -->
  <rect x="16" y="242" width="358" height="122" rx="16" fill="#FFFFFF" stroke="#E6EDDC" filter="url(#cs)"/>
  <circle cx="38" cy="264" r="4" fill="#76B900"/>
  <text x="48" y="268" font-size="13" font-weight="700" fill="#2C3A22">涨价范围</text>
  <text x="358" y="268" text-anchor="end" font-size="10" fill="#93A187">多家“最大客户”已被告知</text>
  <rect x="32" y="280" width="36" height="19" rx="9.5" fill="#EFF5E4"/>
  <text x="50" y="293" text-anchor="middle" font-size="10.5" fill="#55702E">时间</text>
  <text x="78" y="293" font-size="12" fill="#3A4632">明年年初出货的系统</text>
  <rect x="32" y="308" width="36" height="19" rx="9.5" fill="#EFF5E4"/>
  <text x="50" y="321" text-anchor="middle" font-size="10.5" fill="#55702E">机型</text>
  <text x="78" y="321" font-size="12" fill="#3A4632">Vera Rubin / Grace Blackwell 芯片组合</text>
  <rect x="32" y="336" width="36" height="19" rx="9.5" fill="#EFF5E4"/>
  <text x="50" y="349" text-anchor="middle" font-size="10.5" fill="#55702E">主因</text>
  <text x="78" y="349" font-size="12" fill="#3A4632">内存芯片（DRAM）成本飙升</text>

  <!-- 单台身价 -->
  <rect x="16" y="376" width="358" height="158" rx="16" fill="#FFFFFF" stroke="#E6EDDC" filter="url(#cs)"/>
  <circle cx="38" cy="398" r="4" fill="#76B900"/>
  <text x="48" y="402" font-size="13" font-weight="700" fill="#2C3A22">单台身价（万美元）</text>
  <text x="358" y="402" text-anchor="end" font-size="10" fill="#93A187">今年早些时候报价</text>
  <text x="32" y="428" font-size="11.5" fill="#5A6B4F">NVL72 GB200机架 · Blackwell架构</text>
  <text x="358" y="428" text-anchor="end" font-size="12.5" font-weight="700" fill="#2C3A22">$280万–340万</text>
  <rect x="32" y="436" width="326" height="10" rx="5" fill="#EEF3E6"/>
  <rect x="32" y="436" width="130" height="10" rx="5" fill="#CFE3AC"/>
  <rect x="162" y="436" width="28" height="10" rx="5" fill="#76B900"/>
  <text x="32" y="472" font-size="11.5" fill="#5A6B4F">NVL72 VR200系统 · Vera Rubin</text>
  <text x="358" y="472" text-anchor="end" font-size="12.5" font-weight="700" fill="#2C3A22">$500万–700万</text>
  <rect x="32" y="480" width="326" height="10" rx="5" fill="#EEF3E6"/>
  <rect x="32" y="480" width="233" height="10" rx="5" fill="#CFE3AC"/>
  <rect x="265" y="480" width="93" height="10" rx="5" fill="#76B900"/>
  <rect x="32" y="500" width="326" height="24" rx="12" fill="#FBF2DF"/>
  <text x="195" y="516" text-anchor="middle" font-size="11" fill="#8A6120">按15%估算：单台额外开销数十万至近百万美元</text>

  <!-- 消费级先例 -->
  <rect x="16" y="546" width="358" height="66" rx="16" fill="#FFFFFF" stroke="#E6EDDC" filter="url(#cs)"/>
  <rect x="32" y="566" width="26" height="26" rx="7" fill="#EFF5E4"/>
  <path d="M42 570 v3 M48 570 v3 M42 585 v3 M48 585 v3 M36 576 h3 M36 582 h3 M52 576 h3 M52 582 h3" stroke="#76B900" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="39" y="573" width="12" height="12" rx="2.5" fill="#76B900"/>
  <text x="68" y="573" font-size="12.5" font-weight="700" fill="#2C3A22">消费级显卡已先涨一轮</text>
  <text x="68" y="595" font-size="11" fill="#6B7A63">RTX 5080 一个月内 ¥8000 → ¥1.2万</text>
  <rect x="306" y="567" width="52" height="24" rx="12" fill="#FBE3D4"/>
  <text x="332" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="#C05A28">+50%</text>

  <!-- 下周焦点 -->
  <rect x="16" y="624" width="358" height="118" rx="16" fill="#FFFFFF" stroke="#E6EDDC" filter="url(#cs)"/>
  <circle cx="38" cy="646" r="4" fill="#76B900"/>
  <text x="48" y="650" font-size="13" font-weight="700" fill="#2C3A22">下周焦点 · 利润率</text>
  <text x="358" y="650" text-anchor="end" font-size="10" fill="#93A187">下周三 · 美股盘后财报</text>
  <circle cx="66" cy="696" r="26" fill="none" stroke="#EDF2E4" stroke-width="8"/>
  <circle cx="66" cy="696" r="26" fill="none" stroke="#76B900" stroke-width="8" stroke-linecap="round" stroke-dasharray="122.5 163.4" transform="rotate(-90 66 696)"/>
  <text x="66" y="701" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3A22">75%</text>
  <text x="66" y="737" text-anchor="middle" font-size="10" fill="#77866B">上季毛利率</text>
  <text x="110" y="676" font-size="12" fill="#3A4632">英伟达定档下周三盘后发布财报</text>
  <text x="110" y="698" font-size="11.5" fill="#6B7A63">上季营收816亿美元 · 指引毛利率约75%</text>
  <rect x="104" y="709" width="216" height="19" rx="9" fill="#FBF2DF"/>
  <text x="110" y="723" font-size="11.5" font-weight="700" fill="#8A6120">市场关注：存储涨价会否侵蚀利润率</text>

  <!-- 连锁反应 -->
  <rect x="16" y="754" width="358" height="78" rx="16" fill="#E9F1DC"/>
  <rect x="28" y="768" width="104" height="24" rx="12" fill="#FFFFFF"/>
  <text x="80" y="784" text-anchor="middle" font-size="11" fill="#4F6B2A">内存DRAM涨价</text>
  <path d="M137 780 h9 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" stroke="#8FA871" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="152" y="768" width="72" height="24" rx="12" fill="#FFFFFF"/>
  <text x="188" y="784" text-anchor="middle" font-size="11" fill="#4F6B2A">服务器提价</text>
  <path d="M229 780 h9 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" stroke="#8FA871" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="244" y="768" width="118" height="24" rx="12" fill="#FFFFFF"/>
  <text x="303" y="784" text-anchor="middle" font-size="11" fill="#4F6B2A">云巨头加速自研芯片</text>
  <text x="195" y="814" text-anchor="middle" font-size="10.5" fill="#64755A">亚马逊、微软、谷歌、Meta均在推进自研，但英伟达软件护城河仍深</text>
</svg>