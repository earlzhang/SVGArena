<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <title>英伟达服务器涨价信息图</title>
  <style>
    text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif;}
    .s{font-family:'Songti SC','STSong','Hiragino Sans GB',serif;}
  </style>
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#3A4A22" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A8B29A"/>
    </marker>
  </defs>

  <!-- 底色与装饰 -->
  <rect width="390" height="844" fill="#F6F7F2"/>
  <circle cx="372" cy="-10" r="95" fill="#E8F1D8" opacity="0.55"/>
  <circle cx="-10" cy="850" r="80" fill="#ECF2E0" opacity="0.6"/>

  <!-- 顶部来源 -->
  <rect x="20" y="22" width="100" height="21" rx="10.5" fill="#E6F0D6" stroke="#D3E4B4"/>
  <text x="70" y="36.5" text-anchor="middle" font-size="10.5" fill="#4E7A00">财联社 · 8月23日</text>
  <text x="370" y="36.5" text-anchor="end" font-size="10.5" fill="#8A937F">AI 硬件 · 快讯图解</text>

  <!-- 标题 -->
  <text x="20" y="80" class="s" font-size="24" font-weight="bold" fill="#222B1E">英伟达服务器传出涨价消息</text>
  <rect x="185" y="93" width="96" height="22" rx="5" fill="#DDEBC0"/>
  <text x="20" y="111" class="s" font-size="24" font-weight="bold" fill="#222B1E">涨幅很多情况下<tspan fill="#4E7A00">超过15%</tspan></text>
  <circle cx="348" cy="92" r="25.5" fill="none" stroke="#76B900" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.55"/>
  <circle cx="348" cy="92" r="21" fill="#76B900"/>
  <text x="348" y="100" text-anchor="middle" class="s" font-size="19" font-weight="bold" fill="#FFFFFF">涨</text>

  <!-- 核心数据 -->
  <rect x="20" y="130" width="350" height="94" rx="14" fill="#F2F8E7" stroke="#DCE9C3" filter="url(#cs)"/>
  <text x="40" y="153" font-size="10.5" fill="#7C8669">部分机型涨幅</text>
  <text x="38" y="198" class="s" font-size="38" font-weight="bold" fill="#4E7A00">&gt;15%</text>
  <line x1="150" y1="148" x2="150" y2="208" stroke="#D8E6BC"/>
  <text x="166" y="155" font-size="13" font-weight="bold" fill="#26301F">明年初出货起 · 普遍提价</text>
  <text x="166" y="174" font-size="10.5" fill="#7C8669">具体涨幅视芯片型号与内存配置而定</text>
  <rect x="166" y="184" width="76" height="20" rx="10" fill="#FFFFFF" stroke="#CFE0AC"/>
  <text x="204" y="197.5" text-anchor="middle" font-size="10" fill="#4E7A00">Vera Rubin</text>
  <rect x="248" y="184" width="104" height="20" rx="10" fill="#FFFFFF" stroke="#CFE0AC"/>
  <text x="300" y="197.5" text-anchor="middle" font-size="10" fill="#4E7A00">Grace Blackwell</text>

  <!-- 为什么涨 -->
  <rect x="20" y="243" width="5" height="15" rx="2" fill="#76B900"/>
  <text x="32" y="256" font-size="14" font-weight="bold" fill="#26301F">为什么涨</text>
  <line x1="104" y1="251" x2="218" y2="251" stroke="#E0E5D8"/>
  <text x="370" y="256" text-anchor="end" font-size="10" fill="#8A937F">导火索：内存芯片供不应求</text>

  <rect x="20" y="268" width="98" height="48" rx="10" fill="#FCF1E2" stroke="#F0D9B8"/>
  <text x="69" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#A15C07">存储芯片</text>
  <text x="69" y="304" text-anchor="middle" font-size="9.5" fill="#B08244">DRAM 成本飙升</text>
  <line x1="121" y1="292" x2="141" y2="292" stroke="#A8B29A" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="146" y="268" width="98" height="48" rx="10" fill="#FFFFFF" stroke="#E4E8DC"/>
  <text x="195" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#26301F">服务器厂商</text>
  <text x="195" y="304" text-anchor="middle" font-size="9.5" fill="#8A937F">陆续通知客户调价</text>
  <line x1="247" y1="292" x2="267" y2="292" stroke="#A8B29A" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="272" y="268" width="98" height="48" rx="10" fill="#EDF5DE" stroke="#CFE2AA"/>
  <text x="321" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3F6D00">整机涨价</text>
  <text x="321" y="304" text-anchor="middle" font-size="9.5" fill="#6E8F3C">很多情况 &gt;15%</text>

  <!-- 代表系统报价 -->
  <rect x="20" y="337" width="5" height="15" rx="2" fill="#76B900"/>
  <text x="32" y="350" font-size="14" font-weight="bold" fill="#26301F">涨到多贵 · 代表系统报价</text>
  <line x1="210" y1="345" x2="370" y2="345" stroke="#E0E5D8"/>

  <rect x="20" y="362" width="170" height="96" rx="12" fill="#FFFFFF" stroke="#E4E8DC" filter="url(#cs)"/>
  <text x="34" y="382" font-size="9.5" fill="#8A937F">Blackwell 架构 · 机架</text>
  <text x="34" y="401" font-size="12.5" font-weight="bold" fill="#26301F">NVL72 GB200</text>
  <text x="34" y="428" class="s" font-size="19" font-weight="bold" fill="#3F6D00">$280–340万<tspan font-size="9.5" fill="#8A937F" font-weight="normal">/台</tspan></text>
  <text x="34" y="446" font-size="9" fill="#9AA38E">今年早些时候整机报价</text>

  <rect x="200" y="362" width="170" height="96" rx="12" fill="#FFFFFF" stroke="#E4E8DC" filter="url(#cs)"/>
  <text x="214" y="382" font-size="9.5" fill="#8A937F">Vera Rubin 架构 · 机架</text>
  <text x="214" y="401" font-size="12.5" font-weight="bold" fill="#26301F">NVL72 VR200</text>
  <text x="214" y="428" class="s" font-size="19" font-weight="bold" fill="#3F6D00">$500–700万<tspan font-size="9.5" fill="#8A937F" font-weight="normal">/台</tspan></text>
  <text x="214" y="446" font-size="9" fill="#9AA38E">出货前询价 · 明显更贵</text>

  <rect x="20" y="470" width="350" height="46" rx="12" fill="#FBF5EA" stroke="#EEDFC4"/>
  <circle cx="36" cy="493" r="4" fill="#D97706"/>
  <text x="48" y="489" font-size="11" font-weight="bold" fill="#8A4B08">消费级也在涨 · RTX 5080 显卡</text>
  <text x="48" y="505" font-size="9.5" fill="#A98A5F">短短一个月内</text>
  <text x="354" y="492" text-anchor="end" font-size="13.5" font-weight="bold" fill="#B45309">¥8,000 → ¥12,000</text>
  <text x="354" y="507" text-anchor="end" font-size="9.5" fill="#A98A5F">约 +50%</text>

  <!-- 市场焦点 -->
  <rect x="20" y="537" width="5" height="15" rx="2" fill="#76B900"/>
  <text x="32" y="550" font-size="14" font-weight="bold" fill="#26301F">市场焦点｜下周三盘后财报</text>
  <line x1="222" y1="545" x2="370" y2="545" stroke="#E0E5D8"/>

  <rect x="20" y="562" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#E4E8DC" filter="url(#cs)"/>
  <text x="36" y="584" font-size="10.5" fill="#7C8669">毛利率（GAAP）</text>
  <text x="34" y="620" class="s" font-size="30" font-weight="bold" fill="#3F6D00">≈75%</text>
  <text x="36" y="640" font-size="9.5" fill="#8A937F">本季指引 74.9%–75%</text>
  <text x="170" y="584" font-size="9.5" fill="#7C8669">本财季预期</text>
  <rect x="170" y="589" width="180" height="10" rx="5" fill="#EFF2E8"/>
  <rect x="170" y="589" width="135" height="10" rx="5" fill="#76B900"/>
  <text x="311" y="598" font-size="10" font-weight="bold" fill="#3F6D00">75%</text>
  <text x="170" y="618" font-size="9.5" fill="#7C8669">上一财年同期</text>
  <rect x="170" y="623" width="180" height="10" rx="5" fill="#EFF2E8"/>
  <rect x="170" y="623" width="109" height="10" rx="5" fill="#C7CFB6"/>
  <text x="285" y="632" font-size="10" font-weight="bold" fill="#8A937F">60.5%</text>
  <line x1="36" y1="648" x2="354" y2="648" stroke="#EEF1E6"/>
  <text x="36" y="666" font-size="10" fill="#6F7A63">焦点：存储涨价会否侵蚀利润率 ｜ 上季营收 816亿美元</text>

  <!-- 连锁反应 -->
  <rect x="20" y="699" width="5" height="15" rx="2" fill="#76B900"/>
  <text x="32" y="712" font-size="14" font-weight="bold" fill="#26301F">连锁反应</text>
  <line x1="104" y1="707" x2="370" y2="707" stroke="#E0E5D8"/>

  <rect x="20" y="722" width="170" height="96" rx="12" fill="#F7FAF1" stroke="#E1EAD2"/>
  <rect x="32" y="736" width="18" height="18" rx="5" fill="#76B900"/>
  <text x="41" y="749" text-anchor="middle" font-size="11" fill="#FFFFFF">研</text>
  <text x="56" y="749" font-size="12" font-weight="bold" fill="#26301F">云巨头自研芯片</text>
  <text x="32" y="770" font-size="9.5" fill="#7C8669">亚马逊 · 微软 · 谷歌 · Meta</text>
  <text x="32" y="785" font-size="9.5" fill="#7C8669">加速内部替代，但受英伟达</text>
  <text x="32" y="800" font-size="9.5" fill="#7C8669">软件生态「护城河」制约</text>

  <rect x="200" y="722" width="170" height="96" rx="12" fill="#FAF7EE" stroke="#EBE2CC"/>
  <rect x="212" y="736" width="18" height="18" rx="5" fill="#E0A33E"/>
  <text x="221" y="749" text-anchor="middle" font-size="11" fill="#FFFFFF">机</text>
  <text x="236" y="749" font-size="12" font-weight="bold" fill="#26301F">挑战者的窗口</text>
  <text x="212" y="770" font-size="9.5" fill="#8A7A58">成败关键：能否从三星、</text>
  <text x="212" y="785" font-size="9.5" fill="#8A7A58">SK海力士、美光获得足够</text>
  <text x="212" y="800" font-size="9.5" fill="#8A7A58">的 DRAM 芯片供应</text>

  <text x="195" y="836" text-anchor="middle" font-size="9" fill="#9AA38E">资料来源：财联社报道整理 · 图表仅供参考</text>
</svg>