<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, STHeiti, sans-serif">
  <rect width="390" height="844" fill="#F4F7FB"/>
  <circle cx="360" cy="40" r="70" fill="#76B900" opacity="0.08"/>
  <circle cx="30" cy="810" r="60" fill="#2563EB" opacity="0.05"/>

  <text x="16" y="34" font-size="12" fill="#64748B" font-weight="500">财联社 · 8月23日</text>
  <text x="16" y="64" font-size="22" fill="#0F172A" font-weight="700">英伟达服务器涨价</text>
  <text x="16" y="88" font-size="14" fill="#475569">明年初出货系统普遍提价</text>

  <rect x="266" y="24" width="108" height="58" rx="14" fill="#76B900"/>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.9">很多情况涨幅</text>
  <text x="320" y="72" text-anchor="middle" font-size="24" fill="#FFFFFF" font-weight="800">&gt;15%</text>

  <rect x="16" y="106" width="358" height="112" rx="16" fill="#FFFFFF" stroke="#E5EAF2"/>
  <text x="28" y="130" font-size="13" fill="#2563EB" font-weight="700">核心事实</text>
  <circle cx="32" cy="151" r="2.5" fill="#76B900"/>
  <text x="42" y="155" font-size="12.5" fill="#1E293B">明年初起，搭载英伟达 AI 芯片的服务器将普遍提价</text>
  <circle cx="32" cy="173" r="2.5" fill="#76B900"/>
  <text x="42" y="177" font-size="12.5" fill="#1E293B">适用：Vera Rubin、Grace Blackwell 等芯片</text>
  <circle cx="32" cy="195" r="2.5" fill="#76B900"/>
  <text x="42" y="199" font-size="12.5" fill="#1E293B">原因：内存芯片成本飙升；很多情况涨幅 &gt;15%</text>

  <rect x="16" y="230" width="358" height="170" rx="16" fill="#FFFFFF" stroke="#E5EAF2"/>
  <text x="28" y="254" font-size="13" fill="#2563EB" font-weight="700">价格冲击：服务器与显卡</text>

  <rect x="28" y="268" width="334" height="34" rx="10" fill="#F8FAFC"/>
  <text x="40" y="290" font-size="12" fill="#334155">RTX 5080 显卡</text>
  <text x="350" y="290" text-anchor="end" font-size="12.5" fill="#E5484D" font-weight="700">¥8,000 → ¥12,000</text>

  <rect x="28" y="308" width="334" height="34" rx="10" fill="#F8FAFC"/>
  <text x="40" y="330" font-size="12" fill="#334155">GB200 NVL72 机架</text>
  <text x="350" y="330" text-anchor="end" font-size="12.5" fill="#0F172A" font-weight="700">$280–340万/台</text>

  <rect x="28" y="348" width="334" height="34" rx="10" fill="#F8FAFC"/>
  <text x="40" y="370" font-size="12" fill="#334155">VR200 NVL72 系统</text>
  <text x="350" y="370" text-anchor="end" font-size="12.5" fill="#0F172A" font-weight="700">$500–700万/台</text>

  <text x="28" y="392" font-size="10.5" fill="#64748B">AI服务器动辄数百万美元，15%涨幅≈几十万至近百万美元额外开销</text>

  <rect x="16" y="412" width="358" height="122" rx="16" fill="#FFFFFF" stroke="#E5EAF2"/>
  <text x="28" y="436" font-size="13" fill="#2563EB" font-weight="700">为什么重要</text>
  <circle cx="32" cy="457" r="2.5" fill="#2563EB"/>
  <text x="42" y="461" font-size="12" fill="#1E293B">AI芯片性能高度依赖 DRAM 容量，内存涨价推高整机成本</text>
  <circle cx="32" cy="479" r="2.5" fill="#2563EB"/>
  <text x="42" y="483" font-size="12" fill="#1E293B">焦点：存储涨价会否侵蚀英伟达利润率？</text>
  <circle cx="32" cy="501" r="2.5" fill="#2563EB"/>
  <text x="42" y="505" font-size="12" fill="#1E293B">下周美股盘后发财报；预期毛利率 74.9%–75%</text>

  <rect x="16" y="546" width="358" height="138" rx="16" fill="#FFFFFF" stroke="#E5EAF2"/>
  <text x="28" y="570" font-size="13" fill="#2563EB" font-weight="700">连锁反应</text>
  <circle cx="32" cy="591" r="2.5" fill="#76B900"/>
  <text x="42" y="595" font-size="12" fill="#1E293B">微软、谷歌、甲骨文等代工厂商已通知客户涨价</text>
  <circle cx="32" cy="613" r="2.5" fill="#76B900"/>
  <text x="42" y="617" font-size="12" fill="#1E293B">云巨头加速自研芯片：亚马逊、微软、谷歌、Meta</text>
  <circle cx="32" cy="635" r="2.5" fill="#76B900"/>
  <text x="42" y="639" font-size="12" fill="#1E293B">但英伟达软件生态仍是大数据中心采购的护城河</text>
  <circle cx="32" cy="657" r="2.5" fill="#76B900"/>
  <text x="42" y="661" font-size="12" fill="#1E293B">挑战者关键：能否从三星、SK海力士、美光获得供应</text>

  <rect x="16" y="696" width="358" height="118" rx="16" fill="#EAF7D9" stroke="#D9EFB8"/>
  <text x="28" y="722" font-size="13" fill="#4D7C0F" font-weight="700">一句话总结</text>
  <text x="28" y="748" font-size="13" fill="#1E293B">内存成本飙升，英伟达AI服务器明年初起涨价，</text>
  <text x="28" y="772" font-size="13" fill="#1E293B">很多情况下 &gt;15%；算力成本与利润率承压，</text>
  <text x="28" y="796" font-size="13" fill="#1E293B">云厂商自研动机增强，但仍难绕开英伟达生态。</text>
</svg>