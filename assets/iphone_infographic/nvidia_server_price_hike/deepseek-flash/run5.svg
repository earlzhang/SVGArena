<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, STHeiti, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#ECF1F8"/>
    </linearGradient>
    <linearGradient id="hotCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF4F2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F1A2E" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="390" height="3" fill="#E23B2E" opacity="0.85"/>

  <!-- 页头 -->
  <text x="20" y="42" font-size="10.5" font-weight="600" fill="#2F6FEB" letter-spacing="1.5">财联社 · 科技快讯</text>
  <text x="20" y="76" font-size="20" font-weight="700" fill="#141A24">英伟达服务器传出涨价消息</text>
  <text x="20" y="102" font-size="14" font-weight="600" fill="#E23B2E">涨幅「很多情况下超过 15%」</text>

  <!-- 卡片 1：核心数字 -->
  <rect x="16" y="118" width="358" height="150" rx="18" fill="url(#hotCard)" stroke="#F6DEDA" stroke-width="1" filter="url(#soft)"/>
  <rect x="34" y="136" width="102" height="22" rx="11" fill="#FDE8E6"/>
  <text x="85" y="151" font-size="10.5" font-weight="600" fill="#D5342A" text-anchor="middle">内存芯片成本飙升</text>

  <text x="32" y="224" font-size="54" font-weight="800" fill="#E23B2E" letter-spacing="-1.5">15%+</text>

  <text x="198" y="196" font-size="12" fill="#5C6675">明年初出货起适用</text>
  <text x="198" y="220" font-size="12" fill="#5C6675">多家「最大客户」已被告知</text>

  <!-- 卡片 2：价格参考 -->
  <rect x="16" y="280" width="358" height="164" rx="18" fill="#FFFFFF" stroke="#EAEEF5" stroke-width="1" filter="url(#soft)"/>
  <text x="34" y="306" font-size="11" font-weight="600" fill="#8892A4" letter-spacing="0.5">服务器价格参考</text>

  <rect x="28" y="316" width="334" height="36" rx="10" fill="#F6F8FC"/>
  <text x="42" y="339" font-size="12" fill="#3A4250">NVL72 GB200 · Blackwell</text>
  <text x="348" y="339" font-size="12.5" font-weight="600" fill="#141A24" text-anchor="end">280–340 万美元</text>

  <rect x="28" y="356" width="334" height="36" rx="10" fill="#F6F8FC"/>
  <text x="42" y="379" font-size="12" fill="#3A4250">NVL72 VR200 · Vera Rubin</text>
  <text x="348" y="379" font-size="12.5" font-weight="600" fill="#141A24" text-anchor="end">500–700 万美元</text>

  <rect x="28" y="396" width="334" height="36" rx="10" fill="#FDF0EF"/>
  <text x="42" y="419" font-size="12" fill="#3A4250">RTX 5080 显卡 · 1 个月</text>
  <text x="348" y="419" font-size="12.5" font-weight="600" fill="#E23B2E" text-anchor="end">8000 元 → 1.2 万元</text>

  <!-- 卡片 3：财报关注 -->
  <rect x="16" y="456" width="358" height="146" rx="18" fill="#FFFFFF" stroke="#EAEEF5" stroke-width="1" filter="url(#soft)"/>
  <text x="34" y="482" font-size="11" font-weight="600" fill="#8892A4" letter-spacing="0.5">下周财报 · 市场关注</text>

  <circle cx="38" cy="510" r="2.5" fill="#2F6FEB"/>
  <text x="48" y="514" font-size="12.5" fill="#242B36">英伟达定档下周三美股盘后发布财报</text>

  <circle cx="38" cy="540" r="2.5" fill="#2F6FEB"/>
  <text x="48" y="544" font-size="12.5" fill="#242B36">上财季毛利率约 <tspan font-weight="700" fill="#141A24">75%</tspan>，上年同期 60.5%</text>

  <circle cx="38" cy="570" r="2.5" fill="#E23B2E"/>
  <text x="48" y="574" font-size="12.5" fill="#242B36">存储涨价会否侵蚀算力龙头利润率？</text>

  <!-- 卡片 4：连锁反应 -->
  <rect x="16" y="614" width="358" height="168" rx="18" fill="#FFFFFF" stroke="#EAEEF5" stroke-width="1" filter="url(#soft)"/>
  <text x="34" y="640" font-size="11" font-weight="600" fill="#8892A4" letter-spacing="0.5">连锁反应 · 云厂商自研提速</text>

  <rect x="28" y="652" width="60" height="26" rx="13" fill="#EEF3FE"/>
  <text x="58" y="669" font-size="11.5" fill="#2F6FEB" text-anchor="middle">亚马逊</text>
  <rect x="94" y="652" width="52" height="26" rx="13" fill="#EEF3FE"/>
  <text x="120" y="669" font-size="11.5" fill="#2F6FEB" text-anchor="middle">微软</text>
  <rect x="152" y="652" width="52" height="26" rx="13" fill="#EEF3FE"/>
  <text x="178" y="669" font-size="11.5" fill="#2F6FEB" text-anchor="middle">谷歌</text>
  <rect x="210" y="652" width="58" height="26" rx="13" fill="#EEF3FE"/>
  <text x="239" y="669" font-size="11.5" fill="#2F6FEB" text-anchor="middle">Meta</text>

  <text x="34" y="718" font-size="12.5" fill="#242B36">加速自研 AI 芯片，试图降低依赖</text>
  <text x="34" y="744" font-size="12" fill="#5C6675">但软件「护城河」仍在，数据中心仍依赖采购</text>
  <text x="34" y="768" font-size="10.5" fill="#8892A4">挑战者突围需三星 / SK海力士 / 美光供货</text>

  <!-- 页脚 -->
  <text x="20" y="808" font-size="10" fill="#A0A8B8">来源：财联社 · 数据截至报道发布</text>
</svg>