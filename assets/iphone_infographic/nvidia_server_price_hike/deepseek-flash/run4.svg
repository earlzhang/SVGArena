<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Heiti SC','Hiragino Sans GB','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF4F2"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9FC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#bgGrad)"/>

  <!-- ===== 头部 ===== -->
  <text x="24" y="42" font-size="11" fill="#94A3B8" letter-spacing="0.6">财联社 · 8月23日</text>
  <text x="24" y="74" font-size="21" font-weight="700" fill="#0F172A">英伟达服务器传出涨价</text>
  <text x="24" y="98" font-size="12.5" fill="#64748B">搭载 AI 芯片的服务器，明年初起普遍提价</text>

  <!-- ===== Hero 卡 ===== -->
  <rect x="16" y="116" width="358" height="122" rx="18" fill="url(#heroGrad)" stroke="#FADDD5" stroke-width="1"/>
  <text x="36" y="180" font-size="42" font-weight="700" fill="#DC2626">&gt;15%</text>
  <line x1="164" y1="142" x2="164" y2="196" stroke="#F3E3DE" stroke-width="1"/>
  <text x="180" y="162" font-size="12.5" fill="#334155">多家英伟达最大客户</text>
  <text x="180" y="184" font-size="12.5" fill="#334155">已被告知涨价消息</text>
  <text x="36" y="218" font-size="11.5" fill="#A08B84">内存芯片成本飙升，是此轮涨价主因</text>

  <!-- ===== 卡2：价格量级 ===== -->
  <rect x="16" y="252" width="358" height="148" rx="18" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
  <text x="36" y="284" font-size="14" font-weight="700" fill="#0F172A">涨价有多贵？</text>

  <text x="36" y="316" font-size="12" fill="#64748B">NVL72 GB200（Blackwell）</text>
  <text x="354" y="316" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">280–340 万美元</text>

  <text x="36" y="346" font-size="12" fill="#64748B">NVL72 VR200（Vera Rubin）</text>
  <text x="354" y="346" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">500–700 万美元</text>

  <line x1="36" y1="362" x2="354" y2="362" stroke="#EEF2F6" stroke-width="1"/>
  <text x="36" y="386" font-size="12.5" font-weight="700" fill="#DC2626">15% 涨幅 ≈ 额外数十万至近百万美元</text>

  <!-- ===== 卡3：涨价范围 ===== -->
  <rect x="16" y="414" width="358" height="120" rx="18" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
  <text x="36" y="446" font-size="14" font-weight="700" fill="#0F172A">涨价范围</text>

  <circle cx="40" cy="467" r="2.5" fill="#94A3B8"/>
  <text x="52" y="471" font-size="12" fill="#475569">明年初起出货的系统</text>

  <circle cx="40" cy="491" r="2.5" fill="#94A3B8"/>
  <text x="52" y="495" font-size="12" fill="#475569">搭载 Vera Rubin、Grace Blackwell 芯片</text>

  <circle cx="40" cy="515" r="2.5" fill="#94A3B8"/>
  <text x="52" y="519" font-size="12" fill="#475569">涨幅取决于芯片型号与内存配置</text>

  <!-- ===== 卡4：财报看点 ===== -->
  <rect x="16" y="548" width="358" height="104" rx="18" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
  <text x="36" y="580" font-size="14" font-weight="700" fill="#0F172A">下一个看点</text>
  <rect x="272" y="566" width="82" height="22" rx="11" fill="#EFF6FF"/>
  <text x="313" y="581" font-size="11" fill="#2563EB" text-anchor="middle">毛利率 ~75%</text>

  <text x="36" y="610" font-size="12" fill="#475569">下周三美股盘后发布最新财报</text>
  <text x="36" y="634" font-size="12" fill="#475569">存储涨价会否侵蚀算力芯片利润率</text>

  <!-- ===== 卡5：连锁反应 ===== -->
  <rect x="16" y="666" width="358" height="70" rx="18" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
  <text x="36" y="694" font-size="14" font-weight="700" fill="#0F172A">连锁反应</text>
  <text x="36" y="720" font-size="12" fill="#475569">云厂商自研芯片动力增强，但英伟达软件生态仍是护城河</text>

  <!-- ===== 底部来源 ===== -->
  <text x="24" y="776" font-size="10.5" fill="#A6B0BE">来源：财联社 8月23日讯 · 数据为公开报价</text>
</svg>