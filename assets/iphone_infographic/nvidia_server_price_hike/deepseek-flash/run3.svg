<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBF3E0"/>
      <stop offset="1" stop-color="#F6F7F9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F6F7F9"/>
  <rect width="390" height="220" fill="url(#topGrad)"/>

  <!-- Header -->
  <rect x="24" y="28" width="136" height="26" rx="13" fill="#E2EFD2"/>
  <text x="92" y="45.5" text-anchor="middle" font-size="11" font-weight="600" fill="#4C7A10">财联社 · 8月23日</text>

  <text x="24" y="88" font-size="23" font-weight="700" fill="#16181D">英伟达服务器传出涨价</text>
  <text x="24" y="115" font-size="13" font-weight="600" fill="#D97706">部分涨幅「很多情况下超过15%」</text>

  <!-- 核心三卡 -->
  <rect x="24" y="134" width="108" height="84" rx="14" fill="#FFF6EC" stroke="#FBE6CE" stroke-width="1"/>
  <text x="78" y="177" text-anchor="middle" font-size="21" font-weight="700" fill="#D97706">&gt;15%</text>
  <text x="78" y="197" text-anchor="middle" font-size="10.5" fill="#A08A6C">部分涨幅</text>

  <rect x="141" y="134" width="108" height="84" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="195" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#16181D">明年初</text>
  <text x="195" y="197" text-anchor="middle" font-size="10.5" fill="#8A8F98">起陆续涨价</text>

  <rect x="258" y="134" width="108" height="84" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="312" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#16181D">内存芯片</text>
  <text x="312" y="197" text-anchor="middle" font-size="10.5" fill="#8A8F98">成本飙升</text>

  <!-- 价格水位 -->
  <rect x="24" y="234" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="42" y="260" font-size="11" font-weight="600" fill="#8A8F98">价格水位参考</text>
  <line x1="42" y1="276" x2="348" y2="276" stroke="#EDEFF3" stroke-width="1"/>

  <text x="42" y="298" font-size="11.5" fill="#4B5563">RTX 5080 显卡</text>
  <text x="348" y="298" text-anchor="end" font-size="11.5" font-weight="700" fill="#D97706">8000元 → 1.2万元</text>
  <line x1="42" y1="306" x2="348" y2="306" stroke="#F2F4F7" stroke-width="1"/>

  <text x="42" y="328" font-size="11.5" fill="#4B5563">NVL72 GB200 机架</text>
  <text x="348" y="328" text-anchor="end" font-size="11.5" font-weight="700" fill="#16181D">280–340万美元 / 台</text>
  <line x1="42" y1="336" x2="348" y2="336" stroke="#F2F4F7" stroke-width="1"/>

  <text x="42" y="358" font-size="11.5" fill="#4B5563">NVL72 VR200 系统</text>
  <text x="348" y="358" text-anchor="end" font-size="11.5" font-weight="700" fill="#16181D">500–700万美元 / 台</text>

  <!-- 适用范围 / 客户 -->
  <rect x="24" y="386" width="166" height="86" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="40" y="412" font-size="10" fill="#8A8F98">涨价适用机型</text>
  <text x="40" y="434" font-size="12.5" font-weight="700" fill="#16181D">Vera Rubin</text>
  <text x="40" y="456" font-size="12.5" font-weight="700" fill="#16181D">Grace Blackwell</text>

  <rect x="200" y="386" width="166" height="86" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="216" y="412" font-size="10" fill="#8A8F98">涨价传导对象</text>
  <text x="216" y="434" font-size="12.5" font-weight="700" fill="#16181D">微软 · 谷歌</text>
  <text x="216" y="456" font-size="12.5" font-weight="700" fill="#16181D">甲骨文等客户</text>

  <!-- 财报焦点 -->
  <rect x="24" y="488" width="342" height="114" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="42" y="514" font-size="10.5" fill="#8A8F98">英伟达最新财报</text>
  <text x="42" y="540" font-size="14" font-weight="700" fill="#16181D">下周三 美股盘后</text>

  <line x1="216" y1="504" x2="216" y2="548" stroke="#EDEFF3" stroke-width="1"/>

  <text x="234" y="514" font-size="10.5" fill="#8A8F98">上季毛利率</text>
  <text x="234" y="541" font-size="16" font-weight="700" fill="#5A8F00">约 75%</text>

  <line x1="42" y1="560" x2="348" y2="560" stroke="#EDEFF3" stroke-width="1"/>
  <text x="42" y="584" font-size="11" fill="#4B5563">市场关注：存储涨价是否会侵蚀龙头利润率</text>

  <!-- 连锁影响 -->
  <rect x="24" y="618" width="342" height="142" rx="14" fill="#FFFFFF" stroke="#EDEFF3" stroke-width="1"/>
  <text x="42" y="644" font-size="10.5" font-weight="600" fill="#8A8F98">连锁影响</text>

  <circle cx="46" cy="674" r="3.5" fill="#D97706"/>
  <text x="60" y="678" font-size="12" fill="#16181D">云厂商自研芯片动力增强</text>

  <circle cx="46" cy="708" r="3.5" fill="#5A8F00"/>
  <text x="60" y="712" font-size="12" fill="#16181D">英伟达软件生态护城河仍在</text>

  <circle cx="46" cy="742" r="3.5" fill="#2563EB"/>
  <text x="60" y="746" font-size="12" fill="#16181D">挑战者需三星 / SK海力士 / 美光供货</text>

  <!-- Footer -->
  <text x="195" y="790" text-anchor="middle" font-size="9.5" fill="#A8ADB5">来源：财联社 8月23日讯 · 编辑 史正丞</text>
</svg>