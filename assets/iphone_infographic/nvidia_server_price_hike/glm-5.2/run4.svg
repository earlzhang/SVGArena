<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="PingFang SC, Heiti SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D45050"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#F2F4F7"/>

  <!-- Header -->
  <text x="20" y="45" font-size="22" font-weight="700" fill="#1D2129">英伟达服务器传出涨价消息</text>
  <text x="20" y="75" font-size="22" font-weight="700" fill="#76B900">涨幅"很多情况下超过15%"</text>
  <text x="20" y="100" font-size="12" font-weight="400" fill="#86909C">财联社8月23日讯（编辑 史正丞）</text>
  <line x1="20" y1="115" x2="370" y2="115" stroke="#E5E6EB" stroke-width="1"/>

  <!-- Card 1: Core Info -->
  <rect x="15" y="130" width="360" height="110" rx="12" fill="#FFFFFF"/>
  <circle cx="50" cy="185" r="26" fill="#F0F9EB"/>
  <text x="50" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#76B900">&gt;15%</text>
  <text x="95" y="170" font-size="16" font-weight="600" fill="#1D2129">明年初起普遍提价</text>
  <text x="95" y="195" font-size="13" fill="#4E5969">涉及 Vera Rubin、Grace Blackwell 等芯片服务器</text>
  <rect x="95" y="208" width="110" height="26" rx="13" fill="#FFF2E8"/>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#E3712A">内存成本飙升</text>

  <!-- Card 2: Price Storm -->
  <rect x="15" y="255" width="360" height="245" rx="12" fill="#FFFFFF"/>
  <text x="35" y="285" font-size="16" font-weight="600" fill="#1D2129">价格风暴：从消费级到企业级</text>
  
  <!-- Item 1 -->
  <text x="35" y="315" font-size="13" fill="#4E5969">次旗舰 RTX 5080 显卡</text>
  <text x="35" y="340" font-size="15" font-weight="700" fill="#86909C">8000元</text>
  <path d="M105 335 L145 335" stroke="#D45050" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="340" font-size="15" font-weight="700" fill="#D45050">12000元</text>
  <text x="250" y="340" font-size="12" fill="#86909C">(1个月内)</text>

  <!-- Item 2 -->
  <text x="35" y="375" font-size="13" fill="#4E5969">Blackwell NVL72 GB200</text>
  <text x="35" y="400" font-size="15" font-weight="700" fill="#1D2129">280万 - 340万美元</text>
  <rect x="200" y="388" width="85" height="20" rx="4" fill="#76B900"/>
  <text x="295" y="402" font-size="12" fill="#86909C">机架</text>

  <!-- Item 3 -->
  <text x="35" y="435" font-size="13" fill="#4E5969">Vera Rubin NVL72 VR200</text>
  <text x="35" y="460" font-size="15" font-weight="700" fill="#1D2129">500万 - 700万美元</text>
  <rect x="200" y="448" width="175" height="20" rx="4" fill="#76B900"/>

  <text x="35" y="485" font-size="12" fill="#86909C">注：15%涨幅即意味数十万至近百万美元额外开销</text>

  <!-- Card 3: Financials -->
  <rect x="15" y="515" width="360" height="165" rx="12" fill="#FFFFFF"/>
  <text x="35" y="545" font-size="16" font-weight="600" fill="#1D2129">财报与利润率审视</text>
  <text x="35" y="570" font-size="13" fill="#4E5969">上一财季营收816亿美元 | 毛利率约75%</text>
  
  <text x="35" y="600" font-size="12" fill="#86909C">毛利率变化趋势</text>
  <rect x="35" y="610" width="121" height="24" rx="4" fill="#E5E6EB"/>
  <text x="45" y="626" font-size="12" fill="#4E5969">上一财年 60.5%</text>
  <rect x="35" y="640" width="150" height="24" rx="4" fill="#76B900"/>
  <text x="45" y="656" font-size="12" fill="#FFFFFF">当前 75%</text>

  <text x="190" y="615" font-size="13" fill="#4E5969">下周三发布财报</text>
  <text x="190" y="645" font-size="13" font-weight="600" fill="#D45050">关注：存储涨价是否</text>
  <text x="190" y="670" font-size="13" font-weight="600" fill="#D45050">侵蚀算力龙头利润率</text>

  <!-- Card 4: Market Dynamics -->
  <rect x="15" y="695" width="360" height="130" rx="12" fill="#FFFFFF"/>
  <text x="35" y="725" font-size="16" font-weight="600" fill="#1D2129">产业链博弈与自研动力</text>
  
  <circle cx="45" cy="755" r="4" fill="#76B900"/>
  <text x="60" y="759" font-size="13" fill="#4E5969">芯片性能高度依赖配套 DRAM 容量</text>
  
  <circle cx="45" cy="785" r="4" fill="#76B900"/>
  <text x="60" y="789" font-size="13" fill="#4E5969">云巨头推进自研芯片，但仍依赖英伟达生态</text>
  
  <circle cx="45" cy="815" r="4" fill="#76B900"/>
  <text x="60" y="819" font-size="13" fill="#4E5969">挑战者命运取决于三星/SK海力士/美光供应</text>

  <!-- Footer -->
  <text x="195" y="840" text-anchor="middle" font-size="11" fill="#C9CDD4">- 适合手机端阅读 -</text>
</svg>