<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" text-rendering="geometricPrecision" font-family="PingFang SC, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="375" height="812" fill="#F5F5F7"/>

  <!-- ============ 1. 顶部标题区 ============ -->
  <g id="header">
    <rect x="20" y="32" width="3" height="14" fill="#E85D04" rx="1.5"/>
    <text x="30" y="44" font-size="11" fill="#86868B" font-weight="500" letter-spacing="0.5">财联社 · 8月23日讯</text>
    <text x="20" y="78" font-size="26" fill="#1D1D1F" font-weight="700">英伟达服务器涨价</text>
    <text x="20" y="106" font-size="14" fill="#6E6E73" font-weight="500">涨幅"很多情况下超过15%"</text>
  </g>

  <!-- ============ 2. 核心数据卡 ============ -->
  <g id="hero-card">
    <rect x="20" y="124" width="335" height="106" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="36" y="180" font-size="46" fill="#E85D04" font-weight="800">&gt;15%</text>
    <text x="36" y="202" font-size="11" fill="#86868B" font-weight="500">服务器价格涨幅</text>
    <line x1="178" y1="144" x2="178" y2="210" stroke="#E5E5EA" stroke-width="1"/>
    <text x="194" y="158" font-size="10" fill="#86868B" font-weight="600" letter-spacing="0.3">生效时间</text>
    <text x="194" y="176" font-size="13" fill="#1D1D1F" font-weight="600">明年初起出货系统</text>
    <text x="194" y="198" font-size="10" fill="#86868B" font-weight="600" letter-spacing="0.3">涨价原因</text>
    <text x="194" y="216" font-size="13" fill="#1D1D1F" font-weight="600">内存芯片成本飙升</text>
  </g>

  <!-- ============ 3. 涉及产品卡 ============ -->
  <g id="products-card">
    <rect x="20" y="244" width="335" height="100" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="36" y="268" font-size="11" fill="#86868B" font-weight="600" letter-spacing="0.5">涉及产品</text>
    <rect x="36" y="282" width="3" height="14" fill="#76B900" rx="1.5"/>
    <text x="48" y="293" font-size="14" fill="#1D1D1F" font-weight="600">Vera Rubin 芯片组合</text>
    <rect x="36" y="307" width="3" height="14" fill="#76B900" rx="1.5"/>
    <text x="48" y="318" font-size="14" fill="#1D1D1F" font-weight="600">Grace Blackwell 芯片组合</text>
    <text x="36" y="336" font-size="11" fill="#86868B">影响：微软、谷歌、甲骨文等大型数据中心运营商</text>
  </g>

  <!-- ============ 4. 价格参考卡 ============ -->
  <g id="price-card">
    <rect x="20" y="358" width="335" height="130" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="36" y="382" font-size="11" fill="#86868B" font-weight="600" letter-spacing="0.5">服务器价格参考</text>

    <!-- GB200 -->
    <text x="36" y="406" font-size="12" fill="#6E6E73" font-weight="500">NVL72 GB200 (Blackwell)</text>
    <text x="339" y="406" font-size="12" fill="#1D1D1F" font-weight="700" text-anchor="end">280–340 万美元/台</text>
    <rect x="36" y="412" width="303" height="6" rx="3" fill="#F0F0F2"/>
    <rect x="36" y="412" width="140" height="6" rx="3" fill="#76B900" opacity="0.65"/>

    <!-- VR200 -->
    <text x="36" y="442" font-size="12" fill="#6E6E73" font-weight="500">NVL72 VR200 (Vera Rubin)</text>
    <text x="339" y="442" font-size="12" fill="#1D1D1F" font-weight="700" text-anchor="end">500–700 万美元/台</text>
    <rect x="36" y="448" width="303" height="6" rx="3" fill="#F0F0F2"/>
    <rect x="36" y="448" width="280" height="6" rx="3" fill="#76B900"/>

    <!-- 影响 -->
    <text x="36" y="478" font-size="11" fill="#86868B">15% 涨幅意味着额外</text>
    <text x="160" y="478" font-size="11" fill="#E85D04" font-weight="700">几十万至近百万美元</text>
    <text x="263" y="478" font-size="11" fill="#86868B">开销</text>
  </g>

  <!-- ============ 5. 显卡对照卡 ============ -->
  <g id="gpu-card">
    <rect x="20" y="502" width="335" height="100" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="36" y="526" font-size="11" fill="#86868B" font-weight="600" letter-spacing="0.5">消费市场前例 · RTX 5080 显卡</text>

    <text x="36" y="570" font-size="22" fill="#86868B" font-weight="700">8,000</text>
    <text x="106" y="570" font-size="11" fill="#86868B">元</text>

    <g transform="translate(128, 562)">
      <line x1="0" y1="4" x2="45" y2="4" stroke="#E85D04" stroke-width="1.5"/>
      <path d="M 45 0 L 53 4 L 45 8 Z" fill="#E85D04"/>
    </g>
    <text x="151" y="556" font-size="9" fill="#86868B" text-anchor="middle">1个月</text>

    <text x="188" y="570" font-size="22" fill="#E85D04" font-weight="800">12,000</text>
    <text x="282" y="570" font-size="11" fill="#86868B">元</text>

    <rect x="296" y="556" width="44" height="20" rx="10" fill="#E85D04" opacity="0.12"/>
    <text x="318" y="570" font-size="11" fill="#E85D04" font-weight="700" text-anchor="middle">+50%</text>

    <text x="36" y="592" font-size="11" fill="#86868B">次旗舰显卡短短1个月内跳涨</text>
  </g>

  <!-- ============ 6. 财报关注卡 ============ -->
  <g id="earnings-card">
    <rect x="20" y="616" width="335" height="125" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="36" y="640" font-size="11" fill="#86868B" font-weight="600" letter-spacing="0.5">下周三美股盘后 · 财报关注</text>

    <text x="36" y="672" font-size="22" fill="#1D1D1F" font-weight="800">816<tspan font-size="12" font-weight="600" fill="#6E6E73"> 亿美元</tspan></text>
    <text x="36" y="688" font-size="10" fill="#86868B">上一财季营收（截至4月26日）</text>

    <text x="200" y="672" font-size="22" fill="#1D1D1F" font-weight="800">75<tspan font-size="12" font-weight="600" fill="#6E6E73">%</tspan></text>
    <text x="200" y="688" font-size="10" fill="#86868B">毛利率（去年同期 60.5%）</text>

    <line x1="36" y1="700" x2="339" y2="700" stroke="#F0F0F2" stroke-width="1"/>
    <circle cx="42" cy="720" r="3" fill="#E85D04"/>
    <text x="52" y="724" font-size="12" fill="#1D1D1F" font-weight="500">市场关注：存储涨价是否侵蚀算力芯片利润率</text>
  </g>

  <!-- ============ 7. 底部 ============ -->
  <g id="footer">
    <text x="20" y="762" font-size="10" fill="#86868B">来源：财联社 8月23日 · 编辑 史正丞</text>
    <text x="20" y="780" font-size="10" fill="#AEAEB2">DRAM 价格上涨推动存储厂商影响力提升 · 苹果、高通等亦受波及</text>
  </g>
</svg>