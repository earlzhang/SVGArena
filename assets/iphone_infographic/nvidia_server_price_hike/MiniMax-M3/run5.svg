<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" font-family="PingFang SC, Hiragino Sans GB, STHeiti, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="420" height="140" fill="#e3edf9"/>
  <text x="24" y="42" font-size="13" fill="#5b6b85" letter-spacing="1">财联社 · 8月23日</text>
  <text x="24" y="76" font-size="20" font-weight="700" fill="#1a2540">英伟达服务器传出涨价消息</text>
  <text x="24" y="106" font-size="17" font-weight="600" fill="#d35a4a">涨幅"很多情况下超过15%"</text>
  <text x="24" y="128" font-size="11" fill="#6b7891">适用于明年年初出货的 Vera Rubin / Grace Blackwell 系统</text>

  <!-- Big number highlight -->
  <rect x="20" y="158" width="380" height="92" rx="10" fill="#fff4e3" stroke="#f0d4a8" stroke-width="1"/>
  <text x="40" y="186" font-size="12" fill="#9a7a3c">价格涨幅</text>
  <text x="40" y="225" font-size="36" font-weight="800" fill="#d9822b">&gt;15%</text>
  <text x="160" y="200" font-size="11" fill="#9a7a3c">受内存芯片（DRAM）成本飙升影响</text>
  <text x="160" y="218" font-size="11" fill="#9a7a3c">微软 / 谷歌 / 甲骨文等代工客户</text>
  <text x="160" y="236" font-size="11" fill="#9a7a3c">已被告知即将上调</text>

  <!-- Price comparison - RTX 5080 -->
  <rect x="20" y="266" width="380" height="86" rx="10" fill="#eaf3ec" stroke="#c2dac9" stroke-width="1"/>
  <text x="40" y="290" font-size="13" font-weight="700" fill="#2f6b46">消费级显卡 RTX 5080</text>
  <text x="40" y="310" font-size="11" fill="#5a7a68">1个月内价格变化</text>
  <text x="40" y="340" font-size="16" font-weight="700" fill="#7a8a82">¥8,000</text>
  <line x1="115" y1="334" x2="225" y2="334" stroke="#c25a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="340" font-size="18" font-weight="800" fill="#c25a4a">¥12,000</text>
  <text x="340" y="340" font-size="11" font-weight="600" fill="#c25a4a">+50%</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#c25a4a"/>
    </marker>
  </defs>

  <!-- Server prices - the key part -->
  <rect x="20" y="366" width="380" height="180" rx="10" fill="#f4ecf3" stroke="#dac3da" stroke-width="1"/>
  <text x="40" y="392" font-size="13" font-weight="700" fill="#6b3d6b">AI 服务器单台售价（美元）</text>

  <!-- GB200 bar -->
  <text x="40" y="418" font-size="11" fill="#6b5a6b">Blackwell · NVL72 GB200</text>
  <rect x="40" y="426" width="160" height="14" rx="3" fill="#b994b9"/>
  <text x="208" y="438" font-size="12" font-weight="700" fill="#5a2f5a">$280万 - 340万</text>

  <!-- VR200 bar -->
  <text x="40" y="464" font-size="11" fill="#6b5a6b">Vera Rubin · NVL72 VR200</text>
  <rect x="40" y="472" width="320" height="16" rx="3" fill="#8a4f8a"/>
  <text x="40" y="510" font-size="14" font-weight="800" fill="#5a2f5a">$500万 - 700万 / 台</text>
  <text x="40" y="530" font-size="10" fill="#8a6a8a">15% 涨幅 ≈ 数十万至近百万美元额外开销</text>

  <!-- Financial highlight -->
  <rect x="20" y="562" width="380" height="78" rx="10" fill="#e6eef9" stroke="#b8cae3" stroke-width="1"/>
  <text x="40" y="586" font-size="12" fill="#3a5685">英伟达毛利率 · 5月财报</text>
  <text x="40" y="624" font-size="30" font-weight="800" fill="#2f5cb3">75%</text>
  <text x="130" y="608" font-size="11" fill="#3a5685">上一财年同期</text>
  <text x="130" y="626" font-size="14" font-weight="600" fill="#7a8aa8">60.5%</text>
  <text x="240" y="608" font-size="10" fill="#5a6f8f">下周三美股盘后</text>
  <text x="240" y="624" font-size="11" font-weight="600" fill="#2f5cb3">发布新财报</text>

  <!-- Industry impact -->
  <rect x="20" y="656" width="380" height="118" rx="10" fill="#fbe9e6" stroke="#e6c4be" stroke-width="1"/>
  <text x="40" y="680" font-size="13" font-weight="700" fill="#8a3a2f">行业连锁反应</text>

  <circle cx="32" cy="702" r="3" fill="#c25a4a"/>
  <text x="44" y="706" font-size="11" fill="#5a3a35">DRAM 内存涨价 · 大宗商品属性削弱</text>

  <circle cx="32" cy="724" r="3" fill="#c25a4a"/>
  <text x="44" y="728" font-size="11" fill="#5a3a35">苹果、高通等已因芯片短缺上调售价</text>

  <circle cx="32" cy="746" r="3" fill="#c25a4a"/>
  <text x="44" y="750" font-size="11" fill="#5a3a35">亚马逊、微软、谷歌、Meta 加速自研芯片</text>

  <circle cx="32" cy="768" r="3" fill="#c25a4a"/>
  <text x="44" y="772" font-size="11" fill="#5a3a35">挑战者受限于三星 / 海力士 / 美光供应</text>

  <!-- Footer note -->
  <text x="210" y="895" font-size="10" fill="#8a96aa" text-anchor="middle">存储狂潮是否会侵蚀算力龙头利润率？</text>
</svg>