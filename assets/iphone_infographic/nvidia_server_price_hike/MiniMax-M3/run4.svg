<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- 背景 -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFCFF"/>
      <stop offset="100%" stop-color="#F2F5F9"/>
    </linearGradient>
    <linearGradient id="nvidiaGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7BB800"/>
      <stop offset="100%" stop-color="#5A8F00"/>
    </linearGradient>
    <linearGradient id="warnOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9966"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <rect width="400" height="860" fill="url(#bgGrad)"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="400" height="90" fill="url(#nvidiaGreen)" opacity="0.9"/>
  <text x="20" y="35" fill="white" font-size="13" font-weight="500" letter-spacing="1">财联社 · 2025.08.23</text>
  <text x="20" y="60" fill="white" font-size="17" font-weight="700">英伟达服务器涨价</text>
  <text x="20" y="80" fill="#E8F5C8" font-size="13" font-weight="500">涨幅"很多情况下超过15%"</text>

  <!-- 核心数字卡片 -->
  <g transform="translate(20, 110)">
    <rect width="360" height="95" rx="12" fill="white" stroke="#E5E9F0" stroke-width="1"/>
    <text x="15" y="25" fill="#5A6B85" font-size="11" font-weight="500">涨价幅度</text>
    <text x="15" y="65" fill="#FF6B6B" font-size="36" font-weight="800">+15%</text>
    <text x="105" y="60" fill="#8B95A8" font-size="11">以上</text>
    <text x="15" y="83" fill="#5A6B85" font-size="11">明年起 · Vera Rubin / Grace Blackwell</text>
    
    <line x1="180" y1="15" x2="180" y2="80" stroke="#E5E9F0" stroke-width="1"/>
    
    <text x="195" y="25" fill="#5A6B85" font-size="11" font-weight="500">覆盖客户</text>
    <text x="195" y="50" fill="#2C3E50" font-size="13" font-weight="600">微软 · 谷歌 · 甲骨文</text>
    <text x="195" y="68" fill="#2C3E50" font-size="13" font-weight="600">等大型云服务商</text>
    <text x="195" y="85" fill="#8B95A8" font-size="10">数据中心运营商</text>
  </g>

  <!-- 涨价原因模块 -->
  <g transform="translate(20, 225)">
    <text x="0" y="0" fill="#2C3E50" font-size="14" font-weight="700">▎涨价根源</text>
    <rect y="10" width="360" height="75" rx="10" fill="#FFF4E6" stroke="#FFE0B2" stroke-width="1"/>
    <circle cx="25" cy="35" r="12" fill="#FF9966"/>
    <text x="25" y="40" fill="white" font-size="13" font-weight="700" text-anchor="middle">DRAM</text>
    <text x="48" y="33" fill="#2C3E50" font-size="12" font-weight="600">内存芯片成本飙升</text>
    <text x="48" y="50" fill="#5A6B85" font-size="10">动态随机存取存储器价格暴涨</text>
    <text x="48" y="68" fill="#5A6B85" font-size="10">AI算力竞争引发"大宗商品"属性重估</text>
  </g>

  <!-- 服务器价格对比 -->
  <g transform="translate(20, 320)">
    <text x="0" y="0" fill="#2C3E50" font-size="14" font-weight="700">▎机架单价（美元）</text>
    
    <!-- GB200 -->
    <rect y="12" width="360" height="68" rx="8" fill="white" stroke="#E5E9F0" stroke-width="1"/>
    <text x="15" y="32" fill="#5A6B85" font-size="11">Blackwell 架构</text>
    <text x="15" y="48" fill="#2C3E50" font-size="13" font-weight="600">NVL72 GB200</text>
    <text x="15" y="68" fill="#7BB800" font-size="16" font-weight="700">$280万 – $340万</text>
    
    <!-- 箭头 -->
    <text x="225" y="52" fill="#FF6B6B" font-size="20" font-weight="700">▶</text>
    
    <!-- VR200 -->
    <rect x="240" y="12" width="120" height="68" rx="8" fill="#FFF8E1" stroke="#FFE082" stroke-width="1"/>
    <text x="250" y="32" fill="#5A6B85" font-size="10">Vera Rubin</text>
    <text x="250" y="48" fill="#2C3E50" font-size="11" font-weight="600">NVL72 VR200</text>
    <text x="250" y="68" fill="#FF6B6B" font-size="13" font-weight="700">$500–700万</text>
  </g>

  <!-- 消费显卡涨价 -->
  <g transform="translate(20, 420)">
    <text x="0" y="0" fill="#2C3E50" font-size="14" font-weight="700">▎消费端已先行涨价</text>
    <rect y="10" width="360" height="85" rx="10" fill="white" stroke="#E5E9F0" stroke-width="1"/>
    
    <text x="15" y="35" fill="#5A6B85" font-size="11">RTX 5080 显卡</text>
    <text x="15" y="55" fill="#8B95A8" font-size="12" text-decoration="line-through">¥8,000</text>
    <text x="15" y="82" fill="#FF6B6B" font-size="20" font-weight="800">¥12,000</text>
    <text x="115" y="82" fill="#5A6B85" font-size="11">/ 一个月内涨幅 50%</text>
    
    <!-- 简化曲线 -->
    <path d="M 230 80 Q 260 65, 280 50 T 340 30" stroke="#FF6B6B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="230" cy="80" r="3" fill="#FF6B6B"/>
    <circle cx="340" cy="30" r="3" fill="#FF6B6B"/>
  </g>

  <!-- 财报前瞻 -->
  <g transform="translate(20, 525)">
    <text x="0" y="0" fill="#2C3E50" font-size="14" font-weight="700">▎下周三发布财报 · 市场焦点</text>
    <rect y="10" width="360" height="95" rx="10" fill="white" stroke="#E5E9F0" stroke-width="1"/>
    
    <!-- 三组小数据 -->
    <g transform="translate(15, 25)">
      <text x="0" y="0" fill="#8B95A8" font-size="10">上季营收</text>
      <text x="0" y="22" fill="#2C3E50" font-size="18" font-weight="700">$816<tspan font-size="11" fill="#5A6B85">亿</tspan></text>
    </g>
    
    <g transform="translate(135, 25)">
      <text x="0" y="0" fill="#8B95A8" font-size="10">当前毛利率</text>
      <text x="0" y="22" fill="#7BB800" font-size="18" font-weight="700">75%</text>
    </g>
    
    <g transform="translate(250, 25)">
      <text x="0" y="0" fill="#8B95A8" font-size="10">去年同比</text>
      <text x="0" y="22" fill="#5A6B85" font-size="18" font-weight="700">60.5%</text>
    </g>
    
    <line x1="15" y1="60" x2="345" y2="60" stroke="#E5E9F0" stroke-width="1"/>
    
    <text x="15" y="78" fill="#5A6B85" font-size="11">关注：存储涨价是否侵蚀利润率？</text>
    <text x="15" y="95" fill="#5A6B85" font-size="11">下季指引维持 74.9%–75%</text>
  </g>

  <!-- 行业连锁反应 -->
  <g transform="translate(20, 640)">
    <text x="0" y="0" fill="#2C3E50" font-size="14" font-weight="700">▎连锁反应</text>
    
    <rect y="12" width="115" height="80" rx="8" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
    <text x="57.5" y="35" fill="#2E7D32" font-size="11" font-weight="600" text-anchor="middle">科技公司</text>
    <text x="57.5" y="55" fill="#1B5E20" font-size="11" text-anchor="middle">苹果 / 高通</text>
    <text x="57.5" y="72" fill="#1B5E20" font-size="10" text-anchor="middle">被迫提价</text>
    
    <rect x="123" y="12" width="115" height="80" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
    <text x="180.5" y="35" fill="#1565C0" font-size="11" font-weight="600" text-anchor="middle">云厂商自研</text>
    <text x="180.5" y="55" fill="#0D47A1" font-size="11" text-anchor="middle">亚马逊 / 微软</text>
    <text x="180.5" y="72" fill="#0D47A1" font-size="10" text-anchor="middle">谷歌 / Meta</text>
    
    <rect x="246" y="12" width="114" height="80" rx="8" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
    <text x="303" y="35" fill="#E65100" font-size="11" font-weight="600" text-anchor="middle">挑战者</text>
    <text x="303" y="55" fill="#BF360C" font-size="10" text-anchor="middle">三星 / SK海力士</text>
    <text x="303" y="72" fill="#BF360C" font-size="10" text-anchor="middle">美光 → 关键</text>
  </g>

  <!-- 底部要点 -->
  <g transform="translate(20, 750)">
    <rect width="360" height="75" rx="10" fill="#2C3E50"/>
    <text x="15" y="22" fill="#7BB800" font-size="12" font-weight="700">▎一句话总结</text>
    <text x="15" y="42" fill="white" font-size="11.5">DRAM涨价 → 服务器提价15%+</text>
    <text x="15" y="58" fill="white" font-size="11.5">NVL72 单台价或逼近 700 万美元</text>
    <text x="15" y="74" fill="#A5D6A7" font-size="10.5">软件护城河仍使英伟达难以被替代</text>
  </g>

  <!-- 来源 -->
  <text x="200" y="845" fill="#8B95A8" font-size="9" text-anchor="middle">财联社 · 编辑 史正丞 · 数据综合自报道</text>
</svg>