<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','STHeiti','Heiti SC',sans-serif">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#F1F8E9"/>
    </linearGradient>
    <linearGradient id="warnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBEE"/>
      <stop offset="100%" stop-color="#FFCDD2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="#F7F9FB"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="390" height="5" fill="#76B900"/>

  <!-- 头部 -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="78" height="22" rx="11" fill="#EDF7E0"/>
    <text x="39" y="15" font-size="11" fill="#558B2F" text-anchor="middle" font-weight="600">财联社 · 科技</text>
    <text x="350" y="15" font-size="11" fill="#90A4AE" text-anchor="end">8月23日</text>

    <text x="0" y="52" font-size="21" font-weight="700" fill="#1A1A1A">英伟达服务器涨价</text>
    <text x="0" y="78" font-size="21" font-weight="700" fill="#1A1A1A">涨幅<tspan fill="#E53935">"超过15%"</tspan></text>
    <text x="0" y="100" font-size="11" fill="#78909C">搭载Vera Rubin、Grace Blackwell芯片</text>
  </g>

  <!-- 主数据卡 -->
  <g transform="translate(20,138)">
    <rect x="0" y="0" width="350" height="115" rx="14" fill="url(#warnGradient)" stroke="#FFB74D" stroke-width="0.5"/>
    <text x="22" y="32" font-size="13" font-weight="600" fill="#E65100">📈 涨价核心</text>

    <text x="22" y="78" font-size="56" font-weight="800" fill="#E53935" letter-spacing="-2">15<tspan font-size="38">%+</tspan></text>
    <text x="22" y="98" font-size="11" fill="#6D4C41">很多情况下涨幅</text>

    <!-- 时间线 -->
    <line x1="180" y1="35" x2="180" y2="95" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="200" y="44" font-size="11" fill="#5D4037">生效时间</text>
    <text x="200" y="64" font-size="16" font-weight="700" fill="#BF360C">2026年初</text>
    <text x="200" y="82" font-size="10" fill="#8D6E63">明年起出货的系统</text>
    <text x="200" y="98" font-size="10" fill="#8D6E63">适用范围</text>
  </g>

  <!-- 价格卡片 -->
  <g transform="translate(20,268)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#37474F">💰 旗舰产品价格</text>

    <!-- 显卡 -->
    <g transform="translate(0,12)">
      <rect x="0" y="0" width="350" height="58" rx="10" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#7E57C2"/>
      <text x="14" y="20" font-size="11" fill="#78909C">消费级显卡 RTX 5080（1个月）</text>
      <text x="14" y="42" font-size="18" font-weight="700" fill="#5E35B1">¥8,000 → ¥12,000</text>
      <text x="14" y="54" font-size="10" fill="#9575CD">涨幅 +50%</text>
      <!-- 箭头 -->
      <path d="M 280 38 L 310 38 L 304 32 M 310 38 L 304 44" stroke="#5E35B1" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="338" y="25" font-size="18" font-weight="800" fill="#E53935" text-anchor="end">+50%</text>
    </g>

    <!-- GB200 -->
    <g transform="translate(0,78)">
      <rect x="0" y="0" width="350" height="58" rx="10" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#42A5F5"/>
      <text x="14" y="20" font-size="11" fill="#78909C">Blackwell NVL72 GB200 机架</text>
      <text x="14" y="42" font-size="18" font-weight="700" fill="#1565C0">$280万 - $340万</text>
      <text x="14" y="54" font-size="10" fill="#42A5F5">单台售价 · 今年报价</text>
    </g>

    <!-- VR200 -->
    <g transform="translate(0,144)">
      <rect x="0" y="0" width="350" height="58" rx="10" fill="url(#redGradient)" stroke="#EF9A9A" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#E53935"/>
      <text x="14" y="20" font-size="11" fill="#C62828">Vera Rubin NVL72 VR200 系统</text>
      <text x="14" y="42" font-size="18" font-weight="700" fill="#B71C1C">$500万 - $700万</text>
      <text x="14" y="54" font-size="10" fill="#E57373">出货前询价 · 新一代旗舰</text>
    </g>
  </g>

  <!-- 涨价原因 -->
  <g transform="translate(20,500)">
    <rect x="0" y="0" width="350" height="84" rx="12" fill="url(#bgGradient)"/>
    <text x="20" y="25" font-size="13" font-weight="600" fill="#33691E">⚡ 涨价主因：DRAM 内存芯片成本飙升</text>
    <text x="20" y="48" font-size="11" fill="#558B2F">AI 算力芯片性能高度依赖配套内存容量</text>
    <text x="20" y="66" font-size="11" fill="#558B2F">内存从"大宗商品"变为科技行业关键筹码</text>
    <rect x="270" y="40" width="68" height="32" rx="6" fill="#FFFFFF"/>
    <text x="304" y="55" font-size="10" fill="#689F38" text-anchor="middle">核心元件</text>
    <text x="304" y="67" font-size="11" font-weight="700" fill="#33691E" text-anchor="middle">DRAM</text>
  </g>

  <!-- 利润率 + 财报 -->
  <g transform="translate(20,598)">
    <rect x="0" y="0" width="170" height="100" rx="12" fill="url(#blueGradient)"/>
    <text x="14" y="22" font-size="11" fill="#1565C0">毛利率（最新季）</text>
    <text x="14" y="58" font-size="36" font-weight="800" fill="#0D47A1">75<tspan font-size="22">%</tspan></text>
    <text x="14" y="78" font-size="10" fill="#1976D2">去年同期仅 60.5%</text>
    <text x="14" y="92" font-size="10" fill="#1976D2">市场关注能否维持</text>

    <rect x="180" y="0" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#ECEFF1"/>
    <text x="194" y="22" font-size="11" fill="#546E7A">📅 关键事件</text>
    <text x="194" y="44" font-size="14" font-weight="700" fill="#263238">下周三 美股盘后</text>
    <text x="194" y="62" font-size="11" fill="#546E7A">英伟达发布最新财报</text>
    <line x1="194" y1="72" x2="336" y2="72" stroke="#ECEFF1"/>
    <text x="194" y="88" font-size="10" fill="#78909C">存储涨价会否侵蚀利润率</text>
  </g>

  <!-- 客户与竞争 -->
  <g transform="translate(20,712)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#37474F">受波及客户与市场反应</text>

    <!-- 已涨价/收到通知 -->
    <g transform="translate(0,10)">
      <rect x="0" y="0" width="170" height="58" rx="10" fill="#FFFFFF" stroke="#ECEFF1"/>
      <text x="12" y="18" font-size="10" fill="#78909C">代工已通知涨价</text>
      <text x="12" y="36" font-size="12" font-weight="700" fill="#263238">微软 · 谷歌 · 甲骨文</text>
      <text x="12" y="50" font-size="9" fill="#90A4AE">数据中心运营商客户</text>
    </g>

    <g transform="translate(180,10)">
      <rect x="0" y="0" width="170" height="58" rx="10" fill="#FFFFFF" stroke="#ECEFF1"/>
      <text x="12" y="18" font-size="10" fill="#78909C">自研芯片应对</text>
      <text x="12" y="36" font-size="12" font-weight="700" fill="#263238">亚马逊 · Meta</text>
      <text x="12" y="50" font-size="9" fill="#90A4AE">推进内部芯片研发</text>
    </g>

    <!-- 供应链 -->
    <g transform="translate(0,76)">
      <rect x="0" y="0" width="350" height="42" rx="10" fill="#FFF8E1"/>
      <text x="14" y="17" font-size="10" fill="#F57C00">⚙️ 内存供应链</text>
      <text x="14" y="33" font-size="12" font-weight="600" fill="#E65100">三星 · SK海力士 · 美光</text>
      <text x="270" y="26" font-size="10" fill="#FB8C00" text-anchor="end">挑战者争夺焦点</text>
    </g>
  </g>

  <!-- 底部信息 -->
  <g transform="translate(20,830)">
    <text x="0" y="0" font-size="9" fill="#B0BEC5">数据来源：财联社 / 媒体公开报道 · 信息截至 8 月 23 日</text>
  </g>
</svg>