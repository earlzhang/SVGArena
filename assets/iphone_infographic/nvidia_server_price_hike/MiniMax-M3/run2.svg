<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 880" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Heiti SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF1F7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#A0D636"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="390" height="880" fill="url(#bg)"/>

  <!-- HEADER -->
  <g transform="translate(20, 22)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="#76B900"/>
    <text x="31" y="14" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI财经</text>
    <text x="72" y="15" font-size="10" fill="#94A3B8">财联社 · 8月23日</text>
    <text x="0" y="50" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.5">英伟达服务器涨价</text>
    <text x="0" y="76" font-size="13" fill="#475569">涨幅</text>
    <text x="40" y="76" font-size="13" font-weight="700" fill="#EF4444">「很多情况下超过15%」</text>
  </g>

  <!-- CARD 1: KEY STAT -->
  <g transform="translate(20, 115)" filter="url(#shadow)">
    <rect width="350" height="115" rx="14" fill="#FFFFFF"/>
    <rect x="0" y="0" width="120" height="115" rx="14" fill="#FEF2F2"/>
    <rect x="0" y="0" width="6" height="115" rx="3" fill="#EF4444"/>
    <text x="60" y="52" font-size="32" font-weight="800" fill="#EF4444" text-anchor="middle">15%+</text>
    <text x="60" y="76" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">涨幅</text>
    <text x="60" y="94" font-size="9" fill="#B91C1C" text-anchor="middle">多情形下</text>
    <text x="140" y="30" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.5">涨价核心</text>
    <text x="140" y="54" font-size="11" fill="#475569">适用：Vera Rubin / Grace Blackwell</text>
    <text x="140" y="74" font-size="11" fill="#475569">时间：2026 年初出货的系统</text>
    <text x="140" y="94" font-size="11" fill="#475569">原因：DRAM 内存芯片成本飙升</text>
  </g>

  <!-- CARD 2: PRICE COMPARISON -->
  <g transform="translate(20, 245)" filter="url(#shadow)">
    <rect width="350" height="190" rx="14" fill="#FFFFFF"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0F172A">服务器单台售价对比</text>
    <text x="20" y="48" font-size="10" fill="#94A3B8">NVL72 机架系统（美元）</text>

    <g transform="translate(20, 70)">
      <text x="0" y="0" font-size="11" font-weight="600" fill="#0F172A">GB200 NVL72</text>
      <text x="310" y="0" font-size="11" font-weight="700" fill="#475569" text-anchor="end">$280 - 340 万</text>
      <rect x="0" y="10" width="310" height="14" rx="7" fill="#F1F5F9"/>
      <rect x="0" y="10" width="140" height="14" rx="7" fill="url(#green)"/>
    </g>

    <g transform="translate(20, 115)">
      <text x="0" y="0" font-size="11" font-weight="600" fill="#0F172A">VR200 NVL72</text>
      <text x="310" y="0" font-size="11" font-weight="700" fill="#EF4444" text-anchor="end">$500 - 700 万</text>
      <rect x="0" y="10" width="310" height="14" rx="7" fill="#F1F5F9"/>
      <rect x="0" y="10" width="266" height="14" rx="7" fill="url(#red)"/>
    </g>

    <line x1="20" y1="158" x2="330" y2="158" stroke="#F1F5F9"/>
    <text x="20" y="178" font-size="11" fill="#64748B">Vera Rubin 新平台价格</text>
    <text x="232" y="178" font-size="11" font-weight="700" fill="#EF4444">较 GB200 翻倍 ↑</text>
  </g>

  <!-- CARD 3: GPU + FINANCIALS -->
  <g transform="translate(20, 450)" filter="url(#shadow)">
    <rect width="350" height="170" rx="14" fill="#FFFFFF"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#0F172A">消费显卡同步暴涨</text>
    <text x="20" y="44" font-size="10" fill="#94A3B8">次旗舰 RTX 5080 价格变化</text>

    <text x="20" y="78" font-size="20" font-weight="700" fill="#94A3B8">¥8,000</text>
    <text x="115" y="78" font-size="16" fill="#94A3B8">→</text>
    <text x="140" y="78" font-size="20" font-weight="700" fill="#EF4444">¥12,000</text>
    <text x="278" y="78" font-size="18" font-weight="800" fill="#EF4444">+50%</text>
    <text x="20" y="94" font-size="10" fill="#94A3B8">短短 1 个月内</text>

    <line x1="20" y1="108" x2="330" y2="108" stroke="#F1F5F9"/>

    <text x="20" y="128" font-size="13" font-weight="700" fill="#0F172A">最新财报表现</text>

    <text x="20" y="150" font-size="10" fill="#94A3B8">营收</text>
    <text x="20" y="164" font-size="14" font-weight="800" fill="#0F172A">$816 亿</text>

    <text x="115" y="150" font-size="10" fill="#94A3B8">毛利率</text>
    <text x="115" y="164" font-size="14" font-weight="800" fill="#76B900">75%</text>

    <text x="180" y="150" font-size="10" fill="#94A3B8">去年同期</text>
    <text x="180" y="164" font-size="11" font-weight="700" fill="#94A3B8">60.5%</text>

    <text x="260" y="150" font-size="10" fill="#94A3B8">下季预期</text>
    <text x="260" y="164" font-size="11" font-weight="700" fill="#0F172A">~75%</text>
  </g>

  <!-- CARD 4: INDUSTRY IMPACT -->
  <g transform="translate(20, 635)" filter="url(#shadow)">
    <rect width="350" height="150" rx="14" fill="#FFFFFF"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#0F172A">行业连锁反应</text>

    <rect x="20" y="44" width="24" height="24" rx="6" fill="#FEF3C7"/>
    <text x="32" y="61" font-size="14" font-weight="800" fill="#D97706" text-anchor="middle">↑</text>
    <text x="56" y="55" font-size="11" font-weight="600" fill="#0F172A">苹果、高通相继涨价</text>
    <text x="56" y="69" font-size="10" fill="#64748B">受芯片短缺影响</text>

    <rect x="20" y="80" width="24" height="24" rx="6" fill="#DBEAFE"/>
    <text x="32" y="97" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">芯</text>
    <text x="56" y="91" font-size="11" font-weight="600" fill="#0F172A">云厂商加速自研芯片</text>
    <text x="56" y="105" font-size="10" fill="#64748B">亚马逊、微软、谷歌、Meta</text>

    <rect x="20" y="116" width="24" height="24" rx="6" fill="#FCE7F3"/>
    <text x="32" y="133" font-size="13" font-weight="800" fill="#DB2777" text-anchor="middle">$</text>
    <text x="56" y="127" font-size="11" font-weight="600" fill="#0F172A">内存厂话语权提升</text>
    <text x="56" y="141" font-size="10" fill="#64748B">三星、SK 海力士、美光</text>
  </g>

  <!-- FOOTER: EARNINGS -->
  <g transform="translate(20, 800)" filter="url(#shadowDark)">
    <rect width="350" height="65" rx="14" fill="url(#dark)"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="#76B900"/>
    <circle cx="38" cy="32" r="16" fill="#76B900"/>
    <text x="38" y="37" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">财报</text>
    <text x="68" y="28" font-size="13" font-weight="700" fill="#FFFFFF">下周三盘后发布</text>
    <text x="68" y="48" font-size="10" fill="#94A3B8">市场关注：存储涨价会否侵蚀利润率</text>
  </g>
</svg>