<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF2FB"/>
      <stop offset="100%" stop-color="#F5F7FB"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#B8C4DA" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- ===== 头部 ===== -->
  <rect x="16" y="18" width="152" height="24" rx="12" fill="#DBE7FA"/>
  <text x="30" y="35" font-size="12" fill="#2B6CB0">AI 芯片 · 服务器涨价</text>
  <text x="16" y="72" font-size="22" font-weight="700" fill="#1A202C">英伟达服务器涨价，涨幅超 15%</text>
  <text x="16" y="95" font-size="11.5" fill="#718096">内存成本飙升推高 AI 服务器价格 ｜ 财联社 8月23日讯</text>

  <!-- ===== 核心数字 ===== -->
  <rect x="16" y="112" width="358" height="120" rx="14" fill="#FFFFFF" stroke="#E3E8F0" filter="url(#sh)"/>
  <rect x="16" y="112" width="6" height="120" rx="3" fill="#E8590C"/>
  <text x="40" y="141" font-size="11" fill="#A0AEC0" letter-spacing="2">涨价幅度</text>
  <text x="38" y="190" font-size="46" font-weight="700" fill="#E8590C">15%+</text>
  <text x="40" y="213" font-size="10.5" fill="#718096">很多情况下超过此幅度</text>
  <line x1="166" y1="132" x2="166" y2="214" stroke="#E3E8F0" stroke-width="1"/>
  <text x="182" y="157" font-size="11.5" fill="#2D3748">内存成本飙升推高服务器报价</text>
  <text x="182" y="181" font-size="11.5" fill="#2D3748">多家“最大客户”已被通知</text>
  <text x="182" y="205" font-size="11.5" fill="#2D3748">涨幅视芯片型号与内存配置</text>

  <!-- ===== 涨价范围 ===== -->
  <rect x="16" y="244" width="358" height="106" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="32" y="261" width="4" height="14" rx="2" fill="#2B6CB0"/>
  <text x="42" y="273" font-size="13.5" font-weight="700" fill="#1A202C">涨价范围与生效时间</text>
  <text x="32" y="299" font-size="12" fill="#4A5568">▸ 适用于 <tspan font-weight="700" fill="#2B6CB0">明年年初</tspan> 出货的 AI 服务器系统</text>
  <text x="32" y="321" font-size="12" fill="#4A5568">▸ 涉及 Vera Rubin 与 Grace Blackwell 芯片</text>
  <text x="32" y="343" font-size="12" fill="#4A5568">▸ 具体涨幅取决于芯片型号与内存配置</text>

  <!-- ===== 参考价格 ===== -->
  <rect x="16" y="362" width="358" height="126" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="32" y="379" width="4" height="14" rx="2" fill="#E8590C"/>
  <text x="42" y="391" font-size="13.5" font-weight="700" fill="#1A202C">受影响机型参考价（万美元/台）</text>

  <text x="32" y="417" font-size="11.5" fill="#4A5568">NVL72 GB200 · Blackwell 架构</text>
  <text x="358" y="417" font-size="13" font-weight="700" fill="#E8590C" text-anchor="end">280 – 340</text>
  <rect x="32" y="424" width="326" height="7" rx="3.5" fill="#EEF1F6"/>
  <rect x="32" y="424" width="142" height="7" rx="3.5" fill="#F6AD55"/>

  <text x="32" y="453" font-size="11.5" fill="#4A5568">NVL72 VR200 · Vera Rubin 架构（询价）</text>
  <text x="358" y="453" font-size="13" font-weight="700" fill="#E8590C" text-anchor="end">500 – 700</text>
  <rect x="32" y="460" width="326" height="7" rx="3.5" fill="#EEF1F6"/>
  <rect x="32" y="460" width="256" height="7" rx="3.5" fill="#ED8936"/>

  <text x="32" y="481" font-size="10.5" fill="#A0AEC0">涨价 15% → 单台额外支出数十万至近百万美元</text>

  <!-- ===== 涨价根源 ===== -->
  <rect x="16" y="500" width="358" height="92" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="32" y="517" width="4" height="14" rx="2" fill="#6B46C1"/>
  <text x="42" y="529" font-size="13.5" font-weight="700" fill="#1A202C">涨价根源：DRAM 内存</text>
  <text x="32" y="555" font-size="12" fill="#4A5568">▸ AI 算力近乎疯狂的抢购推高内存价格</text>
  <text x="32" y="577" font-size="12" fill="#4A5568">▸ 芯片性能高度依赖内存容量</text>
  <text x="358" y="577" font-size="11" fill="#6B46C1" text-anchor="end">苹果、高通也已提价</text>

  <!-- ===== 财报焦点 ===== -->
  <rect x="16" y="604" width="358" height="124" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="32" y="621" width="4" height="14" rx="2" fill="#2F855A"/>
  <text x="42" y="633" font-size="13.5" font-weight="700" fill="#1A202C">财报焦点 ｜ 下周三盘后发布</text>

  <text x="32" y="657" font-size="11.5" fill="#4A5568">上财年同期毛利率 60.5%</text>
  <rect x="32" y="663" width="222" height="9" rx="4.5" fill="#EEF1F6"/>
  <rect x="32" y="663" width="134" height="9" rx="4.5" fill="#9AE6B4"/>
  <text x="358" y="672" font-size="12" font-weight="700" fill="#2F855A" text-anchor="end">60.5%</text>

  <text x="32" y="688" font-size="11.5" fill="#4A5568">近一季毛利率 75%</text>
  <rect x="32" y="694" width="222" height="9" rx="4.5" fill="#EEF1F6"/>
  <rect x="32" y="694" width="166" height="9" rx="4.5" fill="#48BB78"/>
  <text x="358" y="703" font-size="12" font-weight="700" fill="#2F855A" text-anchor="end">75%</text>

  <text x="32" y="721" font-size="10.5" fill="#A0AEC0">关注：存储涨价是否会侵蚀算力芯片龙头利润率（Q2 指引 74.9%–75%）</text>

  <!-- ===== 连锁反应 ===== -->
  <rect x="16" y="740" width="358" height="96" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="32" y="757" width="4" height="14" rx="2" fill="#2C7A7B"/>
  <text x="42" y="769" font-size="13.5" font-weight="700" fill="#1A202C">连锁反应</text>
  <text x="32" y="792" font-size="11.5" fill="#4A5568">▸ 亚马逊/微软/谷歌/Meta 加速推进自研芯片</text>
  <text x="32" y="810" font-size="11.5" fill="#4A5568">▸ 软件护城河下，新建大型数据中心仍依赖英伟达</text>
  <text x="32" y="828" font-size="11.5" fill="#4A5568">▸ 挑战者需争取三星 / SK海力士 / 美光 的芯片供应</text>
</svg>