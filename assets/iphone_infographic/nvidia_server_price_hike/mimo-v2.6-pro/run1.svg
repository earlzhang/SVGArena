<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>英伟达服务器涨价信息图</title>
  <defs>
    <style>text{font-family:"PingFang SC","Hiragino Sans GB","STHeiti",sans-serif}</style>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6f6"/>
      <stop offset="100%" stop-color="#fff0f0"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="#f0f2f5"/>

  <!-- HEADER -->
  <text x="20" y="32" font-size="20" font-weight="700" fill="#1c1c1e">英伟达服务器传出涨价消息</text>
  <text x="20" y="58" font-size="15" fill="#6e6e73">涨幅"很多情况下超过15%"</text>
  <text x="20" y="82" font-size="10" fill="#aeaeb2">财联社 8月23日讯 · 编辑 史正丞</text>
  <line x1="20" y1="95" x2="370" y2="95" stroke="#d6dae0" stroke-width="0.5"/>

  <!-- HERO -->
  <rect x="14" y="105" width="362" height="135" rx="14" fill="url(#hg)" stroke="#ffcdd2"/>
  <path d="M195,124 L199,132 L191,132 Z" fill="#ff3b30"/>
  <text x="195" y="184" text-anchor="middle" font-size="54" font-weight="700" fill="#ff3b30">15%+</text>
  <text x="195" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1c1e">很多情况下涨幅超过 15%</text>
  <text x="195" y="230" text-anchor="middle" font-size="11" fill="#9e9e9e">内存(DRAM)芯片成本飙升 → 服务器涨价</text>

  <!-- CARD 1 -->
  <rect x="14" y="250" width="362" height="110" rx="14" fill="#fff" stroke="#e8ecf0"/>
  <rect x="30" y="265" width="8" height="8" rx="2" fill="#007aff"/>
  <text x="44" y="273" font-size="13" font-weight="700" fill="#1c1c1e">受影响芯片与时间</text>
  <circle cx="38" cy="298" r="3" fill="#007aff"/>
  <text x="48" y="303" font-size="13" fill="#1c1c1e">Vera Rubin 芯片组合</text>
  <circle cx="38" cy="320" r="3" fill="#007aff"/>
  <text x="48" y="325" font-size="13" fill="#1c1c1e">Grace Blackwell 芯片组合</text>
  <rect x="30" y="336" width="152" height="20" rx="10" fill="#e8f4ff"/>
  <text x="106" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#007aff">2026年初起出货系统</text>

  <!-- CARD 2 -->
  <rect x="14" y="370" width="362" height="130" rx="14" fill="#fff" stroke="#e8ecf0"/>
  <rect x="30" y="385" width="8" height="8" rx="2" fill="#af52de"/>
  <text x="44" y="393" font-size="13" font-weight="700" fill="#1c1c1e">高端系统定价</text>

  <text x="34" y="418" font-size="12" fill="#6e6e73">NVL72 GB200</text>
  <text x="356" y="418" text-anchor="end" font-size="13" font-weight="600" fill="#007aff">280-340万美元</text>
  <rect x="34" y="426" width="322" height="7" rx="3.5" fill="#f0f0f0"/>
  <rect x="34" y="426" width="156" height="7" rx="3.5" fill="#007aff"/>

  <text x="34" y="455" font-size="12" fill="#6e6e73">NVL72 VR200</text>
  <text x="356" y="455" text-anchor="end" font-size="13" font-weight="600" fill="#ff3b30">500-700万美元</text>
  <rect x="34" y="463" width="322" height="7" rx="3.5" fill="#f0f0f0"/>
  <rect x="34" y="463" width="322" height="7" rx="3.5" fill="#ff3b30"/>

  <text x="34" y="490" font-size="10" fill="#aeaeb2">15%涨幅 → 单台增加 42-105 万美元</text>

  <!-- CARD 3 -->
  <rect x="14" y="510" width="362" height="120" rx="14" fill="#fff" stroke="#e8ecf0"/>
  <rect x="30" y="527" width="8" height="8" rx="2" fill="#34c759"/>
  <text x="44" y="535" font-size="13" font-weight="700" fill="#1c1c1e">财务指标</text>

  <text x="34" y="575" font-size="36" font-weight="700" fill="#34c759">75%</text>
  <text x="34" y="595" font-size="10" fill="#8e8e93">当前毛利率</text>

  <text x="155" y="571" font-size="18" fill="#c7c7cc">60.5%</text>
