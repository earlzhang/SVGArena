  <text x="265" y="571" font-size="15" fill="#8e8e93">74.9-75%</text>
  <text x="265" y="591" font-size="10" fill="#8e8e93">下季指引</text>

  <circle cx="38" cy="610" r="3" fill="#ff9500"/>
  <text x="48" y="615" font-size="11" fill="#ff9500">存储涨价或侵蚀利润率 · 下周三盘后发布财报</text>

  <!-- CARD 4 -->
  <rect x="14" y="640" width="362" height="145" rx="14" fill="#fff" stroke="#e8ecf0"/>
  <rect x="30" y="657" width="8" height="8" rx="2" fill="#ff9500"/>
  <text x="44" y="665" font-size="13" font-weight="700" fill="#1c1c1e">市场连锁反应</text>

  <text x="34" y="693" font-size="12" fill="#6e6e73">RTX 5080</text>
  <text x="130" y="693" font-size="13" fill="#c7c7cc">¥8,000</text>
  <line x1="130" y1="688" x2="178" y2="688" stroke="#c7c7cc" stroke-width="0.8"/>
  <line x1="190" y1="689" x2="210" y2="689" stroke="#ff3b30" stroke-width="1.5"/>
  <path d="M205,685 L212,689 L205,693" stroke="#ff3b30" stroke-width="1.5" fill="none"/>
  <text x="220" y="693" font-size="14" font-weight="700" fill="#ff3b30">¥12,000</text>
  <text x="356" y="693" text-anchor="end" font-size="10" fill="#aeaeb2">(1个月)</text>

  <line x1="34" y1="708" x2="356" y2="708" stroke="#f0f0f0" stroke-width="0.5"/>

  <text x="34" y="732" font-size="12" font-weight="500" fill="#1c1c1e">大客户推进自研芯片</text>
  <text x="34" y="752" font-size="11" fill="#8e8e93">亚马逊 · 微软 · 谷歌 · Meta</text>

  <text x="34" y="775" font-size="11" fill="#8e8e93">DRAM供应：三星 · SK海力士 · 美光</text>

  <!-- FOOTER -->
  <text x="195" y="820" text-anchor="middle" font-size="10" fill="#aeaeb2">关键链路：DRAM成本飙升 → 服务器涨价 → 利润率承压</text>
