<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>SVG 生成能力对比</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 代码括号 < > -->
  <g fill="none" stroke="#ffffff" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 23 12 32 21 41"/>
    <path d="M43 23 52 32 43 41"/>
  </g>
  <!-- 排名柱（中间金色为冠军位）-->
  <rect x="24" y="30" width="4" height="12" rx="2" fill="#ffffff" opacity=".8"/>
  <rect x="30" y="24" width="4" height="18" rx="2" fill="#ffd54a"/>
  <rect x="36" y="34" width="4" height="8"  rx="2" fill="#ffffff" opacity=".8"/>
  <!-- AI 星光 -->
  <path d="M48 9l1.6 4.4L54 15l-4.4 1.6L48 21l-1.6-4.4L42 15l4.4-1.6z"
        fill="#ffffff"/>
</svg>
